<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Mountains at dawn with a winding path leading through the pass toward the light</title>
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="45%" stop-color="#0c1526"/>
      <stop offset="75%" stop-color="#2a2340"/>
      <stop offset="100%" stop-color="#7a4a2a"/>
    </linearGradient>
    <radialGradient id="dawn" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#f4d99a" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#e8b94f" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#c9784a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c9784a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2540"/>
      <stop offset="100%" stop-color="#12192c"/>
    </linearGradient>
    <linearGradient id="mtnMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131c30"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </linearGradient>
    <linearGradient id="mtnNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d99a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8b94f" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="url(#sky2)"/>

  <!-- faint stars, upper sky only -->
  <g fill="#f3eee4" opacity="0.55">
    <circle cx="120" cy="60" r="1.3"/>
    <circle cx="260" cy="40" r="1"/>
    <circle cx="80" cy="130" r="1"/>
    <circle cx="900" cy="55" r="1.3"/>
    <circle cx="820" cy="110" r="1"/>
    <circle cx="960" cy="140" r="1"/>
    <circle cx="500" cy="35" r="1.1"/>
  </g>

  <!-- sun / dawn glow low at the pass -->
  <circle cx="500" cy="430" r="70" fill="#f4d99a" opacity="0.85"/>
  <rect x="0" y="0" width="1000" height="640" fill="url(#dawn)"/>

  <!-- far mountains -->
  <path d="M0,300 L120,190 L230,290 L330,150 L460,300 L560,180 L680,300 L780,210 L900,300 L1000,240 L1000,420 L0,420 Z" fill="url(#mtnFar)"/>

  <!-- mid mountains with a pass/gap at center for the light -->
  <path d="M0,360 L160,240 L300,360 L390,260 L470,380 L530,380 L610,260 L700,360 L840,240 L1000,360 L1000,470 L0,470 Z" fill="url(#mtnMid)"/>

  <!-- near mountains framing the path, left -->
  <path d="M0,470 L210,300 L360,470 Z" fill="url(#mtnNear)"/>
  <!-- near mountains framing the path, right -->
  <path d="M640,470 L790,300 L1000,470 Z" fill="url(#mtnNear)"/>

  <!-- winding path through the pass -->
  <path d="M500,640 C470,560 540,520 500,470 C465,430 545,400 500,378"
        fill="none" stroke="url(#pathGrad)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <path d="M500,640 C470,560 540,520 500,470 C465,430 545,400 500,378"
        fill="none" stroke="#0b1120" stroke-width="16" stroke-linecap="round" opacity="0.35" transform="translate(0,4)"/>

  <!-- foreground ridge -->
  <path d="M0,560 C200,510 340,555 500,530 C660,505 800,545 1000,510 L1000,640 L0,640 Z" fill="#05070d"/>
</svg>
