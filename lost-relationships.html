<script>
var E=[{"l": {"bn": "মূল ভাবনা", "en": "Theme"}, "t": {"bn": "গল্পের মূল ভাবনা", "en": "The Central Idea"}, "d": {"bn": "পাশাপাশি থেকেও অচেনা—গল্পের মূল ভাবনা", "en": "The thought behind the story — close, yet strangers"}, "h": {"bn": "<p>আধুনিক জীবনে আমরা দূরের মানুষের সঙ্গে অনলাইনে যোগাযোগ রাখি, অথচ পাশের বাড়িতে কে থাকেন, তিনি কেমন আছেন—সেই খোঁজটুকুও অনেক সময় রাখি না। একই বহুতলে বসবাস, একই গেট ব্যবহার, একই শহরে চলাফেরা—তবু মানুষ মানুষের কাছে অপরিচিত। শোভন ও শ্রাবন্তীর গল্প সেই হারিয়ে যাওয়া প্রতিবেশী-সম্পর্ক, সামাজিক বিচ্ছিন্নতা এবং মানবিক মূল্যবোধের অবক্ষয়ের গল্প। তবে মানুষের প্রতি সহমর্মিতা যে এখনও বেঁচে আছে, সেটিও এই গল্পে বারবার ফিরে আসবে।<\/p>", "en": "<p>In modern life we stay in touch online with people far away, yet we often don't even know who lives next door, or whether they are well. We live in the same apartment complex, use the same gate, move around the same city — and still remain strangers to one another. The story of Shobhan and Shrabanti is about these lost neighbourly bonds, about social isolation, and about the fading of human values. But it also shows, again and again, that compassion for others is still alive.<\/p>"}}, {"l": {"bn": "পর্ব 1", "en": "Part 1"}, "t": {"bn": "পর্ব ১: এক মানবিক কাজ", "en": "Part 1: An Act of Kindness"}, "d": {"bn": "অজ্ঞান মানুষের পাশে শ্রাবন্তী; দূর থেকে দেখছে শোভন", "en": "Shrabanti beside a stranger who had collapsed; Shobhan watching from afar"}, "h": {"bn": "<p>শোভন ও শ্রাবন্তী একই অফিসে চাকরি করে, একই বহুতল আবাসনে থাকে—কিন্তু কেউ কাউকে চেনে না। তাদের ফ্ল্যাটের অংশ আলাদা, সিঁড়িও আলাদা; শুধু মূল প্রবেশদ্বার এক। দুজনের কাজের শিফটও আলাদা হওয়ায় প্রতিদিন একই অফিসে কাজ করেও তাদের দেখা হওয়ার সুযোগ হয় না।<\/p><p>আবাসনের সন্ধ্যাগুলো ছিল একইরকম—প্রতিটি ফ্ল্যাটের দরজা বন্ধ, ভেতর থেকে টিভি সিরিয়ালের সংলাপ আর মোবাইলের আলো। লিফটে হঠাৎ দেখা হলে একটাই কথা—“কেমন আছেন?” “ভালো, আপনি?”—ব্যস। ওইটুকুই ছিল সৌজন্যের সীমা। শোভন আর শ্রাবন্তীর কপালে তা-ও জোটেনি—সিঁড়ি আলাদা, শিফট আলাদা, লিফটে মুখোমুখি হওয়ার সুযোগই হয়নি।<\/p><p>একদিন অফিস থেকে ফেরার পথে শোভন রাস্তায় এক মাঝবয়সি ভদ্রলোককে মদ্যপ অবস্থায় অজ্ঞান হয়ে পড়ে থাকতে দেখল। পথচারীদের কেউ তাকিয়ে দেখল, কেউ পাশ কাটিয়ে চলে গেল। কিন্তু এক তরুণী থেমে গেল।<\/p><p>মেয়েটি ভদ্রলোকটির কাছে গিয়ে তাঁর অবস্থা বোঝার চেষ্টা করল। তাঁর মোবাইল থেকে বাড়ির লোকের নম্বর খুঁজে ফোন করল, পরিস্থিতি জানাল এবং একটি ট্যাক্সি ডেকে তাঁকে নিরাপদে বাড়ি পৌঁছে দেওয়ার ব্যবস্থা করল।<\/p><p>দূর থেকে ঘটনাটি দেখছিল শোভন। মেয়েটির চেহারার চেয়ে তার মানবিক আচরণই শোভনের মনে দাগ কাটল। সে ভাবল, অপরিচিত একজন মানুষের জন্য কেউ নিজের সময় ব্যয় করে এভাবে এগিয়ে আসে—এটাই তো মানুষের আসল পরিচয়।<\/p><p>শোভন তখনও জানত না, মেয়েটির নাম শ্রাবন্তী। সে এটাও জানত না, এই মেয়েটি তারই অফিসে, একই ফ্লোরে কাজ করে। সেদিনের পর থেকে শোভনের মনে মেয়েটির প্রতি এক অদ্ভুত ভালো লাগা জন্মাল। কিন্তু পরিচয় করার মতো সাহস বা সুযোগ—কোনোটাই তার হলো না।<\/p>", "en": "<p>Shobhan and Shrabanti worked in the same office and lived in the same multi-storey apartment complex — yet neither knew the other. Their flats were in different wings with separate staircases; only the main entrance was shared. Their work shifts were different too, so even though they worked in the same office every day, there was never a chance for them to meet.<\/p><p>The evenings in the complex were all alike — every flat's door shut, the dialogue of TV serials and the glow of mobile phones leaking from within. If neighbours happened to meet in the lift, there was only one exchange: \"How are you?\" \"Fine, and you?\" — and that was the extent of courtesy. Shobhan and Shrabanti were not even granted that much — different staircases, different shifts, and no chance ever to face each other in the lift.<\/p><p>One day, on his way home from the office, Shobhan saw a middle-aged man lying unconscious on the road, drunk. Some passers-by glanced at him, some simply walked past. But one young woman stopped.<\/p><p>The woman went up to the man and tried to understand his condition. She found a family member's number on his mobile phone and called them, explained the situation, and arranged a taxi to get him home safely.<\/p><p>Shobhan watched the whole thing from a distance. It was not her appearance but her humane conduct that left a mark on his mind. He thought: if someone spends their own time helping a total stranger like this, that is what truly shows who a person is.<\/p><p>Shobhan did not yet know that the woman's name was Shrabanti. He did not know, either, that she worked in his own office, on the same floor. From that day on, a strange fondness for her grew in his heart. But he had neither the courage nor the opportunity to introduce himself.<\/p>"}}, {"l": {"bn": "পর্ব 2", "en": "Part 2"}, "t": {"bn": "পর্ব ২: লিফটের বন্ধ দরজা", "en": "Part 2: The Closed Lift Doors"}, "d": {"bn": "লিফটে চোখাচোখি, তারপর বন্ধ দরজা", "en": "Eyes meeting at the lift, then the doors close"}, "h": {"bn": "<p>কয়েক দিন পর শোভন একটি শপিং মলে গেল। কেনাকাটা শেষে সে আরও কয়েকজনের সঙ্গে লিফটে উঠল। দরজা বন্ধ হওয়ার ঠিক আগে বাইরে দাঁড়িয়ে থাকা এক পরিচিত মুখ তার চোখে পড়ল—সেই মেয়েটি!<\/p><p>শোভন কিছু বলার আগেই লিফটের দরজা বন্ধ হয়ে গেল। লিফট থামল তিনতলায়। দরজা খুলতেই শোভন তাড়াতাড়ি বেরিয়ে সিঁড়ি দিয়ে নিচে নামল। প্রবেশপথ, দোকানের সামনে, করিডর—সব জায়গায় খুঁজল। কিন্তু মেয়েটিকে পেল না।<\/p><p>অন্যদিকে, শ্রাবন্তীও লিফটের দরজা বন্ধ হওয়ার আগে শোভনকে দেখেছিল। তারও মনে হয়েছিল, ছেলেটিকে কোথাও দেখেছে। সে অন্য লিফটে উঠে তিনতলায় গিয়ে তাকে খুঁজল। কিন্তু শোভন তখন নিচে। কিছুক্ষণ খুঁজে শ্রাবন্তীও চলে গেল।<\/p><p>মাত্র কয়েক মিনিটের ব্যবধানে দুজন মানুষ একই জায়গায় একে অপরকে খুঁজছিল—একজন নিচে, অন্যজন উপরে। অথচ তাদের দেখা হলো না।<\/p>", "en": "<p>A few days later Shobhan went to a shopping mall. After shopping, he stepped into a lift with several others. Just before the doors closed, he noticed a familiar face standing outside — that woman!<\/p><p>Before he could say anything, the lift doors shut. The lift stopped at the third floor. As soon as the doors opened, Shobhan rushed out and took the stairs down. He searched the entrance, the shopfronts, the corridors — everywhere. But he could not find her.<\/p><p>Shrabanti, for her part, had also seen Shobhan just before the doors closed. She too felt she had seen this young man somewhere. She took another lift up to the third floor and looked for him. But Shobhan was by then downstairs. After searching for a while, Shrabanti left as well.<\/p><p>Within a few minutes' gap, two people were searching for each other in the same place — one below, the other above. Yet they did not meet.<\/p>"}}, {"l": {"bn": "পর্ব 3", "en": "Part 3"}, "t": {"bn": "পর্ব ৩: শহরজুড়ে খোঁজ", "en": "Part 3: A Search Across the City"}, "d": {"bn": "নাম-ঠিকানাহীন একটি মুখের খোঁজ", "en": "Looking for a face without a name or address"}, "h": {"bn": "<p>এরপর কয়েকবার আরও দূর থেকে শ্রাবন্তীকে দেখার মতো পরিস্থিতি তৈরি হয়েছিল। একদিন বাসস্ট্যান্ডে শোভন তাকে দেখতে পেয়েও ভিড়ের মধ্যে হারিয়ে ফেলল। কখনও রাস্তার মোড়ে, কখনও দোকানের সামনে সে পরিচিত মুখটি খুঁজেছে। কিন্তু শ্রাবন্তীর সঙ্গে কথা বলার সুযোগ পায়নি।<\/p><p>একই অফিসে কাজ করেও তাদের দেখা হতো না। একজন অফিসে পৌঁছনোর আগেই অন্যজন বেরিয়ে যেত। শোভন বুঝতে পারছিল না, কীভাবে মেয়েটিকে খুঁজে পাবে। তার কাছে নাম নেই, ফোন নম্বর নেই, পরিচয়ের সূত্র নেই—শুধু একটি মুখ আর সেই মানবিক কাজের স্মৃতি।<\/p><p>এভাবেই শোভন শহরের নানা জায়গায় শ্রাবন্তীকে খুঁজতে লাগল। সে জানত না, শ্রাবন্তীও মাঝে মাঝে সেই ছেলেটির কথা ভাবে। তারও মনে প্রশ্ন জাগত—আবার কি দেখা হবে?<\/p><p>শোভনের মনে যা শুরুতে ছিল শুধু শ্রদ্ধা, তা ধীরে ধীরে চেনার ইচ্ছায় বদলে যেতে লাগল। একে ভালোবাসা বলা তখনও তাড়াতাড়ি হবে—বরং অসমাপ্ত একটি বাক্য শেষ করার অপেক্ষা বলা চলে।<\/p>", "en": "<p>After that, there were several more occasions when Shobhan might have seen Shrabanti from afar. One day at the bus stand he spotted her, but lost her in the crowd. Sometimes at a street corner, sometimes in front of a shop, he looked for that familiar face. But he never got the chance to speak to her.<\/p><p>Though they worked in the same office, they never met. One would leave before the other arrived. Shobhan could not figure out how to find the girl. He had no name, no phone number, no thread of introduction — only a face and the memory of that kind act.<\/p><p>So Shobhan went on searching for Shrabanti in different corners of the city. He did not know that Shrabanti, too, sometimes thought of that young man. She also wondered: will we meet again?<\/p><p>What had begun as mere respect in Shobhan's heart slowly turned into a wish to know her. It was too early to call it love — it was more like waiting to finish an unfinished sentence.<\/p>"}}, {"l": {"bn": "পর্ব 4", "en": "Part 4"}, "t": {"bn": "পর্ব ৪: অফিসের পিকনিক", "en": "Part 4: The Office Picnic"}, "d": {"bn": "ভিড়ে আবার দেখা, আবার হারিয়ে যাওয়া", "en": "Seen again in the crowd, lost again"}, "h": {"bn": "<p>একদিন অফিসের বার্ষিক পিকনিকের আয়োজন হলো। শোভন প্রথমে যেতে চাইছিল না, কিন্তু সহকর্মীদের অনুরোধে রাজি হলো। পিকনিকের ভিড়ে হঠাৎ সে দূরে শ্রাবন্তীকে দেখতে পেল। এত দিন ধরে যাকে খুঁজেছে, সে আজ চোখের সামনে!<\/p><p>শোভন এগিয়ে যাওয়ার কথা ভাবল, কিন্তু এক সহকর্মী তাকে অন্যদিকে ডেকে নিয়ে গেলেন। ফিরে এসে সে দেখল, শ্রাবন্তী আর সেখানে নেই। সে বাগানবাড়ির নানা জায়গায় খুঁজল, কিন্তু পেল না।<\/p><p>শ্রাবন্তীও শোভনকে দেখেছিল। সেও কথা বলার সুযোগ খুঁজছিল, কিন্তু সহকর্মীদের সঙ্গে ব্যস্ত হয়ে পড়ায় আর এগোতে পারেনি। পিকনিক শেষে দুজনেই আলাদা হয়ে গেল।<\/p><p>সেদিন শোভন এক সহকর্মীর কাছ থেকে জানতে পারল, শ্রাবন্তী তাদেরই অফিসের একই ফ্লোরে কাজ করে। শুধু তাদের শিফট আলাদা। কিন্তু সেই সহকর্মীও মেয়েটির নাম জানেন না—শুধু বললেন, “ওই অন্য শিফটের মেয়েটা তো?” অফিসেও কেউ কারও খোঁজ রাখে না। এত দিন যে দূরত্বের কারণ সে বুঝতে পারেনি, তার একটা উত্তর যেন পেল।<\/p>", "en": "<p>One day the office's annual picnic was organised. Shobhan did not want to go at first, but agreed at his colleagues' request. In the crowd at the picnic, he suddenly spotted Shrabanti in the distance. The one he had been searching for all this time was now right before his eyes!<\/p><p>Shobhan thought of going over, but a colleague called him away in another direction. When he came back, Shrabanti was no longer there. He searched all around the garden house, but could not find her.<\/p><p>Shrabanti had seen Shobhan too. She was also looking for a chance to talk, but got caught up with her colleagues and could not move forward. When the picnic ended, the two went their separate ways.<\/p><p>That day Shobhan learned from a colleague that Shrabanti worked in their own office, on the same floor. Only her shift was different. But even that colleague did not know the girl's name — he just said, \"You mean that girl from the other shift?\" In that office, too, no one kept track of anyone. Shobhan finally got an answer to why they had been kept apart all this time.<\/p>"}}, {"l": {"bn": "পর্ব 5", "en": "Part 5"}, "t": {"bn": "পর্ব ৫: একই শিফটের চেষ্টা", "en": "Part 5: Trying for the Same Shift"}, "d": {"bn": "একই শিফটে আসার চেষ্টা", "en": "Trying to line up their shifts"}, "h": {"bn": "<p>শ্রাবন্তীর সঙ্গে দেখা করার সুযোগ তৈরি করতে শোভন নিজের শিফট বদলানোর চেষ্টা করল। কাজের সময়সূচি, টিমের দায়িত্ব এবং অনুমোদনের নানা জটিলতায় প্রথমে তার আবেদন মঞ্জুর হলো না। সে বারবার কথা বলল, বিকল্প সময়ে কাজ করার প্রস্তাব দিল। অনেক চেষ্টা করার পর অবশেষে তার শিফট বদল হলো।<\/p><p>শোভন জানত না, শ্রাবন্তীও একই সময়ে শিফট বদলানোর জন্য আবেদন করেছে। সেও ভেবেছিল, একই শিফটে এলে হয়তো ছেলেটির সঙ্গে কথা বলার সুযোগ পাবে। অনেক অনুরোধের পর তারও শিফট বদলের অনুমতি মিলল।<\/p><p>কিন্তু নতুন সময়সূচি প্রকাশের পর দেখা গেল, কাজের চাপের কারণে তাদের আলাদা টিমে ভাগ করা হয়েছে। একই শিফটে এলেও তাদের কাজের জায়গা, বিরতির সময় এবং চলাচলের পথ আলাদা। আবারও দেখা হলো না।<\/p><p>শোভন আর শ্রাবন্তী কেউই জানল না, অন্যজনও একইভাবে চেষ্টা করেছে। একই অফিসে, একই ফ্লোরে, প্রায় পাশাপাশি থেকেও তারা একে অপরের কাছে অচেনাই রয়ে গেল।<\/p>", "en": "<p>To create a chance to meet Shrabanti, Shobhan tried to change his shift. Because of work schedules, team responsibilities and various approval complications, his request was first rejected. He spoke again and again, and offered alternative working hours. After much effort, his shift was finally changed.<\/p><p>Shobhan did not know that Shrabanti had applied to change her shift at the very same time. She too had thought that if they came in on the same shift, she might get a chance to talk to the young man. After many requests, her change was approved as well.<\/p><p>But when the new schedule was published, it turned out that, because of workload, they had been assigned to different teams. Even on the same shift, their workplaces, break times and routes around the office were different. Once again they did not meet.<\/p><p>Neither Shobhan nor Shrabanti knew that the other had tried in exactly the same way. In the same office, on the same floor, almost side by side, they remained strangers to each other.<\/p>"}}, {"l": {"bn": "পর্ব 6", "en": "Part 6"}, "t": {"bn": "পর্ব ৬: দুটি ছবি", "en": "Part 6: Two Photographs"}, "d": {"bn": "দুই মা, এক এজেন্সি, দুটি লুকোনো ছবি", "en": "Two mothers, one agency, two hidden photographs"}, "h": {"bn": "<p>শোভনের মা ছেলের বিয়ের জন্য একটি সম্বন্ধ খুঁজছিলেন। অন্যদিকে শ্রাবন্তীর মাও মেয়ের জন্য ভালো পাত্রের সন্ধান করছিলেন। আশ্চর্যের বিষয়, দুজনেই একই বিবাহ-সম্বন্ধের এজেন্সির সঙ্গে যোগাযোগ করেছিলেন, কিন্তু আলাদা আলাদা ঘটকের মাধ্যমে।<\/p><p>দুই ঘটকই নিজেদের মতো করে পাত্র-পাত্রীর তথ্য সংগ্রহ করলেন। তাঁরা ছবি ও কিছু সাধারণ তথ্য দিলেন, কিন্তু দুই পরিবারের মধ্যে সরাসরি ফোন নম্বর বা ঠিকানা বিনিময় করলেন না। ফলে দুই মা-ই জানতেন না, তাঁরা একই এজেন্সির মাধ্যমে যোগাযোগ করছেন; একই বিল্ডিংয়ে থাকার কথাও তাঁদের জানা ছিল না।<\/p><p>শোভনের মা যে মেয়েটির ছবি পেলেন, সেটি তিনি আলমারির ভেতরে একটি খামে রেখে দিলেন। ছবির মেয়েটি শ্রাবন্তী। অন্যদিকে, শ্রাবন্তীর মা যে ছেলেটির ছবি পেলেন, সেটি একটি ফাইলের মধ্যে রেখে বিছানার তলায় রাখা বাক্সে রাখলেন। সেই ছেলেটি শোভন।<\/p><p>দুটি ছবি—একটি আলমারির ভেতরে, অন্যটি বিছানার তলায়। দুই পরিবারেই বিয়ের আলোচনা চলছিল, অথচ কেউ জানত না যে তাদের সন্তানরা ইতিমধ্যেই অজান্তে একে অপরের জীবনে প্রবেশ করেছে।<\/p><p>দুই মা-ই বছরের পর বছর একই আবাসনে সংসার সাজিয়েছেন। শোভনের মা ভাবতেন, পাশের সিঁড়ির লোকেরা আগে কথা বলুক; শ্রাবন্তীর মাও ঠিক তাই ভাবতেন। “আমি কেন আগে যাব?”—এই ছোট্ট অহংকারটাই দুই পরিবারের মাঝখানে অদৃশ্য দেয়াল তুলে রেখেছিল। অথচ ঘটকের অফিসে গিয়ে অচেনা পরিবারের সন্ধান নিতে তাঁদের একটুও সংকোচ হয়নি।<\/p>", "en": "<p>Shobhan's mother was looking for a match for her son's marriage. On the other side, Shrabanti's mother was also looking for a good groom for her daughter. Strangely, both had contacted the same matchmaking agency, but through two different matchmakers.<\/p><p>Each matchmaker collected the details of the prospective bride and groom in his own way. They gave photographs and some general information, but did not exchange phone numbers or addresses between the two families. As a result, neither mother knew that they were dealing with the same agency, and neither knew that they lived in the same building.<\/p><p>The photograph of the girl that Shobhan's mother received, she put in an envelope inside her wardrobe. The girl in the photograph was Shrabanti. Meanwhile, the photograph of the boy that Shrabanti's mother received, she put in a file and kept in a box under the bed. That boy was Shobhan.<\/p><p>Two photographs — one inside a wardrobe, the other under a bed. Marriage talks were going on in both families, yet no one knew that their children had already, unknowingly, entered each other's lives.<\/p><p>Both mothers had run their households in the same complex for years. Shobhan's mother thought, \"Let the people from the next staircase speak first\"; Shrabanti's mother thought exactly the same. \"Why should I go first?\" — this small pride had raised an invisible wall between the two families. Yet when it came to visiting a matchmaker's office to ask about unknown families, neither of them felt the slightest hesitation.<\/p>"}}, {"l": {"bn": "পর্ব 7", "en": "Part 7"}, "t": {"bn": "পর্ব ৭: অবশেষে পরিচয়", "en": "Part 7: Introduced at Last"}, "d": {"bn": "ছিনতাইয়ের পর পরিচয়—শুভ আর শ্রাবু", "en": "After the snatching, an introduction — Shubho and Shrabu"}, "h": {"bn": "<p>একদিন বিকেলে অফিস থেকে ফেরার পথে শ্রাবন্তীর হাত থেকে এক ছিনতাইকারী মোবাইল ফোন ছিনিয়ে নিয়ে পালিয়ে গেল। শ্রাবন্তী সাহায্যের জন্য চিৎকার করল। পথচারীদের মধ্যে কেউ তাকাল, কেউ দৌড়ানোর চেষ্টা করল, কিন্তু ছিনতাইকারী দ্রুত পালাচ্ছিল।<\/p><p>সেই সময় শোভন রাস্তা দিয়ে যাচ্ছিল। চিৎকার শুনে সে ছিনতাইকারীর পিছু নিল। সামনের মোড়ে কয়েকজনের সাহায্যে তাকে আটকানো গেল এবং মোবাইলটি উদ্ধার হলো। শোভন ফোনটি হাতে নিয়ে শ্রাবন্তীর দিকে ফিরতেই দুজনের চোখাচোখি হলো। পরে শ্রাবন্তী মৃদু অনুযোগ করল—এমন ঝুঁকি না নিলেই ভালো হতো; ফোনের চেয়ে মানুষ অনেক দামি।<\/p><p>এত দিনের খোঁজাখুঁজি শেষে তারা অবশেষে সামনাসামনি দাঁড়িয়ে। শোভন ফোনটি ফিরিয়ে দিল। শ্রাবন্তী কৃতজ্ঞতা জানাল। কথায় কথায় তারা বুঝল, শপিং মলের লিফটের ঘটনাতেও দুজনেই একে অপরকে খুঁজেছিল। পিকনিকের দিনও দূর থেকে দেখেছিল, কিন্তু কথা বলা হয়নি। দুজনেই অবাক হয়ে হাসল—এতবার দেখা হওয়ার সম্ভাবনা তৈরি হয়েও কেন দেখা হয়নি!<\/p><p>পরিচয়ের সময় শোভন বলল, সবাই তাকে <b>শুভ<\/b> বলে ডাকে। শ্রাবন্তী জানাল, তাকে সবাই <b>শ্রাবু<\/b> বলে ডাকে। ছিনতাইয়ের পর শ্রাবন্তী অচেনা মানুষকে নিজের নাম-ঠিকানা বলতে সতর্ক ছিল, আর সেই দ্বিধা টের পেয়ে শোভনও কিছু জিজ্ঞেস করল না। তাই তারা পূর্ণ নাম বা কোথায় থাকে, তা বলল না; শুধু ফোন নম্বর বিনিময় করল।<\/p><p>সেই রাতেই শ্রাবুর মেসেজ এল—“বাড়ি পৌঁছে গেছি। আবারও ধন্যবাদ।” শুভ উত্তর দিল। তারপর শুরু হলো ফোনে কথা বলা, মেসেজ চালাচালি, অফিসের গল্প, পছন্দ-অপছন্দ ভাগ করে নেওয়া। ধীরে ধীরে বন্ধুত্ব গভীর হতে লাগল। প্রথমে কৃতজ্ঞতা আর শ্রদ্ধা, তারপর প্রতিদিনের মেসেজের অপেক্ষা, তারপর এক টান—যার কোনো নাম কেউই দিল না। ঠিকানা বা পুরো নামের প্রসঙ্গ উঠলেই হেসে বিষয় পাল্টে যেত—ডাকনামের এই ছোট্ট আড়ালটুকু দুজনেরই ভালো লাগত।<\/p><p>তারা জানত না, তাদের আসল নাম শোভন ও শ্রাবন্তী—সেই নামই দুই ঘটক তাদের বাবা-মাকে জানিয়েছেন। তারা এটাও জানত না, তারা একই বিল্ডিংয়ের বাসিন্দা। আধুনিক জীবনের অদ্ভুত দূরত্ব তাদের এমনভাবে আলাদা রেখেছিল যে নিজেদের প্রতিবেশী হওয়ার কথাটুকুও তারা জানত না।<\/p>", "en": "<p>One afternoon, on her way home from the office, a snatcher grabbed Shrabanti's mobile phone and ran. Shrabanti cried out for help. Among the passers-by, some looked on, some tried to run after him, but the thief was fleeing fast.<\/p><p>Shobhan happened to be walking along that road. Hearing the cry, he chased after the snatcher. At the next turn, with the help of a few others, the thief was stopped and the phone was recovered. The police were informed. Holding the phone, Shobhan turned to Shrabanti, and their eyes met. Later Shrabanti gently scolded him: it would have been better not to take such a risk; people are far more precious than phones.<\/p><p>After all those days of searching, they were finally standing face to face. Shobhan handed back the phone. Shrabanti thanked him. As they talked, they realised that at the mall lift, too, each had looked for the other. On the day of the picnic they had also seen each other from afar but had not spoken. Both laughed in amazement — so many chances to meet, and yet they never had!<\/p><p>While introducing himself, Shobhan said everyone called him <b>Shubho<\/b>. Shrabanti said everyone called her <b>Shrabu<\/b>. After the snatching, Shrabanti was cautious about telling a stranger her name and address, and Shobhan, sensing her hesitation, did not ask. So they did not give their full names or say where they lived. They only exchanged phone numbers.<\/p><p>That very night a message from Shrabu arrived — \"Reached home. Thanks again.\" Shubho replied. Then began the phone calls, the message exchanges, office stories, sharing likes and dislikes. Slowly their friendship deepened. At first it was gratitude and respect, then the wait for each day's messages, then a pull that neither of them put a name to. Whenever the question of an address or full name came up, it was laughed off and the subject changed — both liked the little veil of nicknames.<\/p><p>They did not know that their real names were Shobhan and Shrabanti — the very names the two matchmakers had given their parents. Nor did they know that they lived in the same building. The strange distance of modern life had kept them so far apart that they did not even know they were neighbours.<\/p>"}}, {"l": {"bn": "পর্ব 8", "en": "Part 8"}, "t": {"bn": "পর্ব ৮: যে বাড়িতে যাওয়ার কথা ছিল না", "en": "Part 8: The House They Weren't Meant to Visit"}, "d": {"bn": "মেয়ে দেখার রবিবার, চেনা এক গেটের সামনে", "en": "The Sunday of the bride-viewing, at a familiar gate"}, "h": {"bn": "<p>শোভনের মা বিয়ের কথা নিয়ে আর দেরি করতে রাজি নন। এক রবিবার সকালে তিনি প্রায় জোর করেই শোভনকে মেয়ে দেখতে নিয়ে যাওয়ার জন্য তৈরি হতে বললেন। শোভন আপত্তি করলেও মা জানালেন, আগে মেয়েটিকে দেখে আসুক; পছন্দ না হলে বিয়ে হবে না।<\/p><p>ঠিক একই দিনে শ্রাবন্তীর মাও মেয়েকে জানিয়ে দিলেন, পাত্রপক্ষ আসবে। শ্রাবন্তী বিয়ের জন্য প্রস্তুত ছিল না, কিন্তু মায়ের অনুরোধে রাজি হলো। পাত্রের নাম সে শুনেছে—শোভন। কিন্তু এই নামের মানুষ তো কম নেই; তার শুভ যে এই শোভনই হতে পারে, সে কথা তার মাথাতেই আসেনি।<\/p><p>শোভন ও তার মা গাড়িতে করে প্রথমে বিবাহ-সম্বন্ধের এজেন্সির অফিসে গেলেন। সেখানে পাত্রীর ঘটক তাঁদের সঙ্গে যোগ দিলেন। তারপর সবাই গাড়িতে করে মেয়ের বাড়ির উদ্দেশে রওনা হলো। অন্যদিকে, শ্রাবন্তী বাড়িতে তৈরি হয়ে অতিথিদের জন্য অপেক্ষা করছিল।<\/p><p>গাড়ি একটি বহুতল আবাসনের সামনে এসে থামল। শোভন নেমেই চমকে গেল—এ তো তার নিজের বিল্ডিং! প্রতিদিন যে মূল গেট দিয়ে সে যাতায়াত করে, ঠিক সেই গেট।<\/p><p>শোভনের মা চারদিকে তাকিয়ে অবাক হয়ে বললেন, “এ তো আমাদেরই বিল্ডিং! আপনি নিশ্চয়ই ভুল করছেন—আমরা তো মেয়ের বাড়ি যাব।” কিন্তু ঘটক ঠিকানার কাগজ মিলিয়ে বললেন, “না, আমি ঠিক জায়গাতেই নিয়ে এসেছি। এই বিল্ডিংয়েই মেয়ের বাড়ি।” নিরাপত্তারক্ষীর কাছ থেকে ফ্ল্যাটের দিক জেনে তাঁরা আলাদা সিঁড়ির দিকে এগোলেন।<\/p><p>শোভন এখনও জানে না, কোন ফ্ল্যাটে যাচ্ছে। শ্রাবন্তীও জানে না, তার বাড়িতে আসা পাত্রটি তারই শুভ। দুই মা জানেন না, তাঁদের সন্তানরা একই বিল্ডিংয়ে থাকে। এত দিনের খোঁজাখুঁজি, একই অফিস, একই মূল গেট—সব সত্য যেন একটি দরজার ওপারে অপেক্ষা করছে।<\/p>", "en": "<p>Shobhan's mother was not willing to delay the marriage any longer. One Sunday morning she almost forced Shobhan to get ready to go and see a girl. Shobhan objected, but his mother said: first see the girl; if you don't like her, there will be no marriage.<\/p><p>On that very same day, Shrabanti's mother informed her daughter that the groom's family would be visiting. Shrabanti was not ready for marriage, but at her mother's request she agreed. She had heard the groom's name — Shobhan. But there are many people with that name; it never occurred to her that her Shubho could be this Shobhan.<\/p><p>Shobhan and his mother went by car, first to the matchmaking agency's office. There the bride's matchmaker joined them. Then all of them set off in the car for the girl's house. Meanwhile Shrabanti, dressed at home, waited for the guests.<\/p><p>The car stopped in front of a multi-storey apartment complex. Shobhan stepped out and froze — this was his own building! The very main gate he passed through every day.<\/p><p>Looking around in astonishment, Shobhan's mother said, \"This is our building's gate! You must be making a mistake — we're going to the girl's house.\" But the matchmaker checked the address slip and said, \"No, I've brought you to the right place. The girl's home is in this very building.\" After learning from the security guard which wing it was, they walked towards a separate staircase.<\/p><p>Shobhan still did not know which flat he was going to. Shrabanti did not know that the groom coming to her house was her own Shubho. The two mothers did not know that their children lived in the same building. After all the searching, the same office, the same main gate — every truth seemed to be waiting behind a single door.<\/p>"}}, {"l": {"bn": "পর্ব 9", "en": "Part 9"}, "t": {"bn": "পর্ব ৯: দরজার ওপারে", "en": "Part 9: Behind the Door"}, "d": {"bn": "দরজা খুলতেই রহস্য ভাঙল—দুই পরিবার অবাক", "en": "The door opens, the mystery breaks — two families astonished"}, "h": {"bn": "<p>শ্রাবন্তী বসার ঘরে বসে ছিল। মা বারবার ঘড়ি দেখছিলেন। অতিথিরা যে রওনা দিয়েছেন, সেই খবর তিনি আগেই পেয়েছেন। শ্রাবন্তী বাইরে থেকে শান্ত থাকার চেষ্টা করলেও তার মন বারবার ফোনের দিকে চলে যাচ্ছিল। কিছুক্ষণ আগেই শুভকে মেসেজ পাঠানোর কথা ভেবেছিল, কিন্তু পাঠায়নি।<\/p><p>এদিকে শোভন মায়ের সঙ্গে সিঁড়ি বেয়ে উঠছিল। ঘটক ফ্ল্যাটের নম্বর মিলিয়ে দরজার সামনে দাঁড়ালেন। শোভনের মা ছেলের জামার ভাঁজ ঠিক করে দিয়ে নিচু গলায় বললেন,<\/p><p class=\"d\">— এবার অন্তত মুখটা গোমড়া করে থাকিস না। মেয়ের বাড়ি এসেছি, ভদ্রভাবে কথা বলবি।<\/p><p>শোভন জোর করে হাসল। তার মনে হচ্ছিল, কোথায় যেন এই জায়গাটাকে সে খুব ভালো করে চেনে। অথচ এত দিন সে কখনও এই সিঁড়ি দিয়ে ওঠেনি।<\/p><p>ঘণ্টি বাজল।<\/p><p>ভেতর থেকে শ্রাবন্তীর মা দরজা খুলতে এগিয়ে এলেন। দরজা খোলার আগে তিনি মেয়েকে বললেন,<\/p><p class=\"d\">— ওরা এসে গেছে, শ্রাবু। তুই একটু পরে বাইরে আসিস।<\/p><p>দরজা খুলতেই দুই মায়ের মধ্যে সৌজন্য বিনিময় হলো। ঘটক পরিচয় করিয়ে দিলেন। শোভন মাথা নিচু করে নমস্কার করল। তার চোখ তখনও ঘরের ভেতর কাউকে খুঁজছিল না—সে শুধু এই অস্বস্তিকর আনুষ্ঠানিকতা যত তাড়াতাড়ি সম্ভব শেষ করতে চাইছিল।<\/p><p>শ্রাবন্তীর মা অতিথিদের বসতে বলে মেয়েকে ডাকলেন,<\/p><p class=\"d\">— শ্রাবু, একবার বাইরে আয় মা।<\/p><p>ঘরের ভেতর থেকে শ্রাবন্তী বেরিয়ে এল।<\/p><p>শোভন প্রথমে শুধু পায়ের শব্দ শুনল। তারপর মাথা তুলে তাকাল।<\/p><p>তার সামনে দাঁড়িয়ে আছে শ্রাবু।<\/p><p>আর শ্রাবন্তীর চোখ পড়ল সেই ছেলেটির ওপর—তার শুভ!<\/p><p>কয়েক সেকেন্ড ঘরে এমন নীরবতা নেমে এল, যেন কেউ হঠাৎ সময় থামিয়ে দিয়েছে। শ্রাবন্তীর হাতে থাকা ট্রেটা কেঁপে উঠল। শোভন উঠে দাঁড়াতে গিয়ে আবার বসে পড়ল।<\/p><p class=\"d\">— শুভ!—শ্রাবন্তীর মুখ দিয়ে অজান্তে বেরিয়ে গেল।<\/p><p class=\"d\">— শ্রাবু!—শোভনও একই সঙ্গে বলে উঠল।<\/p><p>দুই মা অবাক হয়ে একে অপরের মুখের দিকে তাকালেন।<\/p><p class=\"d\">— তোমরা আগে থেকেই একে অপরকে চেনো?—শোভনের মা জিজ্ঞাসা করলেন।<\/p><p>শ্রাবন্তী লজ্জা পেয়ে মাথা নিচু করল। শোভন ধীরে ধীরে বলল,<\/p><p class=\"d\">— হ্যাঁ, মা। আমরা কিছুদিন ধরে কথা বলছি। তবে আমরা জানতাম না, আমাদের বাড়ির লোক একই সম্বন্ধের কথা ভাবছেন।<\/p><p>ঘটক দুজনের মুখের দিকে তাকিয়ে হতবাক। তাঁদের দেওয়া ছবি, বলা নাম—সব যেন হঠাৎ একসঙ্গে মিলে গেল।<\/p><p>শ্রাবন্তীর মা অবিশ্বাসের সুরে বললেন,<\/p><p class=\"d\">— কিন্তু তোমরা পরিচিত হলে কোথায়? আর শোভন, তুমিও কি এই বিল্ডিংয়েই থাকো?<\/p><p>শোভন একটু থেমে উত্তর দিল,<\/p><p class=\"d\">— আমি এই বিল্ডিংয়েই থাকি, কাকিমা। অন্য দিকের সিঁড়ি দিয়ে উঠি।<\/p><p>শ্রাবন্তীর মা যেন কথাটা বিশ্বাস করতে পারছিলেন না।<\/p><p class=\"d\">— কী বলছ! শ্রাবন্তীও তো এখানেই থাকে!<\/p><p>ঘরের সবাই চুপ করে গেল।<\/p><p>এত দিন ধরে একই বিল্ডিংয়ে বসবাস, একই মূল গেট ব্যবহার, একই শহরে একে অপরকে খুঁজে বেড়ানো—অথচ কারও জানা ছিল না যে তারা প্রতিবেশী।<\/p><h3>দুই পরিবার, বিস্ময়ে<\/h3><p>প্রথম বিস্ময় কেটে গেলে সবাই বসে কথা বলতে শুরু করলেন। শোভন ও শ্রাবন্তী নিজেদের পরিচয়ের ঘটনাগুলো খুলে বলল—রাস্তায় অসুস্থ মানুষকে সাহায্য করা, শপিং মলের লিফট, পিকনিক, বারবার দেখা হওয়ার সম্ভাবনা তৈরি হয়েও হারিয়ে যাওয়া, আর শেষে মোবাইল ছিনতাইয়ের ঘটনায় পরিচয়।<\/p><p>শ্রাবন্তীর মা অবাক হয়ে বললেন,<\/p><p class=\"d\">— এত দিন ধরে একই বিল্ডিংয়ে থেকেও তোমরা একে অপরকে চিনতে পারোনি?<\/p><p>শোভন একটু লজ্জা পেয়ে বলল,<\/p><p class=\"d\">— আমাদের সিঁড়ি আলাদা, কাকিমা। অফিসেও শিফট আলাদা ছিল। তাই কখনও পরিচয় হয়নি।<\/p><p>শ্রাবন্তী মৃদু স্বরে বলল,<\/p><p class=\"d\">— কিন্তু এখন ভাবলে অবাক লাগে। এত কাছাকাছি থেকেও আমরা একে অপরের কাছে কত দূরের মানুষ ছিলাম!<\/p><p>দুই পরিবার কিছুক্ষণ চুপ করে রইল। বিস্ময় আর হাসির মাঝখানে একটি প্রশ্ন ঘরে অপেক্ষা করছিল—আর তার উত্তরের খোঁজ শুরু হলো পরের দিনগুলোতে।<\/p>", "en": "<p>Shrabanti was sitting in the living room. Her mother kept looking at the clock. She had already been told that the guests had set out. Shrabanti tried to look calm on the outside, but her mind kept drifting to her phone. A little earlier she had thought of messaging Shubho, but had not.<\/p><p>Meanwhile Shobhan was climbing the stairs with his mother. The matchmaker checked the flat number and stopped in front of a door. Shobhan's mother straightened the folds of her son's shirt and said in a low voice,<\/p><p class=\"d\">— At least this time don't keep a sour face. We've come to a girl's house; speak politely.<\/p><p>Shobhan forced a smile. He felt that somehow he knew this place very well. Yet he had never climbed this staircase before.<\/p><p>The doorbell rang.<\/p><p>Shrabanti's mother came forward to open the door. Before opening it she said to her daughter,<\/p><p class=\"d\">— They're here, Shrabu. Come out a little later.<\/p><p>When the door opened, the two mothers exchanged courtesies. The matchmaker made the introductions. Shobhan bowed his head and folded his hands in greeting. His eyes were not searching the room for anyone — he only wanted to get this awkward formality over with as soon as possible.<\/p><p>Shrabanti's mother asked the guests to sit and called her daughter,<\/p><p class=\"d\">— Shrabu, come out once, dear.<\/p><p>Shrabanti came out of the inner room.<\/p><p>At first Shobhan only heard footsteps. Then he lifted his head and looked.<\/p><p>Standing before him was Shrabu.<\/p><p>And Shrabanti's eyes fell on that young man — her Shubho!<\/p><p>For a few seconds such silence fell on the room that it seemed someone had stopped time. The tray in Shrabanti's hand trembled. Shobhan tried to stand up and sat down again.<\/p><p class=\"d\">— Shubho! — it escaped Shrabanti's lips involuntarily.<\/p><p class=\"d\">— Shrabu! — Shobhan cried out at the same moment.<\/p><p>The two mothers stared at each other in astonishment.<\/p><p class=\"d\">— Do you two already know each other? — Shobhan's mother asked.<\/p><p>Shrabanti lowered her head in embarrassment. Shobhan said slowly,<\/p><p class=\"d\">— Yes, Ma. We've been talking for some time. But we didn't know that our families were thinking of the same match.<\/p><p>The matchmaker stared at their faces, speechless. The photographs they had given, the names they had told — everything suddenly fell into place at once.<\/p><p>Shrabanti's mother said in disbelief,<\/p><p class=\"d\">— But where did you two meet? And Shobhan, do you live in this building too?<\/p><p>Shobhan paused for a moment and answered,<\/p><p class=\"d\">— I live in this very building, Auntie. I use the other staircase.<\/p><p>Shrabanti's mother could hardly believe it.<\/p><p class=\"d\">— What are you saying! Shrabanti lives right here too!<\/p><p>The whole room fell silent.<\/p><p>Living for so long in the same building, using the same main gate, searching for each other in the same city — and none of them had known they were neighbours.<\/p><h3>Two Families, Astonished<\/h3><p>Once the first shock passed, everyone sat down and began to talk. Shobhan and Shrabanti told the story of how they had met — helping a sick man on the road, the mall lift, the picnic, the repeated chances to meet that slipped away, and finally the phone-snatching incident that introduced them.<\/p><p>Shrabanti's mother said in wonder,<\/p><p class=\"d\">— All this time in the same building, and you two never recognised each other?<\/p><p>Shobhan said, a little embarrassed,<\/p><p class=\"d\">— Our staircases are different, Auntie. Even at the office our shifts were different. So we never got introduced.<\/p><p>Shrabanti said softly,<\/p><p class=\"d\">— But it's amazing when I think about it now. Living so close, how far apart we were!<\/p><p>The two families fell silent for a while. Between astonishment and laughter, a question waited in the room — and the search for its answer began in the days that followed.<\/p>"}}, {"l": {"bn": "পর্ব 10", "en": "Part 10"}, "t": {"bn": "পর্ব ১০: ছোট ছোট দরজা", "en": "Part 10: Small Doors"}, "d": {"bn": "সেই প্রশ্ন, ছোট্ট নমস্কার, বন্ধ দরজা আর রবিবারের চা", "en": "The question, a small greeting, a closed door, and Sunday tea"}, "h": {"bn": "<h3>১. সেদিনের প্রশ্ন<\/h3><p>সেদিন সন্ধ্যায় অতিথিরা চলে গেলে দুই পরিবার উঠোনের বেঞ্চে এসে বসল। প্রশ্নটা তখন সবার মনেই—কেন? এত বছরে কেউ কাউকে চেনার চেষ্টাও করেনি কেন?<\/p><p>শোভনের মা দীর্ঘশ্বাস ফেলে বললেন,<\/p><p class=\"d\">— প্রথম কারণটা আমারই স্বীকার করা উচিত—অহংকার। আমি ভাবতাম, ওরা আগে কথা বলুক। ওরাও নিশ্চয়ই ভাবত, আমরাই আগে বলি। দুই পক্ষ অপেক্ষা করেছি, কেউ প্রথম পা বাড়াইনি। ছেলের বিয়ের জন্য ঘটকের দ্বারস্থ হলাম, অথচ পাশের সিঁড়ির মেয়েটির খোঁজই রাখিনি।<\/p><p>শ্রাবন্তীর মা মাথা নাড়লেন।<\/p><p class=\"d\">— আর দ্বিতীয় কারণ—দরকারই পড়ত না। আগে বিপদে-আপদে পাশের দরজায় ছুটতে হতো। এখন সব কিছুর জন্য একটা ফোন।<\/p><p>শ্রাবন্তী ধীরে ধীরে বলল,<\/p><p class=\"d\">— সত্যিই তাই। গত শীতে তিনতলার ওই দাদিমা হঠাৎ অসুস্থ হলেন। অ্যাম্বুলেন্স এল, তাঁকে নিয়ে গেল—আমরা পরে শুনলাম। দোতলার এক কাকুর মৃত্যুর দিনও তাই। শববাহী গাড়ি এল, সব ব্যবস্থা ফোনেই হয়ে গেল। সিঁড়িতে শুধু একটা নোটিস ঝুলল।<\/p><p>শোভন যোগ করল,<\/p><p class=\"d\">— অনুষ্ঠানেও একই। বিয়ে, অন্নপ্রাশন সবই সামাজিক অনুষ্ঠান ভবনে, ক্যাটারারের হাতে। প্রতিবেশীকে নিমন্ত্রণ মানে কার্ড দিয়ে আসা—পাঁচ মিনিটের সৌজন্য সাক্ষাৎ, চা না খেয়েই।<\/p><p>শোভনের মা বললেন,<\/p><p class=\"d\">— ছোটদের দেখো। কেউ সাঁতার শিখছে, কেউ পয়সা দিয়ে খেলার একাডেমিতে। নিচের খেলার জায়গা ফাঁকা পড়ে থাকে। এক বিল্ডিংয়ে থেকেও ওদের বন্ধু আলাদা ক্লাবের, আলাদা কোচিংয়ের।<\/p><p>শ্রাবন্তীর মা শেষে বললেন,<\/p><p class=\"d\">— আর বাকি সময়টা কাটে মোবাইলে আর টিভি সিরিয়ালে। অন্যের জীবনের খোঁজ নেব কখন? পর্দার মানুষদের কান্নায় চোখ ভিজে যায়, অথচ দরজার ওপারের মানুষটির খবর রাখি না।<\/p><p>ঘরে কয়েক মুহূর্ত নীরবতা নামল। কোনো একটি কারণই বড় নয়, আবার সব মিলিয়ে বড়। সম্পর্ক তো গড়ে ওঠে দরকার থেকে—আর সেই দরকার আমরা টাকা দিয়ে কিনে নিয়েছি।<\/p><p>সেদিন বিয়ের সিদ্ধান্ত সঙ্গে সঙ্গে নেওয়া হলো না। দুই পরিবার ঠিক করল, শোভন ও শ্রাবন্তী নিজেদের মতো করে সময় নেবে। তাদের বন্ধুত্বকে বোঝার, ভবিষ্যৎ নিয়ে খোলাখুলি কথা বলার সুযোগ থাকবে। বিয়ে কোনো চাপের সিদ্ধান্ত হবে না।<\/p><p>কিন্তু সেদিন থেকে বিল্ডিংয়ের পরিবেশে ছোট্ট পরিবর্তন শুরু হলো। শোভনের মা শ্রাবন্তীর মাকে বললেন, “এবার থেকে শুধু বিয়ের কথা হলেই নয়, মাঝে মাঝেও দেখা করব।” শ্রাবন্তীর মা হেসে বললেন, “অবশ্যই। এত দিন একই বাড়ির মানুষ হয়েও অচেনা ছিলাম, আর নয়।”<\/p><h3>২. একটি ছোট্ট নমস্কার<\/h3><p>পরিচয়ের পরদিন সকালে শোভন গেটের কাছে দাঁড়ানো এক প্রতিবেশীকে হাত তুলে নমস্কার জানাল। ভদ্রলোক প্রথমে পিছন ফিরে তাকালেন—ভেবেছিলেন নিশ্চয়ই অন্য কাউকে। তারপর অবাক হয়ে হাসলেন।<\/p><p class=\"d\">— নমস্কার! ছ’বছর এই বিল্ডিংয়ে আছি, এই প্রথম কেউ আগে নমস্কার করল।<\/p><p>পরদিন তিনি নিজেই বললেন, “আজ বৃষ্টি হবে মনে হচ্ছে—ছাতা এনেছেন?” কথাটা সামান্য, কিন্তু সেদিন থেকে গেটের সামনে দাঁড়ানো মানুষদের ভাবভঙ্গি বদলাতে লাগল। আবাসনে এক নতুন ভাড়াটে পরিবার এসেছিল—আগে হলে মালপত্র নামানো দেখে সবাই দরজা বন্ধ করে দিত। এবার শোভনের মা চা-বিস্কুট নিয়ে গিয়ে বললেন, “কিছু লাগলে ডাকবেন।”<\/p><p>সেদিন সকালেই শ্রাবন্তীর মা কিছুটা দ্বিধা নিয়ে পাশের সিঁড়ির তিনতলার দরজায় কড়া নাড়লেন। হাতে এক বাটি পায়েস। দরজা খুললেন এক বৃদ্ধা, চোখে অবাক দৃষ্টি।<\/p><p class=\"d\">— আমি ওই দিকের সিঁড়িতে থাকি। এত বছর কাছে থেকেও কখনও আসিনি—আজ এলাম।<\/p><p>বৃদ্ধা কিছুক্ষণ কিছু বলতে পারলেন না। তারপর হেসে বললেন,<\/p><p class=\"d\">— কত বছর পর আমার দরজায় কেউ কড়া নাড়ল, জানেন? ভেতরে আসুন।<\/p><h3>৩. বন্ধ দরজার ওপারে<\/h3><p>এক শনিবার সকালে শ্রাবন্তী লক্ষ করল, তিনতলার দাদিমার দরজার সামনে দু’দিনের খবরের কাগজ জমে আছে। পাশের ফ্ল্যাটে জিজ্ঞেস করতে কেউ কাঁধ ঝাঁকাল, “হয়তো ছেলের কাছে গেছেন। আমাদের কী?” আরেকজন বলল, “ঝামেলায় জড়িয়ে লাভ কী?”<\/p><p>শ্রাবন্তী বারবার কড়া নাড়ল। সাড়া নেই। সে শোভনকে ফোন করল। নিরাপত্তারক্ষীর খাতা থেকে দাদিমার ছেলের নম্বর নিয়ে তাঁকে ফোন করা হলো। তিনি তখন দূরের শহরে; তাঁর অনুমতি নিয়ে দরজা খোলা হলো, আর দেখা গেল দাদিমা জ্বরে বিছানায় পড়ে আছেন, উঠতে পারছেন না। ডাক্তার ডাকা হলো, সময়মতো ওষুধ দেওয়া হলো।<\/p><p>একটু আগেই যাঁরা “আমাদের কী?” বলেছিলেন, তাঁরাই এবার দরজার সামনে এসে দাঁড়ালেন—কেউ স্যুপ নিয়ে, কেউ ফল নিয়ে। দাদিমা ক্ষীণ হেসে বললেন,<\/p><p class=\"d\">— দু’দিন ধরে ভাবছিলাম—কেউ কি আসবে?<\/p><h3>৪. সবার সমস্যা, কারও দায়িত্ব নয়<\/h3><p>সেই সময় লিফট মাঝেমধ্যে আটকে যাচ্ছিল, ছাদের ট্যাংক থেকে জল চুঁইয়ে পড়ছিল। বাসিন্দাদের হোয়াটসঅ্যাপ গ্রুপে রোজ অভিযোগের বন্যা, কিন্তু সমাধানের বেলায় সবাই চুপ। “কেউ একজন দেখুক!” “আমি তো সারা দিন অফিসে।” সবাই অপেক্ষা করছিল সেই “কেউ একজন”-এর জন্য।<\/p><p>শোভন গ্রুপে লিখল, “রবিবার সকালে উঠোনে চা খেতে খেতে কথা বলি। পারলে আসবেন।” প্রথমবার এলেন সাতজন। কোটেশন জোগাড়ের দায়িত্ব নিল শোভন। বাকিরা ভাগ করে নিলেন—কেউ হিসাব, কেউ মিস্ত্রির সঙ্গে কথা, কেউ মাসিক সামান্য চাঁদা তোলার ভার। পরের মাসেই লিফট মেরামত হলো। সেই রবিবারের আড্ডা ধীরে ধীরে আবাসনের নিয়মিত অভ্যাস হয়ে উঠল।<\/p><p>ক্রমে আরও পরিবার সেই রবিবারের আড্ডায় যোগ দিল। কারও নাম জানা হলো, কারও কাজের কথা, কারও অসুস্থ বাবা-মায়ের কথা, কারও একা থাকার অভিজ্ঞতা। একে অপরকে সাহায্য করার জন্য একটি সাধারণ যোগাযোগ-তালিকাও তৈরি হলো—কারও ব্যক্তিগত গোপনীয়তা ভঙ্গ না করে, স্বেচ্ছায় দেওয়া নম্বর দিয়ে।<\/p><p>এক বৃদ্ধ প্রতিবেশী বললেন,<\/p><p class=\"d\">— এত দিন ভেবেছিলাম, এই বাড়িতে সবাই নিজের নিজের জগতে থাকে। আজ মনে হচ্ছে, আমরা চাইলে আবার প্রতিবেশী হতে পারি।<\/p><p>শোভন বুঝল, সম্পর্ক গড়তে সব সময় বড় কোনো ঘটনার দরকার হয় না। কখনও একটা নমস্কার, কখনও কারও হাতে বাজারের ব্যাগ তুলে দেওয়া, কখনও অসুস্থ প্রতিবেশীর খোঁজ নেওয়া—এসব ছোট কাজই মানুষের মধ্যে দূরত্ব কমায়।<\/p><p>শ্রাবন্তীও উপলব্ধি করল, যে মানবিকতা তাকে প্রথমবার শোভনের চোখে পরিচিত করেছিল, সেই মানবিকতাই তাদের চারপাশের সমাজকে নতুন করে গড়তে পারে।<\/p><p>আর কয়েক দিন পরে বিকেলে নিচের ফাঁকা খেলার জায়গায় আবার ছোটদের গলা শোনা গেল। সাঁতার ক্লাব আর কোচিংয়ের ফাঁকে ফাঁকে ওরা নিজেরাই খেলার দল বানিয়ে ফেলেছে—কোনো ফি ছাড়াই।<\/p><h3>৫. যার যার মতো<\/h3><p>সবাই সমান উৎসাহী ছিলেন না। চারতলার এক ভদ্রলোক সোজাসুজি বললেন,<\/p><p class=\"d\">— আমি কম কথার মানুষ, ভাই। বেশি মেলামেশা আমার সয় না। তবে দরকারে ডাকবেন—আমি আছি।<\/p><p>শোভন হেসে বলল,<\/p><p class=\"d\">— ওইটুকুই যথেষ্ট, কাকু।<\/p><p>কারণ এই উদ্যোগ কখনও কাউকে জোর করে কাছে টানার জন্য ছিল না। দরজা বন্ধ রাখার অধিকার সবারই আছে; শুধু জানা থাকাই যথেষ্ট যে বিপদের দিনে সেই দরজার ওপারে কেউ আছে।<\/p><h3>৬. গেটের সামনে সন্ধ্যা<\/h3><p>কয়েক মাস পর এক সন্ধ্যায় শোভন ও শ্রাবন্তী বিল্ডিংয়ের মূল গেটের সামনে দাঁড়িয়ে কথা বলছিল। দুজনেই হাসছিল—সেই প্রথম দিনের কথা মনে করে, যখন ফোনে শুধু ডাকনাম জানত, অথচ একই বিল্ডিংয়ে থাকার কথাটুকুও জানত না।<\/p><p>শ্রাবন্তী বলল,<\/p><p class=\"d\">— ভাবো তো, যদি সেদিন তুমি আমার ফোনটা ফিরিয়ে না দিতে, হয়তো আজও আমরা একে অপরকে খুঁজে বেড়াতাম।<\/p><p>শোভন উত্তর দিল,<\/p><p class=\"d\">— আর যদি আমরা প্রতিবেশীদের সঙ্গে পরিচিত থাকতাম, হয়তো এত দিন ধরে একে অপরকে খুঁজতেই হতো না।<\/p><p>শোভন একটু থেমে বলল,<\/p><p class=\"d\">— তোমাকে একটা কথা বলা হয়নি। তুমি যেদিন রাস্তায় অজ্ঞান হয়ে পড়ে থাকা এক ভদ্রলোককে বাড়ি পৌঁছে দিয়েছিলে, আমি দূর থেকে সব দেখেছিলাম। সেদিন থেকেই তোমাকে খুঁজছি।<\/p><p>শ্রাবন্তী অবাক হয়ে তাকাল। সে তো কখনও ভাবেনি, কেউ সেই সামান্য কাজটা লক্ষ করেছে। তার চোখ ছলছল করে উঠল।<\/p><p>কিছুক্ষণ দুজনেই চুপ করে রইল। গেটের আলোয় তখন একে একে ফিরছেন প্রতিবেশীরা—কেউ হাত নাড়লেন, কেউ নমস্কার জানালেন। এই সামান্য সৌজন্যটুকুই এত দিন ছিল না।<\/p><p>সব সমস্যা এক দিনে মিটে গেল না। কেউ ব্যস্ত, কেউ লাজুক, কেউ নিজের ব্যক্তিগত পরিসর বজায় রাখতে চান। কিন্তু অন্তত একটি পরিবর্তন হলো—মানুষ একে অপরকে অচেনা ভেবে পাশ কাটিয়ে যাওয়ার আগে একবার থামতে শিখল।<\/p><p>শোভন ও শ্রাবন্তীর সম্পর্কও ধীরে ধীরে গভীর হলো। তাদের ভবিষ্যৎ নিয়ে সিদ্ধান্ত তারা নিজেরাই নিল—পরিবারের ভালোবাসা ও সম্মান সঙ্গে নিয়ে, কিন্তু নিজেদের ইচ্ছাকে গুরুত্ব দিয়ে।<\/p><p>একদিন মূল গেট দিয়ে বাড়ি ফেরার সময় শ্রাবন্তী সেই তিনতলার বৃদ্ধাকে ভারী ব্যাগ নিয়ে উঠতে দেখল। সে এগিয়ে গিয়ে ব্যাগটি হাতে নিল। শোভন দরজা খুলে ধরে দাঁড়াল। বৃদ্ধা হেসে বললেন,<\/p><p class=\"d\">— তোমাদের দুজনকে দেখে ভালো লাগে। এখন এই বাড়িতে কাউকে কিছু বলতে হলে আর অচেনা মনে হয় না।<\/p><p>শ্রাবন্তী আর শোভন একে অপরের দিকে তাকিয়ে হাসল।<\/p><p>তাদের গল্প শুরু হয়েছিল এক অপরিচিত মানুষের প্রতি শ্রাবন্তীর সহমর্মিতা দিয়ে। আর সেই গল্পের সত্যিকারের পরিণতি হলো—তারা শুধু নিজেদের মধ্যে সম্পর্ক খুঁজে পায়নি, আশপাশের মানুষের সঙ্গেও হারিয়ে যাওয়া সম্পর্ক ফিরিয়ে আনার চেষ্টা করেছে।<\/p>", "en": "<h3>1. The Question of That Day<\/h3><p>That evening, after the guests had left, the two families sat together on the bench in the courtyard. The question was in everyone's mind — why? Why had no one even tried to know anyone else in all these years?<\/p><p>Shobhan's mother sighed and said,<\/p><p class=\"d\">— I should admit the first reason is mine — pride. I used to think, let them speak first. They must have been thinking, let us speak first. Both sides waited; neither took the first step. I went to a matchmaker for my son's marriage, yet never cared to find out about the girl from the next staircase.<\/p><p>Shrabanti's mother shook her head.<\/p><p class=\"d\">— And the second reason — there was no need. Earlier, in trouble or illness, we had to run to the next door. Now everything is just one phone call.<\/p><p>Shrabanti said slowly,<\/p><p class=\"d\">— That's true. Last winter, the grandmother on the third floor suddenly fell ill. The ambulance came and took her away — we heard about it afterwards. The same on the day the uncle on the second floor passed away. The hearse came, everything was arranged over the phone. On the stairs there was just a notice hanging.<\/p><p>Shobhan added,<\/p><p class=\"d\">— Same with celebrations. Weddings, rice ceremonies — all in community halls, in the hands of caterers. Inviting a neighbour means dropping off a card — a five-minute courtesy visit, without even taking tea.<\/p><p>Shobhan's mother said,<\/p><p class=\"d\">— Look at the children. Some are learning swimming, some are in paid sports academies. The play area downstairs lies empty. Though they live in one building, their friends are from different clubs and different coaching classes.<\/p><p>Shrabanti's mother finally said,<\/p><p class=\"d\">— And the rest of the time goes into mobiles and TV serials. When will we find time to ask after anyone's life? Our eyes fill with tears for the people on the screen, yet we don't know a thing about the person behind the next door.<\/p><p>For a few moments silence fell over everyone. No single reason was the big one, yet together they were huge. Relationships grow out of need — and that need we have bought with money.<\/p><p>The marriage was not decided on the spot that day. The two families agreed that Shobhan and Shrabanti would take their time. They would have the chance to understand their friendship and to speak openly about the future. The marriage would not be a decision made under pressure.<\/p><p>But from that day, a small change began in the atmosphere of the building. Shobhan's mother said to Shrabanti's mother, \"From now on, let's meet not only when there's talk of marriage, but sometimes just like this too.\" Shrabanti's mother smiled and said, \"Certainly. All these years we were strangers though we belonged to the same house. No more.\"<\/p><h3>2. A Small Greeting<\/h3><p>The morning after the introduction, Shobhan raised his hand and greeted a neighbour standing by the gate with a namaskar. The gentleman turned around at first — thinking it must be meant for someone else. Then he smiled in surprise.<\/p><p class=\"d\">— Namaskar! Six years in this building, and this is the first time anyone has greeted me first.<\/p><p>The next day he himself said, \"Looks like rain today — did you bring an umbrella?\" It was a small remark, but from that day the demeanour of the people standing around the gate began to change. A new tenant family had moved into the complex — earlier, everyone would have shut their doors on seeing the luggage being unloaded. This time Shobhan's mother took tea and biscuits and said, \"Call us if you need anything.\"<\/p><p>That same morning Shrabanti's mother, with some hesitation, knocked on a door on the third floor of the next staircase, a bowl of payesh in her hands. An old woman opened the door, surprise in her eyes.<\/p><p class=\"d\">— I live in the other staircase. All these years so close, and I never came — today I did.<\/p><p>The old woman could not say anything for a while. Then she smiled and said,<\/p><p class=\"d\">— Do you know how many years it's been since anyone knocked on my door? Please, come in.<\/p><h3>3. Behind a Closed Door<\/h3><p>One Saturday morning Shrabanti noticed that two days' worth of newspapers had piled up in front of the grandmother's door on the third floor. When she asked someone in the neighbouring flat, they shrugged, \"Maybe she's gone to her son's. What's it to us?\" Another said, \"What's the use of getting into trouble?\"<\/p><p>Shrabanti knocked again and again. No answer. She called Shobhan. They took the number of the grandmother's son from the security guard's register and phoned him. He was in a distant city; with his permission the door was opened, and they found the grandmother lying in bed with a fever, unable to get up. A doctor was called, and the medicines were given on time.<\/p><p>The very people who had said \"What's it to us?\" a little earlier now came and stood at her door — some bringing soup, some fruit. The grandmother said with a faint smile,<\/p><p class=\"d\">— For two days I kept wondering — will anyone come?<\/p><h3>4. Everyone's Problem, No One's Responsibility<\/h3><p>Around that time the lift was getting stuck now and then, and water was seeping from the rooftop tank. The residents' WhatsApp group was flooded with complaints every day, but when it came to solutions, everyone was silent. \"Let somebody look into it!\" \"I'm in the office all day.\" Everyone was waiting for that \"somebody.\"<\/p><p>Shobhan wrote in the group, \"Let's talk over tea in the courtyard on Sunday morning. Please come if you can.\" Seven people came at first. Shobhan took charge of getting quotations. The others shared out the rest — some did the accounts, some talked to the mechanic, some took responsibility for collecting a small monthly contribution. The next month the lift was repaired. That Sunday meeting gradually became a regular habit of the complex.<\/p><p>Gradually more families joined those Sunday chats. People learned each other's names, each other's work, about someone's ailing parents, someone's experience of living alone. A common contact list was also made so that people could help each other — with numbers given voluntarily, without violating anyone's privacy.<\/p><p>An elderly neighbour said,<\/p><p class=\"d\">— All this time I thought everyone in this house lived in their own world. Today I feel that if we want, we can become neighbours again.<\/p><p>Shobhan understood that building relationships does not always need a big event. Sometimes a namaskar, sometimes lifting a shopping bag for someone, sometimes asking after a sick neighbour — such small deeds are what shrink the distance between people.<\/p><p>Shrabanti, too, realised that the very humanity that had first made her known in Shobhan's eyes could rebuild the society around them.<\/p><p>And a few days later, in the evening, the voices of children were heard again in the empty play area downstairs. In the gaps between swimming classes and coaching, they had formed their own play teams — without paying any fee.<\/p><h3>5. Each in Their Own Way<\/h3><p>Not everyone was equally enthusiastic. A gentleman on the fourth floor said plainly,<\/p><p class=\"d\">— I'm a man of few words, brother. Too much socialising doesn't suit me. But call me when you need me — I'm here.<\/p><p>Shobhan smiled and said,<\/p><p class=\"d\">— That's enough, uncle.<\/p><p>Because this initiative was never about forcing anyone into closeness. Everyone has the right to keep their door shut; it is enough to know that on the day of trouble, someone is on the other side of that door.<\/p><h3>6. Evening at the Gate<\/h3><p>A few months later, one evening, Shobhan and Shrabanti stood talking in front of the main gate. Both were smiling, remembering that first day, when over the phone they knew only each other's nicknames and had no idea they lived in the same building.<\/p><p>Shrabanti said,<\/p><p class=\"d\">— Just think — if you hadn't returned my phone that day, we might still be searching for each other today.<\/p><p>Shobhan replied,<\/p><p class=\"d\">— And if we had known our neighbours, perhaps we wouldn't have had to search for each other all this time.<\/p><p>Shobhan paused a little and said,<\/p><p class=\"d\">— There's something I haven't told you. The day you took that unconscious man home from the road — I saw it all from a distance. I've been looking for you ever since.<\/p><p>Shrabanti looked at him in surprise. She had never imagined anyone had noticed that small deed. Her eyes brimmed with tears.<\/p><p>For a while both were silent. In the light of the gate, the neighbours were returning one by one — some waved, some greeted with a namaskar. This small courtesy was exactly what had been missing all these years.<\/p><p>Not every problem was solved in a day. Some people were busy, some shy, some wanted to keep their private space. But at least one change had come — before passing each other by as strangers, people had learned to pause for a moment.<\/p><p>Shobhan and Shrabanti's relationship also deepened slowly. They made decisions about their future themselves — carrying their families' love and respect with them, but giving weight to their own wishes.<\/p><p>One day, coming home through the main gate, Shrabanti saw the old woman from the third floor struggling up the steps with a heavy bag. She went over and took the bag from her hand. Shobhan stood holding the door open. The old woman smiled and said,<\/p><p class=\"d\">— It's lovely to see you two. These days, when I need to tell anyone anything in this building, they no longer feel like strangers.<\/p><p>Shrabanti and Shobhan looked at each other and smiled.<\/p><p>Their story had begun with Shrabanti's compassion for a stranger. And the true culmination of that story was this — they not only found a bond with each other, but also tried to bring back the lost bonds with the people around them.<\/p>"}}, {"l": {"bn": "পর্ব 11", "en": "Part 11"}, "t": {"bn": "পর্ব ১১: আবাসনের উঠোনে বিয়ে", "en": "Part 11: A Wedding in the Courtyard"}, "d": {"bn": "বাসিন্দাদের নিজের হাতে গড়া বিয়ে", "en": "A wedding made by the residents' own hands"}, "h": {"bn": "<h3>১. একটি প্রস্তাব<\/h3><p>কিছুদিন পর, নিয়মিত হয়ে ওঠা এক রবিবারের চা-আড্ডায় তিনতলার দাদিমা হঠাৎ বললেন,<\/p><p class=\"d\">— তোমাদের বিয়েটা কোনো ভবনে নয়, আমাদের এই উঠোনেই হোক। কত বছর এই বাড়িতে কোনো উৎসব দেখিনি!<\/p><p>কথাটা সবার মনে ধরল। শোভন আর শ্রাবন্তী ততদিনে নিজেদের সিদ্ধান্ত নিয়ে ফেলেছে—পরিবারের আশীর্বাদ সঙ্গে নিয়ে। দুই মা-ও রাজি। শুধু একটাই শর্ত উঠল, ক্যাটারার নয়, সাজসজ্জার ঠিকাদার নয়; সব কাজ করবেন বাসিন্দারা নিজেরাই।<\/p><h3>২. দায়িত্ব ভাগ<\/h3><p>দুই সিঁড়ির বাসিন্দারা মিলে দায়িত্ব ভাগ করে নিলেন।<\/p><p>রান্নার ভার নিলেন কয়েকজন কাকা-কাকিমা। বাজার থেকে এল তাজা সবজি, আর ছাদবাগানের লাউ, লঙ্কা, পুদিনা। ডাল, ভাত, সবজি, মাছ আর পায়েস—অতি সাধারণ মেনু, কিন্তু প্রতিটি পদে নিজেদের হাতের স্বাদ।<\/p><p>সাজের দায়িত্ব নিল ছোটরা। তারা ছাদবাগানের ফুল, আমপাতা আর রঙিন কাগজে উঠোন সাজাল। পরিবেশের ভার নিলেন কলেজপড়ুয়া কয়েকজন—কলাপাতায় খাওয়া, মাটির ভাঁড়ে জল, প্লাস্টিক পুরোপুরি বন্ধ, আর খাবারের উচ্ছিষ্ট সার-গর্তে। বৃদ্ধরা বসলেন তদারকিতে, কে কোথায় বসবেন, কার কী লাগবে—সব তাঁদের নখদর্পণে।<\/p><p>রান্নার আগের রাতে দুই সিঁড়ির লোকেরা একসঙ্গে বসে সবজি কুটলেন। কেউ হাসছেন, কেউ পুরনো দিনের গল্প বলছেন। কারও মোবাইল সেই সন্ধ্যায় আর হাতে ওঠেনি।<\/p><h3>৩. বিয়ের দিন<\/h3><p>বিয়ের দিন সকালে উঠোন ভরে গেল মানুষে। যে সিঁড়ি দিয়ে এত বছর কেউ কারও সঙ্গে কথা বলেনি, সেই সিঁড়ির মানুষই আজ কাঁধে কাঁধ মিলিয়ে কাজ করছেন।<\/p><p>নিয়ম হলো, অনুষ্ঠান শুরুর আগে সবাই নিজের মোবাইল একটা ঝুড়িতে রেখে আসবেন। এক ঘণ্টা শুধু কথা, শুধু হাসি, শুধু মুখোমুখি বসা। শুরুতে কয়েকজন আপত্তি করলেন, তারপর নিজেরাই হেসে ফেললেন।<\/p><p>দাদিমা এলেন সবার আগে। তিনি নিজের হাতে বর-কনের কপালে ধান-দুর্বা ছুঁইয়ে বরণ করলেন।<\/p><p class=\"d\">— এই বাড়ির প্রথম বিয়ে, যেটা আমি নিজের চোখে দেখলাম। এত বছর পর মনে হচ্ছে, সত্যিই একটা পরিবারের মধ্যে আছি।<\/p><p>শোভন আর শ্রাবন্তী হাসিমুখে তাঁর পা ছুঁয়ে প্রণাম করল।<\/p><h3>৪. উঠোনের আলো<\/h3><p>সন্ধ্যায় কলাপাতা পাতা হলো সারি সারি। দুই মা পাশাপাশি দাঁড়িয়ে পরিবেশন করছেন। ছোটরা জলের ভাঁড় নিয়ে ছুটোছুটি করছে। দোতলার যে কাকুর মৃত্যুর দিন কেউ তাঁর দরজায় যায়নি, তাঁর স্ত্রীকে আজ সবাই আগ্রহ করে নিজের পাশে বসালেন।<\/p><p>খেতে খেতে এক প্রবীণ বললেন,<\/p><p class=\"d\">— এমন স্বাদের রান্না কোনো ক্যাটারার দিতে পারত না। এখানে নুনের সঙ্গে মিশে আছে আপনজনের হাত।<\/p><p>সবাই হেসে উঠলেন।<\/p><p>সেদিন রাতে উঠোনের দড়িতে ঝোলানো ছোট ছোট বাতিগুলো জ্বলে উঠল। শোভন আর শ্রাবন্তী পাশাপাশি দাঁড়িয়ে দেখল—যে আবাসনে এক সময় দরজার ওপারে কে থাকে, কেউ জানত না, সেখানে আজ প্রতিটি দরজা খোলা।<\/p><p>শ্রাবন্তী মৃদু গলায় বলল,<\/p><p class=\"d\">— ভাবতে পারো, এই মানুষগুলোই এক বছর আগে আমাদের কাছে অচেনা ছিল?<\/p><p>শোভন তার হাত ধরে বলল,<\/p><p class=\"d\">— অচেনা ছিলেন না। শুধু কেউ আগে কড়া নাড়েনি।<\/p><p>কৃত্রিম জীবনের সুবিধা ছেড়ে এই আবাসন সেদিন ফিরে পেল তার স্বাভাবিক জীবন—যেখানে আনন্দ কেনা হয় না, ভাগ করে নেওয়া হয়।<\/p>", "en": "<h3>1. A Proposal<\/h3><p>Some time later, at a Sunday tea gathering that had become a regular event, the grandmother from the third floor suddenly said,<\/p><p class=\"d\">— Let your wedding be held not in some hall, but right here in our courtyard. I haven't seen a celebration in this building for so many years!<\/p><p>Everyone loved the idea. By then Shobhan and Shrabanti had made their decision — with their families' blessings. Both mothers agreed too. Only one condition came up: no caterer, no decorating contractor; the residents would do everything themselves.<\/p><h3>2. Sharing the Work<\/h3><p>The residents of the two staircases divided the responsibilities among themselves.<\/p><p>Several uncles and aunts took charge of the cooking. Fresh vegetables came from the market, and from the rooftop garden came gourds, chillies and mint. Dal, rice, vegetables, fish and payesh — a very simple menu, but each dish carried the flavour of their own hands.<\/p><p>The children took charge of decoration. They decked the courtyard with rooftop-garden flowers, mango leaves and coloured paper. A few college students took responsibility for the environment — meals on banana leaves, water in clay cups, plastic completely banned, and leftover food into the compost pit. The elders sat in charge of supervision — who sits where, who needs what — all of it at their fingertips.<\/p><p>The night before the cooking, people from the two staircases sat together cutting vegetables. Someone laughed, someone told stories of the old days. That evening, no one's mobile phone was in their hand.<\/p><h3>3. The Wedding Day<\/h3><p>On the morning of the wedding the courtyard filled with people. The very staircases where no one had spoken to anyone for years now had people working shoulder to shoulder.<\/p><p>The rule was that before the ceremony began, everyone would leave their mobile phones in a basket. For one hour — only conversation, only laughter, only sitting face to face. A few objected at first, then laughed at themselves.<\/p><p>The grandmother arrived before anyone else. With her own hands she touched rice and durba grass to the foreheads of the bride and groom in blessing.<\/p><p class=\"d\">— This is the first wedding in this house that I have seen with my own eyes. After so many years, I feel I am truly inside a family.<\/p><p>Shobhan and Shrabanti smilingly touched her feet in respect.<\/p><h3>4. Lights in the Courtyard<\/h3><p>In the evening, banana leaves were laid out in long rows. The two mothers stood side by side serving. The children ran around with clay cups of water. The widow of the uncle on the second floor — on whose passing no one had come to the door — was now invited eagerly by everyone to sit beside them.<\/p><p>An elder said as he ate,<\/p><p class=\"d\">— No caterer could have made food like this. Here, mixed in with the salt, is the touch of loved ones' hands.<\/p><p>Everyone laughed.<\/p><p>That night, the little lights strung along ropes in the courtyard were switched on. Shobhan and Shrabanti stood side by side and watched — the building where once no one knew who lived behind which door now had every door open.<\/p><p>Shrabanti said softly,<\/p><p class=\"d\">— Can you imagine, these very people were strangers to us a year ago?<\/p><p>Shobhan took her hand and said,<\/p><p class=\"d\">— They were never strangers. It's just that no one had knocked first.<\/p><p>Leaving behind the conveniences of an artificial life, the complex that day got back its natural life — where joy is not bought, but shared.<\/p>"}}, {"l": {"bn": "বার্তা", "en": "Message"}, "t": {"bn": "গল্পের বার্তা", "en": "The Message of the Story"}, "d": {"bn": "গল্পের শেষ ভাবনা", "en": "The closing thought"}, "h": {"bn": "<div class=\"end\"><b>আমরা দূরের মানুষের সঙ্গে যোগাযোগ রাখি, অথচ পাশের দরজার মানুষটিকে চিনি না—এই দূরত্বই আধুনিক জীবনের এক নীরব সংকট।<\/b><\/div><p>প্রযুক্তি আমাদের কাছে মানুষকে আনতে পারে, কিন্তু সম্পর্ক তৈরি করতে হলে দরকার সময়, সহমর্মিতা, কৌতূহল ও সামান্য উদ্যোগ। প্রতিবেশীর ব্যক্তিগত পরিসরকে সম্মান করেও তাঁর খোঁজ নেওয়া যায়। কারও জীবনে অযথা হস্তক্ষেপ না করেও প্রয়োজনে পাশে দাঁড়ানো যায়।<\/p><p>শোভন ও শ্রাবন্তীর গল্প তাই শুধু ভালোবাসার গল্প নয়। এটি আমাদের মনে করিয়ে দেয়—সম্পর্ক হারিয়ে যায় এক দিনে নয়; আবার ফিরে আসার শুরুটাও হতে পারে একটি ছোট্ট নমস্কার থেকে।<\/p><div class=\"end\"><b>পাশাপাশি থেকেও পর নয়—আসুন, আবার প্রতিবেশী হই।<\/b><\/div>", "en": "<div class=\"end\"><b>We stay in touch with people far away, yet we do not know the person behind the next door — this distance is a silent crisis of modern life.<\/b><\/div><p>Technology can bring people closer, but building relationships takes time, compassion, curiosity and a little initiative. We can ask after a neighbour while respecting their private space. We can stand beside someone in need without interfering in their life.<\/p><p>So the story of Shobhan and Shrabanti is not only a love story. It reminds us that relationships do not get lost in a single day — and that the beginning of their return can be as small as a simple namaskar.<\/p><div class=\"end\"><b>Not strangers side by side — let us become neighbours again.<\/b><\/div>"}}];
