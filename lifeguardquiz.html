<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f4f4f6; min-height: 100vh; }
#app { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; }
.screen { display: none; }
.screen.active { display: block; }

/* HOME */
.home-header { text-align: center; padding: 2rem 1rem 1rem; background: linear-gradient(135deg,#1D9E75 0%,#0F6E56 100%); color: #fff; }
.game-logo { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
.game-sub { font-size: 12px; opacity: 0.85; margin-top: 5px; }
.topic-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; padding: 1rem; }
.topic-card { background: #fff; border: 1.5px solid #e8e8ec; border-radius: 14px; padding: 14px 12px; cursor: pointer; transition: all 0.15s; text-align: left; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
.topic-card:hover { border-color: #1D9E75; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(29,158,117,.15); }
.topic-emoji { font-size: 24px; display: block; margin-bottom: 6px; }
.topic-name { font-size: 12px; font-weight: 600; color: #1a1a2e; line-height: 1.3; }
.topic-count { font-size: 11px; color: #888; margin-top: 3px; }

/* QUIZ HEADER */
.quiz-header { padding: 0.9rem 1rem 0.5rem; background: #fff; border-bottom: 1px solid #f0f0f4; position: sticky; top: 0; z-index: 10; }
.header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.back-btn { background: none; border: none; font-size: 13px; color: #666; cursor: pointer; padding: 4px 0; display: flex; align-items: center; gap: 4px; }
.voice-btn { background: #f0faf6; border: 1.5px solid #1D9E75; border-radius: 20px; padding: 4px 10px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; color: #0F6E56; font-weight: 600; transition: all 0.15s; }
.voice-btn.muted { background: #f5f5f5; border-color: #ccc; color: #888; }
.topic-title-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.topic-icon { font-size: 18px; }
.topic-label { font-size: 14px; font-weight: 600; color: #1a1a2e; }
.progress-bar-bg { height: 5px; background: #eee; border-radius: 3px; overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; background: linear-gradient(90deg,#1D9E75,#2dc98f); }
.progress-text { font-size: 11px; color: #999; margin-top: 5px; text-align: right; }

/* QUESTION */
.q-card { margin: 0.75rem 1rem; background: #f8f9fb; border: 1.5px solid #eaeaf0; border-radius: 14px; padding: 1.25rem; }
.q-number { font-size: 10px; font-weight: 700; color: #1D9E75; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.q-text { font-size: 15px; color: #1a1a2e; line-height: 1.55; font-weight: 600; }

/* OPTIONS */
.options { padding: 0 1rem; display: flex; flex-direction: column; gap: 8px; margin-top: 0.75rem; }
.opt-btn { display: flex; align-items: flex-start; gap: 10px; background: #fff; border: 1.5px solid #e4e4ea; border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; transition: all 0.15s; width: 100%; }
.opt-btn:hover:not(:disabled) { border-color: #1D9E75; background: #f0faf6; }
.opt-letter { font-size: 11px; font-weight: 700; color: #999; min-width: 18px; margin-top: 2px; background: #f0f0f4; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.opt-text { font-size: 13.5px; color: #333; line-height: 1.4; }
.opt-btn.correct { background: #edfaf4; border-color: #1D9E75; }
.opt-btn.correct .opt-letter { background: #1D9E75; color: #fff; }
.opt-btn.correct .opt-text { color: #0a5c3f; font-weight: 600; }
.opt-btn.wrong { background: #fff0f0; border-color: #e24b4a; }
.opt-btn.wrong .opt-letter { background: #e24b4a; color: #fff; }
.opt-btn.wrong .opt-text { color: #a32d2d; }
.opt-btn:disabled { cursor: default; }

/* FEEDBACK */
.feedback-section { margin: 0.75rem 1rem 0; }
.feedback-bar { padding: 10px 14px; border-radius: 10px 10px 0 0; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.feedback-bar.correct { background: #edfaf4; color: #0a5c3f; border: 1.5px solid #1D9E75; border-bottom: none; }
.feedback-bar.wrong { background: #fff0f0; color: #a32d2d; border: 1.5px solid #e24b4a; border-bottom: none; }
.explanation-box { padding: 10px 14px 12px; border-radius: 0 0 10px 10px; font-size: 12.5px; line-height: 1.55; color: #444; }
.explanation-box.correct { background: #f5fcf8; border: 1.5px solid #1D9E75; border-top: 1px dashed #a3d9c0; }
.explanation-box.wrong { background: #fff8f8; border: 1.5px solid #e24b4a; border-top: 1px dashed #f0a0a0; }
.explanation-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; color: #888; }

.next-btn { display: block; width: calc(100% - 2rem); margin: 0.75rem 1rem 1.5rem; background: linear-gradient(135deg,#1D9E75,#0F6E56); border: none; border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; transition: opacity 0.15s; text-align: center; box-shadow: 0 4px 12px rgba(29,158,117,.3); }
.next-btn:hover { opacity: 0.9; }

/* RESULT */
.result-screen { padding: 2rem 1.25rem; text-align: center; }
.result-emoji { font-size: 56px; display: block; margin-bottom: 14px; }
.result-score { font-size: 48px; font-weight: 700; color: #1a1a2e; }
.result-label { font-size: 14px; color: #888; margin-top: 4px; }
.result-msg { font-size: 14px; color: #444; margin: 1.25rem 0; padding: 1rem; background: #f8f9fb; border-radius: 12px; line-height: 1.6; border-left: 3px solid #1D9E75; text-align: left; }
.score-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-top: 10px; }
.score-badge.good { background: #edfaf4; color: #0a5c3f; }
.score-badge.mid { background: #fef3e2; color: #8a5a00; }
.score-badge.low { background: #fff0f0; color: #a32d2d; }
.result-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 1.5rem; }
.result-actions button { padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.result-actions button.primary { background: linear-gradient(135deg,#1D9E75,#0F6E56); color: #fff; border: none; box-shadow: 0 4px 12px rgba(29,158,117,.3); }
.result-actions button.secondary { background: #fff; color: #333; border: 1.5px solid #e4e4ea; }
.result-actions button:hover { opacity: 0.9; }

/* Speaking indicator */
.speaking-dot { display: inline-block; width: 6px; height: 6px; background: #1D9E75; border-radius: 50%; animation: pulse 0.8s ease-in-out infinite; margin-left: 4px; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.6)} }
</style>

    </div>
  </div>
</div>

<script>
// ─── VOICE ENGINE ───────────────────────────────────────────────

let voiceEnabled = true;

function toggleVoice(){

  voiceEnabled = !voiceEnabled;

  const btn = document.getElementById('voiceBtn');

  if(voiceEnabled){

    btn.innerHTML = '🔊 Voice On';

    btn.classList.remove('muted');

    speechSynthesis.resume();

  }else{

    btn.innerHTML = '🔇 Voice Off';

    btn.classList.add('muted');

    speechSynthesis.cancel();
  }
}


/* SPEAK FUNCTION */

function speak(text){

  if(!voiceEnabled) return;

  if(!('speechSynthesis' in window)) return;

  speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);

  utter.lang = 'en-US';

  utter.rate = 0.9;

  utter.pitch = 1;

  utter.volume = 1;

  /* Better mobile voice */

  const voices = speechSynthesis.getVoices();

  const mobileVoice = voices.find(v =>
    v.lang.includes('en') &&
    (
      v.name.includes('Google') ||
      v.name.includes('Samantha') ||
      v.name.includes('Karen')
    )
  );

  if(mobileVoice){
    utter.voice = mobileVoice;
  }

  /* Android Chrome fix */

  setTimeout(()=>{

    speechSynthesis.speak(utter);

  },100);
}


/* Load voices */

if(window.speechSynthesis){

  speechSynthesis.onvoiceschanged = ()=>{

    speechSynthesis.getVoices();

  };

}


/* Mobile unlock */

document.body.addEventListener('touchstart',()=>{

  speechSynthesis.resume();

},{once:true});

// ─── STATE ────────────────────────────────────────────────────────
let currentTopic = null;
let currentQ = 0;
let score = 0;
let answered = false;
let currentTopicIndex = 0;

// ─── NAVIGATION ───────────────────────────────────────────────────
function goHome() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  showScreen('home');
}

function showScreen(id) {
  ['home','quiz','result'].forEach(s => {
    document.getElementById(s).classList.toggle('active', s === id);
  });
}

function retryTopic() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  startTopic(currentTopicIndex);
}

// ─── TOPIC START ──────────────────────────────────────────────────
function startTopic(idx) {
  currentTopicIndex = idx;
  currentTopic = topics[idx];
  currentQ = 0;
  score = 0;
  answered = false;
  showScreen('quiz');
  document.getElementById('qIcon').textContent = currentTopic.emoji;
  document.getElementById('qTitle').textContent = currentTopic.name;
  renderQuestion();
}

// ─── RENDER QUESTION ──────────────────────────────────────────────
function renderQuestion() {
  answered = false;
  if (window.speechSynthesis) window.speechSynthesis.cancel();

  const q = currentTopic.questions[currentQ];
  const total = currentTopic.questions.length;
  const pct = (currentQ / total) * 100;

  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `Question ${currentQ + 1} of ${total}`;
  document.getElementById('qNumber').textContent = `Question ${currentQ + 1}`;
  document.getElementById('qText').textContent = q.q;

  const opts = document.getElementById('optionsContainer');
  opts.innerHTML = '';
  ['A','B','C','D'].forEach((letter, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${letter}</span><span class="opt-text">${q.opts[i]}</span>`;
    btn.onclick = () => selectAnswer(i, btn);
    opts.appendChild(btn);
  });

  document.getElementById('feedbackSection').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  // Speak the question after a short delay
  setTimeout(() => speak(q.q), 300);
}

// ─── SELECT ANSWER ────────────────────────────────────────────────
function selectAnswer(idx, btn) {
  if (answered) return;
  answered = true;

  const q = currentTopic.questions[currentQ];
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.disabled = true);

  const isCorrect = idx === q.ans;
  if (isCorrect) score++;

  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) allBtns[q.ans].classList.add('correct');

  // Feedback section
  const section = document.getElementById('feedbackSection');
  const fb = document.getElementById('feedbackBar');
  const expBox = document.getElementById('explanationBox');
  const expText = document.getElementById('explanationText');

  fb.className = 'feedback-bar ' + (isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = isCorrect
    ? '✅ Correct!'
    : `❌ Wrong — correct answer: <strong>${['A','B','C','D'][q.ans]}</strong>`;

  expBox.className = 'explanation-box ' + (isCorrect ? 'correct' : 'wrong');
  expText.textContent = q.exp;
  section.style.display = 'block';

  const total = currentTopic.questions.length;
  const isLast = currentQ === total - 1;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = isLast ? 'See results →' : 'Next question →';

  // Speak feedback + explanation
  const voiceText = (isCorrect ? 'Correct! ' : 'Wrong. The correct answer is ' + q.opts[q.ans] + '. ') + 'Did you know? ' + q.exp;
  setTimeout(() => speak(voiceText), 300);
}

// ─── NEXT QUESTION ────────────────────────────────────────────────
function nextQuestion() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  currentQ++;
  if (currentQ >= currentTopic.questions.length) {
    showResult();
  } else {
    document.getElementById('progressFill').style.width = ((currentQ / currentTopic.questions.length) * 100) + '%';
    renderQuestion();
  }
}

// ─── RESULT ───────────────────────────────────────────────────────
function showResult() {
  showScreen('result');
  const total = currentTopic.questions.length;
  const pct = Math.round((score / total) * 100);

  let emoji, badgeClass, badgeText, msg;
  if (pct >= 80) {
    emoji = '🏆'; badgeClass = 'good'; badgeText = 'Excellent!';
    msg = 'Outstanding performance! You clearly know this topic well. Keep spreading awareness!';
  } else if (pct >= 50) {
    emoji = '👍'; badgeClass = 'mid'; badgeText = 'Good effort';
    msg = "Good effort! A few more revisions and you'll master this topic completely.";
  } else {
    emoji = '📚'; badgeClass = 'low'; badgeText = 'Keep learning';
    msg = "Don't give up! Review the topic and try again — every attempt makes you stronger.";
  }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultScore').textContent = `${score}/${total}`;
  document.getElementById('resultLabel').textContent = `${pct}% correct`;
  document.getElementById('resultBadge').innerHTML = `<span class="score-badge ${badgeClass}">${currentTopic.emoji} ${badgeText}</span>`;
  document.getElementById('resultMsg').textContent = msg;

  setTimeout(() => speak(`You scored ${score} out of ${total}. ${msg}`), 400);
}

// ─── BUILD HOME GRID ──────────────────────────────────────────────
function buildTopicGrid() {
  const grid = document.getElementById('topicGrid');
  topics.forEach((t, i) => {
    const card = document.createElement('div');
    card.className = 'topic-card';
    card.innerHTML = `<span class="topic-emoji">${t.emoji}</span><div class="topic-name">${t.name}</div><div class="topic-count">10 questions</div>`;
    card.onclick = () => startTopic(i);
    grid.appendChild(card);
  });
}

buildTopicGrid();
/* MOBILE BACK BUTTON FIX */

history.pushState(null,null,location.href);

window.addEventListener('popstate',function(){

  if(document.getElementById('quiz').classList.contains('active') ||
     document.getElementById('result').classList.contains('active')){

      goHome();

      history.pushState(null,null,location.href);
  }

});
</script>
