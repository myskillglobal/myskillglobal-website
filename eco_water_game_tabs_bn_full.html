<style>
html,body{width:100%;overflow-x:hidden;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Bengali',Arial,sans-serif}
.ew{background:#eef7f2;min-height:100vh;width:100%;max-width:500px;margin:0 auto;overflow:hidden;}
.eh{background:linear-gradient(135deg,#009688,#4caf50);color:#fff;text-align:center;padding:14px 10px}
.eh h1{font-size:1.3rem;font-weight:700}
.eh p{font-size:.78rem;margin-top:3px;opacity:.9}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid #009688;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 14px;font-size:.8rem;font-weight:700;color:#666;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s}
.tab.active{color:#009688;border-bottom-color:#009688;background:#e0f7fa}
.tp{display:none;padding:12px}
.tp.active{display:block}
.img-box{width:100%;aspect-ratio:4/3;max-height:320px;  border-radius:12px;overflow:hidden;position:relative; background:#c8e6c9;margin-bottom:10px;}
.img-box canvas{width:100%;height:100%;display:block}
.img-box img{width:100%;height:100%;object-fit:cover;display:block}
.img-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.img-nav button{border:none;background:#009688;color:#fff;padding:8px 16px;border-radius:10px;font-size:.85rem;cursor:pointer}
.img-nav button:active{transform:scale(.96)}
.img-dot-row{display:flex;justify-content:center;gap:6px;margin-bottom:10px}
.img-dot{width:8px;height:8px;border-radius:50%;background:#b2dfdb;cursor:pointer}
.img-dot.on{background:#009688}
.info-card{background:#fff;border-radius:12px;padding:14px;border:0.5px solid #b2dfdb;margin-bottom:10px}
.info-title{font-size:1rem;font-weight:700;color:#00796b;margin-bottom:6px}
.info-text{font-size:.88rem;line-height:1.6;color:#333}
.fact-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.fact{background:#e0f7fa;color:#006064;font-size:.75rem;padding:4px 10px;border-radius:20px;font-weight:600}
.voice-btn{border:none;background:#4caf50;color:#fff;padding:8px 16px;border-radius:10px;font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:12px}
.voice-btn.spk{background:#e53935;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

.game-wrap{background:#fff;border-radius:14px;padding:14px;border:0.5px solid #b2dfdb}
.score-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.score-lbl{font-size:.82rem;color:#666}
.score-val{font-size:1.1rem;font-weight:700;color:#009688}
.q-img{width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#e8f5e9;margin-bottom:10px}
.q-img canvas{width:100%;height:100%;display:block}
.q-text{font-size:.95rem;font-weight:700;color:#00796b;margin-bottom:12px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.opt{border:2px solid #b2dfdb;background:#f1f8e9;color:#1b5e20;padding:10px 8px;border-radius:10px;font-size:.82rem;cursor:pointer;text-align:center;font-weight:600;transition:all .2s;line-height:1.3}
.opt:active{transform:scale(.97)}
.opt.correct{background:#a5d6a7;border-color:#2e7d32;color:#1b5e20}
.opt.wrong{background:#ef9a9a;border-color:#c62828;color:#7f0000}
.opt.disabled{opacity:.6;cursor:default}
.fb{font-size:.88rem;padding:10px 12px;border-radius:10px;margin-bottom:10px;font-weight:600;text-align:center}
.fb.ok{background:#c8e6c9;color:#1b5e20}
.fb.bad{background:#ffcdd2;color:#b71c1c}
.next-btn{width:100%;border:none;background:#009688;color:#fff;padding:12px;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer}
.next-btn:active{transform:scale(.98)}
.result-wrap{text-align:center;padding:20px 10px}
.result-emoji{font-size:3rem;margin-bottom:8px}
.result-score{font-size:2rem;font-weight:700;color:#009688}
.result-msg{font-size:.9rem;color:#555;margin:8px 0 16px}
.restart-btn{border:none;background:#4caf50;color:#fff;padding:12px 28px;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer}
.prog-bar{height:6px;background:#b2dfdb;border-radius:4px;margin-bottom:12px}
.prog-fill{height:100%;background:#009688;border-radius:4px;transition:width .4s}
@media(max-width:520px){
 .eh h1{font-size:1.1rem;}
  .info-title{font-size:.92rem;}
  .info-text{font-size:.82rem;}
  .opt{font-size:.74rem;padding:9px 6px;}
  .img-nav button{padding:8px 10px;font-size:.76rem;}}
</style>
</head>

<script>
const tabs=[
  {
    imgs:["env/soak_pit_1.png","env/soak_pit_2.png","env/soak_pit_3.png"],
    fallback:[drawSoak1,drawSoak2,drawSoak3],
    slides:[
      {title:"নর্দমা উপচে পড়ার সমস্যা",desc:"বছরের পর বছর অনেক নর্দমা উপচে পড়ে, আর জল জমে থাকে। এই জমা জলে মশা বংশবৃদ্ধি করে, যার ফলে ম্যালেরিয়া ও ডেঙ্গুর মতো রোগ ছড়ায়। মূল কারণ হল, কংক্রিটের শহরে বৃষ্টির জলের যাওয়ার কোনো জায়গা নেই।",facts:["মশার বংশবৃদ্ধি","জলাবদ্ধতা","জমা জল"]},
      {title:"সুরক্ষা চেম্বারের সমাধান",desc:"নর্দমার নিচে তৈরি একটি সুরক্ষা চেম্বার (সোক পিট) বাড়তি জলকে ধীরে ধীরে মাটির গভীরে চুঁইয়ে যেতে দেয়। নর্দমা শুকনো থাকে, মশার বংশবৃদ্ধি আটকায়, আর ভূগর্ভস্থ জলস্তর স্বাভাবিকভাবে ভরে ওঠে।",facts:["শুকনো নর্দমা","মশা নেই","ভূগর্ভস্থ জলের পুনর্ভরণ"]},
      {title:"সোক পিট কীভাবে কাজ করে",desc:"সোক পিট নুড়ি ও বালিতে ভরা থাকে, যা মাটিতে ঢোকার আগে জলকে ছেঁকে দেয়। জল কয়েকটি স্তরের ভেতর দিয়ে যায় — পাথর আবর্জনা আটকায়, বালি মিহি কণা ছেঁকে নেয় — আর পরিষ্কার জল নিরাপদে মাটিতে পৌঁছোয়।",facts:["নুড়ির ছাঁকনি","বালির স্তর","পরিষ্কার জল"]}
    ]
  },
  {
    imgs:["env/rainwater_1.png","env/rainwater_2.png","env/rainwater_3.png"],
    fallback:[drawRain1,drawRain2,drawRain3],
    slides:[
      {title:"নদীতে হারিয়ে যাওয়া বৃষ্টির জল",desc:"শহরে বেশিরভাগ জায়গাই কংক্রিটে ঢাকা। বৃষ্টির জল মাটিতে চুঁইয়ে ঢুকতে পারে না — নর্দমা দিয়ে সোজা নদী ও সমুদ্রে চলে যায়। এইভাবে নষ্ট হয় একটি মূল্যবান সম্পদ, যা ভূগর্ভস্থ জল ভরাতে পারত।",facts:["কংক্রিটের শহর","নষ্ট হওয়া জল","নদীতে উপচে পড়া"]},
      {title:"ছাদের জল সংগ্রহ",desc:"ছাদের বৃষ্টির জল নল দিয়ে সংগ্রহ করে সংরক্ষণ ট্যাংকে জমানো যায়। এই সংগৃহীত জল বাগান, ধোয়াধুয়ি ও শৌচালয়ে কাজে লাগে — পুরসভার জলের ওপর নির্ভরতা কমে ৪০% পর্যন্ত।",facts:["ছাদের নল","সংরক্ষণ ট্যাংক","৪০% সাশ্রয়"]},
      {title:"শোষণ-গর্ত ও পুকুর",desc:"শোষণ-গর্ত ও বৃষ্টির জলের পুকুর জলকে ধীরে ধীরে মাটিতে ঢুকতে দেয়, ফলে ভূগর্ভস্থ জল ভরে ওঠে। গ্রামীণ ও আধা-শহরাঞ্চলে এগুলি কম খরচের সমাধান, যা বন্যা রোধ করে এবং শুকনো মরশুমে জল জোগায়।",facts:["বৃষ্টির জল শোষণ","বন্যা রোধ","শুকনো মরশুমের জল"]}
    ]
  },
  {

    fallback:[drawSoil1,drawSoil2,drawSoil3],
    slides:[
      {title:"প্লাস্টিক মাটিকে নষ্ট করে",desc:"যেখানে-সেখানে ছড়ানো প্লাস্টিক বর্জ্য ভেঙে মাইক্রোপ্লাস্টিক হয়ে মাটির রন্ধ্র বন্ধ করে দেয়। এতে মাটির জল ধরে রাখার ক্ষমতা ৫০% পর্যন্ত কমে যায়, কেঁচো ও মাটির জীবদের ক্ষতি হয়, আর গাছের শিকড় পুষ্টি শুষতে পারে না।",facts:["মাইক্রোপ্লাস্টিক","৫০% কম জল ধারণ","মাটির প্রাণ নষ্ট"]},
      {title:"প্লাস্টিক ড্রেন ও পুকুর আটকায়",desc:"ড্রেনে প্লাস্টিক জমলে মারাত্মক বাধা তৈরি হয়, যার ফলে শহরে জলাবদ্ধতা ও বন্যা হয়। পুকুর ও নদীতে প্লাস্টিক জলজ প্রাণীর দম বন্ধ করে দেয়। মাছ ও পাখি প্লাস্টিককে খাবার ভেবে ভুল করে, তাতে আঘাত পায় বা মারা যায়। আমাদের জলাশয়গুলি নীরবে ধ্বংস হচ্ছে।",facts:["ড্রেন বন্ধ","মাছের ক্ষতি","নদী দূষণ"]},
      {title:"প্লাস্টিক দূষণের সমাধান",desc:"এককালীন ব্যবহারের প্লাস্টিক কমান। বাড়িতে বর্জ্য আলাদা করুন। পরিচ্ছন্নতা অভিযানে অংশ নিন। জলাশয়ের কাছে গাছ লাগান। জৈব বর্জ্য থেকে কম্পোস্ট করুন। কাপড় ও পাটের থলি ব্যবহার করুন। প্রতিটি ছোট পদক্ষেপ আমাদের মাটি ও জলকে প্লাস্টিকের ক্ষতি থেকে বাঁচায়।",facts:["প্লাস্টিক কমান","বর্জ্য আলাদা করুন","গাছ লাগান"]}

  ctx.fillStyle="#d32f2f";ctx.font=`bold ${W*.038}px "Noto Sans Bengali",Arial,sans-serif`;ctx.textAlign="center";ctx.fillText("প্লাস্টিক মাটির রন্ধ্র বন্ধ করে!",W/2,H*.96);
}
function drawSoil2(ctx,W,H){
  ctx.fillStyle="#e3f2fd";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#a5d6a7";ctx.fillRect(0,H*.7,W,H*.3);
  ctx.strokeStyle="#1565c0";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(W*.1,H*.2);ctx.lineTo(W*.1,H*.7);ctx.lineTo(W*.9,H*.7);ctx.lineTo(W*.9,H*.2);ctx.stroke();
  ctx.fillStyle="#29b6f6";ctx.fillRect(W*.12,H*.5,W*.76,H*.19);
  const pcs=[[W*.2,H*.53],[W*.4,H*.56],[W*.6,H*.52],[W*.75,H*.55],[W*.3,H*.62],[W*.55,H*.64],[W*.7,H*.6]];
  pcs.forEach(([px,py])=>{ctx.fillStyle="#e0e0e0";ctx.fillRect(px-10,py-5,20,10);ctx.strokeStyle="#bdbdbd";ctx.lineWidth=1;ctx.strokeRect(px-10,py-5,20,10);});
  ctx.fillStyle="#b71c1c";ctx.font=`bold ${W*.038}px "Noto Sans Bengali",Arial,sans-serif`;ctx.textAlign="center";ctx.fillText("প্লাস্টিক ড্রেন আটকায় — জলাবদ্ধতা!",W/2,H*.96);
}
function drawSoil3(ctx,W,H){
  ctx.fillStyle="#e8f5e9";ctx.fillRect(0,0,W,H);
  const sol=[{ic:"&#9851;",lbl:"কমান",x:W*.2,y:H*.3,c:"#4caf50"},{ic:"&#9832;",lbl:"আলাদা করুন",x:W*.5,y:H*.3,c:"#1565c0"},{ic:"&#127807;",lbl:"গাছ লাগান",x:W*.8,y:H*.3,c:"#2e7d32"},{ic:"&#128462;",lbl:"কাপড়ের থলি",x:W*.2,y:H*.65,c:"#795548"},{ic:"&#127774;",lbl:"কম্পোস্ট",x:W*.5,y:H*.65,c:"#f9a825"},{ic:"&#128221;",lbl:"খবর দিন",x:W*.8,y:H*.65,c:"#e53935"}];
  sol.forEach(s=>{ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,W*.1,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font=`bold ${W*.036}px "Noto Sans Bengali",Arial,sans-serif`;ctx.textAlign="center";ctx.fillText(s.lbl,s.x,s.y+W*.14);});
  ctx.fillStyle="#2e7d32";ctx.font=`bold ${W*.042}px "Noto Sans Bengali",Arial,sans-serif`;ctx.textAlign="center";ctx.fillText("প্লাস্টিক দূষণের সমাধান",W/2,H*.96);
}
function drawBurn1(ctx,W,H){
  ctx.fillStyle="#fff3e0";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#e0e0e0";ctx.fillRect(W*.35,H*.55,W*.3,H*.04);
  ctx.fillStyle="#757575";ctx.fillRect(W*.38,H*.59,W*.06,H*.18);ctx.fillRect(W*.56,H*.59,W*.06,H*.18);
  ctx.fillStyle="#9e9e9e";for(let i=0;i<4;i++)ctx.fillRect(W*.36+i*W*.07,H*.56,W*.06,H*.08);
  ctx.fillStyle="#ff7043";ctx.beginPath();ctx.ellipse(W*.5,H*.5,W*.08,H*.1,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ffcc02";ctx.beginPath();ctx.ellipse(W*.5,H*.46,W*.05,H*.08,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#424242";
  for(let s=0;s<10;s++){const sx=W*.3+s*W*.04,sy=H*.15+Math.sin(s)*H*.08;ctx.beginPath();ctx.arc(sx,sy,8+s*1.5,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle="#b71c1c";ctx.font=`bold ${W*.042}px "Noto Sans Bengali",Arial,sans-serif`;ctx.textAlign="center";ctx.fillText("কখনও প্লাস্টিক পোড়াবেন না!",W/2,H*.96);
}
function drawBurn2(ctx,W,H){
  ctx.fillStyle="#fce4ec";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#ef9a9a";ctx.beginPath();ctx.ellipse(W*.5,H*.4,W*.28,H*.14,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#d32f2f";ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(W*.5,H*.4,W*.28,H*.14,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle="#ef5350";ctx.font=`${W*.045}px "Noto Sans Bengali",Arial,sans-serif`;ctx.textAlign="center";ctx.fillText("বিষাক্ত",W/2,H*.43);
  ctx.strokeStyle="#c62828";ctx.lineWidth=2.5;
  for(let a=0;a<8;a++){const angle=a*Math.PI/4;ctx.beginPath();ctx.moveTo(W*.5+W*.3*Math.cos(angle),H*.4+H*.16*Math.sin(angle));ctx.lineTo(W*.5+W*.45*Math.cos(angle),H*.4+H*.22*Math.sin(angle));ctx.stroke();}
  ctx.fillStyle="#1a237e";ctx.font=`bold ${W*.038}px "Noto Sans Bengali",Arial,sans-serif`;ctx.textAlign="center";ctx.fillText("বিষ মাটি ও জলে ছড়ায়",W/2,H*.8);
  ctx.fillStyle="#b71c1c";ctx.font=`${W*.034}px "Noto Sans Bengali",Arial,sans-serif`;ctx.fillText("ক্যানসার | ফুসফুসের রোগ | শিশুরা ঝুঁকিতে",W/2,H*.88);
}
function drawBurn3(ctx,W,H){
  ctx.fillStyle="#e8f5e9";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#a5d6a7";ctx.fillRect(0,H*.65,W,H*.35);
  const acts=[{c:"#1565c0",l:"প্লাস্টিক প্রত্যাখ্যান করুন",y:.22},{c:"#2e7d32",l:"কাপড়ের থলি ব্যবহার করুন",y:.36},{c:"#f9a825",l:"বর্জ্য থেকে কম্পোস্ট করুন",y:.50},{c:"#e53935",l:"পোড়ানোর খবর জানান",y:.64},{c:"#009688",l:"গাছ লাগান",y:.78}];
  acts.forEach(a=>{ctx.fillStyle=a.c;ctx.fillRect(W*.08,H*a.y,W*.84,H*.1);ctx.fillStyle="#fff";ctx.font=`bold ${W*.04}px "Noto Sans Bengali",Arial,sans-serif`;ctx.textAlign="center";ctx.fillText(a.l,W*.5,H*(a.y+.068));});
  ctx.fillStyle="#1a237e";ctx.font=`bold ${W*.042}px "Noto Sans Bengali",Arial,sans-serif`;ctx.textAlign="center";ctx.fillText("আজই যা করতে পারেন",W/2,H*.96);
}

const fallbacks=[[drawSoak1,drawSoak2,drawSoak3],[drawRain1,drawRain2,drawRain3],[drawSoil1,drawSoil2,drawSoil3],[drawBurn1,drawBurn2,drawBurn3]];

function makeCanvas(tabIdx){
  const cv=document.getElementById("c"+tabIdx);
  if(!cv)return;
  const box=cv.parentElement;
  const W=box.offsetWidth||360,H=Math.round(W*0.75);
  cv.width=W;cv.height=H;
  const ctx=cv.getContext("2d");
  const imgSrc=tabs[tabIdx].imgs[curImg[tabIdx]];
  const im=new Image();
  im.onload=()=>{ctx.drawImage(im,0,0,W,H);};
  im.onerror=()=>{fallbacks[tabIdx][curImg[tabIdx]](ctx,W,H);};
  im.src=imgSrc;
}

function updateInfo(tabIdx){
  const s=tabs[tabIdx].slides[curImg[tabIdx]];
  document.getElementById("t"+tabIdx).textContent=s.title;
  document.getElementById("d"+tabIdx).textContent=s.desc;
  const fr=document.getElementById("f"+tabIdx);
  fr.innerHTML=s.facts.map(f=>`<span class="fact">${f}</span>`).join("");
  const dr=document.getElementById("dots"+tabIdx);
  dr.innerHTML=tabs[tabIdx].imgs.map((_,i)=>`<div class="img-dot${i===curImg[tabIdx]?" on":""}" onclick="goImg(${tabIdx},${i})"></div>`).join("");
  makeCanvas(tabIdx);
  stopVoice();
}

function nextImg(ti){curImg[ti]=(curImg[ti]+1)%3;updateInfo(ti);}
function prevImg(ti){curImg[ti]=(curImg[ti]+2)%3;updateInfo(ti);}
function goImg(ti,i){curImg[ti]=i;updateInfo(ti);}

let spkEl=null,spkTi=-1;
function stopVoice(){if(window.speechSynthesis)window.speechSynthesis.cancel();if(spkEl){spkEl.classList.remove("spk");spkEl.innerHTML="&#128266; শুনুন";}spkTi=-1;}
function speak(ti){

  if(!window.speechSynthesis)return;

  if(spkTi===ti){
    stopVoice();
    return;
  }

  stopVoice();

  speechSynthesis.cancel();

  const s=tabs[ti].slides[curImg[ti]];

  const u=new SpeechSynthesisUtterance(
    s.title + ". " + s.desc
  );

  u.lang="bn-IN";

  u.rate=0.9;

  u.pitch=1;

  const voices=speechSynthesis.getVoices();

  const mobileVoice=voices.find(v=>
    v.lang.toLowerCase().replace("_","-").startsWith("bn")
  );

  if(mobileVoice){
    u.voice=mobileVoice;
  }

  setTimeout(()=>{
    speechSynthesis.speak(u);
  },100);

  u.onend=()=>stopVoice();

  spkEl=document.getElementById("vb"+ti);

  spkTi=ti;

  spkEl.classList.add("spk");

  spkEl.innerHTML="🔇 থামান";
}
function openTab(i){
  document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("active",j===i));
  document.querySelectorAll(".tp").forEach((t,j)=>t.classList.toggle("active",j===i));
  stopVoice();
  if(i<4)setTimeout(()=>updateInfo(i),80);
  else renderGame();
}

function renderGame(){
  const ga=document.getElementById("gameArea");
  if(gIdx>=qs.length){
    const pct=Math.round(gScore/qs.length*100);
    let em="&#127774;",msg="ভালো চেষ্টা! পাঠগুলি আবার দেখে নিয়ে আবার চেষ্টা করুন।";
    if(pct>=80){em="&#127881;";msg="চমৎকার! আপনি একজন ইকো চ্যাম্পিয়ন!";}
    else if(pct>=60){em="&#129299;";msg="ভালো কাজ! আর একটু শিখলেই আপনি সেরা হবেন!";}
    ga.innerHTML=`<div class="result-wrap"><div class="result-emoji">${em}</div><div class="result-score">${bnNum(gScore)} / ${bnNum(qs.length)}</div><p class="result-msg">${msg}</p><button class="restart-btn" onclick="restartGame()">আবার খেলুন &#8635;</button></div>`;
    return;
  }
  const q=qs[gIdx];
  const prog=Math.round(gIdx/qs.length*100);
  ga.innerHTML=`<div class="prog-bar"><div class="prog-fill" style="width:${prog}%"></div></div><div class="score-bar"><span class="score-lbl">প্রশ্ন ${bnNum(gIdx+1)} / ${bnNum(qs.length)}</span><span class="score-val">&#11088; ${bnNum(gScore)}</span></div><div class="q-img"><canvas id="qcv"></canvas></div><div class="q-text">${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<div class="opt" id="opt${i}" onclick="pickAns(${i})">${o}</div>`).join("")}</div><div id="qfb" style="display:none"></div><button class="next-btn" id="qnxt" style="display:none" onclick="nextQ()">পরের প্রশ্ন &#9654;</button>`;
  gAnswered=false;
  const qcv=document.getElementById("qcv");
  if(qcv){
    const box=qcv.parentElement;const W=box.offsetWidth||340,H=Math.round(W*.75);
    qcv.width=W;qcv.height=H;
    const ctx=qcv.getContext("2d");
    const imgSrc=tabs[q.tab].imgs[q.img];
    const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,W,H);
    im.onerror=()=>fallbacks[q.tab][q.img](ctx,W,H);
    im.src=imgSrc;
  }
}

function pickAns(i){
  if(gAnswered)return;
  gAnswered=true;
  const q=qs[gIdx];
  const correct=i===q.ans;
  if(correct)gScore++;
  for(let k=0;k<4;k++){
    const el=document.getElementById("opt"+k);
    if(!el)continue;
    el.classList.add("disabled");
    if(k===q.ans)el.classList.add("correct");
    else if(k===i&&!correct)el.classList.add("wrong");
  }
  const fb=document.getElementById("qfb");
  fb.className="fb "+(correct?"ok":"bad");
  fb.textContent=(correct?"সঠিক! ":"ভুল! ")+q.exp;
  fb.style.display="block";
  document.getElementById("qnxt").style.display="block";
}

function nextQ(){gIdx++;renderGame();}
function restartGame(){gIdx=0;gScore=0;renderGame();}

setTimeout(()=>{
  for(let i=0;i<4;i++)updateInfo(i);
  updateInfo(0);
},150);
window.addEventListener("resize",()=>{for(let i=0;i<4;i++)makeCanvas(i);});
/* MOBILE BACK BUTTON */
history.pushState({home:true},"",location.href);
window.addEventListener("popstate",function(){
  const activeTab=document.querySelector(".tab.active");
  const idx=[...document.querySelectorAll(".tab")].indexOf(activeTab);
  if(idx!==0){
    openTab(0);
    history.pushState({home:true},"",location.href);
  }
});
</script>
</body>
</html>
