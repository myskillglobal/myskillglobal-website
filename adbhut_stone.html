<style>
  :root{
    --navy-950:#050b16;
    --navy-900:#0a1428;
    --navy-800:#0f1c36;
    --navy-700:#16274a;
    --gold-500:#d4af37;
    --gold-400:#e8c766;
    --gold-300:#f3dd9c;
    --text-soft:#e9e4d6;
    --text-muted:#9fb0c9;
  }
.home-btn{
  position:absolute;left:14px;top:calc(14px + env(safe-area-inset-top,0px));
  width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.35);color:var(--gold-soft);
  text-decoration:none;font-size:1.05rem;
}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, var(--navy-800) 0%, var(--navy-950) 65%);
    color:var(--text-soft);
    font-family:'Hind Siliguri','Noto Sans Bengali','Kalpurush',sans-serif;
    line-height:1.9;
    min-height:100vh;
    padding-bottom:110px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;700&display=swap');

  header.cover{
    position:relative;
    width:100%;
    overflow:hidden;
    border-bottom:2px solid var(--gold-500);
  }
  header.cover img{
    width:100%;
    display:block;
    max-height:56vh;
    object-fit:cover;
    object-position:center 30%;
  }
  header.cover::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom, rgba(5,11,22,0.05) 0%, rgba(5,11,22,0.55) 70%, var(--navy-950) 100%);
  }
  .cover-text{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:22px 18px 20px;
    z-index:2;
    text-align:center;
  }
  .cover-text .kicker{
    letter-spacing:3px;
    font-size:12px;
    color:var(--gold-400);
    text-transform:uppercase;
    font-weight:600;
  }
  .cover-text h1{
    margin:6px 0 4px;
    font-family:'Noto Serif Bengali',serif;
    font-size:clamp(28px,7vw,46px);
    color:var(--gold-300);
    text-shadow:0 2px 18px rgba(0,0,0,0.7);
  }
  .cover-text .subtitle{
    color:var(--text-soft);
    font-size:clamp(14px,3.6vw,18px);
    opacity:0.9;
  }

  main{
    max-width:760px;
    margin:0 auto;
    padding:26px 18px 10px;
  }

  /* Table of contents */
  .toc{
    background:linear-gradient(180deg, var(--navy-800), var(--navy-900));
    border:1px solid rgba(212,175,55,0.3);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:32px;
  }
  .toc h3{
    margin:0 0 12px;
    color:var(--gold-400);
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  .toc-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 4px;
    border-bottom:1px solid rgba(212,175,55,0.12);
    text-decoration:none;
    color:var(--text-soft);
  }
  .toc-item:last-child{border-bottom:none;}
  .toc-item .ep-num{
    color:var(--gold-500);
    font-weight:700;
    margin-right:8px;
  }
  .toc-item .ep-title{flex:1; font-size:15px;}
  .toc-item .ep-go{color:var(--gold-400); font-size:13px;}

  .episode{
    margin-bottom:44px;
    scroll-margin-top:20px;
  }

  .episode-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
    border-bottom:1px solid rgba(212,175,55,0.35);
    padding-bottom:14px;
  }
  .episode-tag{
    display:inline-block;
    background:linear-gradient(135deg, var(--gold-500), var(--gold-400));
    color:var(--navy-950);
    font-weight:700;
    font-size:13px;
    padding:6px 14px;
    border-radius:20px;
    letter-spacing:0.5px;
  }
  .story-title{
    font-family:'Noto Serif Bengali',serif;
    font-size:clamp(20px,5vw,26px);
    color:var(--gold-300);
    margin:8px 0 0;
  }
  .listen-btn{
    background:transparent;
    border:1px solid var(--gold-500);
    color:var(--gold-400);
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .listen-btn:active{transform:scale(0.96);}

  .story p{
    margin:0 0 18px;
    font-size:17px;
    color:var(--text-soft);
  }
  .story p.dialogue{
    color:var(--gold-300);
    font-style:italic;
    padding-left:14px;
    border-left:3px solid var(--gold-500);
  }
  .story p.sfx{
    text-align:center;
    color:var(--text-muted);
    letter-spacing:2px;
    font-size:15px;
    margin:8px 0;
  }
  .story p.scene-break{
    text-align:center;
    color:var(--gold-500);
    margin:26px 0;
    letter-spacing:6px;
  }
  .story p.emphasis{
    color:var(--gold-400);
    font-weight:700;
  }
  .story p.active-line{
    background:rgba(212,175,55,0.10);
    border-radius:8px;
    padding:8px 10px;
    margin-left:-10px;
    margin-right:-10px;
    box-shadow:inset 3px 0 0 var(--gold-500);
  }

  .tobecontinued{
    text-align:center;
    margin:30px 0 6px;
    font-family:'Noto Serif Bengali',serif;
    font-size:20px;
    color:var(--gold-400);
    letter-spacing:2px;
  }
  .next-note{
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
    margin-bottom:10px;
  }

  .voice-hint{
    text-align:center;
    color:var(--text-muted);
    font-size:12px;
    margin:8px 0 20px;
    display:none;
  }

  /* Player bar */
  .player-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:linear-gradient(180deg, rgba(10,20,40,0.85), var(--navy-900));
    border-top:1px solid rgba(212,175,55,0.4);
    backdrop-filter:blur(10px);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    gap:10px;
    z-index:10;
  }
  .player-bar .status{flex:1; min-width:0;}
  .player-bar .status .label{font-size:12px; color:var(--text-muted);}
  .player-bar .status .now{
    font-size:14px;
    color:var(--gold-300);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .player-bar button{
    background:var(--navy-700);
    border:1px solid var(--gold-500);
    color:var(--gold-400);
    width:40px;
    height:40px;
    border-radius:50%;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform 0.15s ease;
  }
  .player-bar button:active{transform:scale(0.92);}
  .player-bar button.primary{
    width:50px; height:50px;
    background:linear-gradient(135deg, var(--gold-500), var(--gold-400));
    color:var(--navy-950);
    font-size:19px;
    border:none;
  }
</style>
</head>

<main>

  <nav class="toc" id="toc">

  <div id="episodesContainer"></div>

</main>

<div class="player-bar" id="playerBar" style="display:none;">

<script>

const episodes = [

      {t:"পাহাড়ের পথটা ছিল অত্যন্ত দুর্গম।", c:""},
      {t:"একদিকে খাড়া পাহাড়, অন্যদিকে গভীর খাদ। মাঝখানে সরু পাথুরে রাস্তা। একটু অসাবধান হলেই বিপদ।", c:""},
      {t:"সেই পথ দিয়েই এক ভিখারী ধীরে ধীরে এগিয়ে চলেছে।", c:""},
      {t:"কাঁধে ছেঁড়া ঝোলা, হাতে বাঁশের লাঠি, পায়ে পুরোনো জুতো। হাঁটতে হাঁটতে সে হাঁপিয়ে উঠছে।", c:""},

      {t:"ভিখারী বিরক্ত হয়ে বলল —", c:""},
      {t:"“নিজের কথাও আবার নিজেকেই শুনতে হচ্ছে! এই পাহাড়ে মানুষের অভাব নাকি?”", c:"dialogue"},
      {t:"তারপর আবার হাঁটতে শুরু করল।", c:""},

      {t:"কোথাও বড় পাথর, কোথাও ছোট পাথর, কোথাও সরু বাঁক।", c:""},
      {t:"একবার পা পিছলে সে কোনোমতে একটা গাছের ডাল ধরে বাঁচল।", c:""},
      {t:"সে আকাশের দিকে তাকিয়ে বলল —", c:""},

      {t:"ঠিক সেই সময় পাহাড়ের ওপরে দেবী লক্ষ্মী ও নারায়ণ বসে পৃথিবীর দিকে তাকিয়ে ছিলেন।", c:""},

      {t:"“আচ্ছা, আমি যদি অন্ধ হতাম?”", c:"dialogue"},

      {t:"“আবার কীসব ভাবছি!”", c:"dialogue"},

// ---- Render TOC ----
const tocEl = document.getElementById('toc');
episodes.forEach((ep, i) => {
  const a = document.createElement('a');
  a.href = '#' + ep.id;
  a.className = 'toc-item';
  a.innerHTML = '<span><span class="ep-num">' + ep.tag + '</span><span class="ep-title">' + ep.title + '</span></span><span class="ep-go">পড়ুন →</span>';
  tocEl.appendChild(a);
});

// ---- Render episodes ----
const container = document.getElementById('episodesContainer');
episodes.forEach((ep, epIndex) => {
  const section = document.createElement('div');
  section.className = 'episode';
  section.id = ep.id;

  const headerHtml = document.createElement('div');
  headerHtml.className = 'episode-header';
  headerHtml.innerHTML =
    '<div><span class="episode-tag">' + ep.tag + '</span><h2 class="story-title">' + ep.title + '</h2></div>' +
    '<button class="listen-btn" onclick="playEpisode(' + epIndex + ')">🔊 শুনুন</button>';
  section.appendChild(headerHtml);

  const storyDiv = document.createElement('div');
  storyDiv.className = 'story';
  storyDiv.id = 'story-' + epIndex;
  ep.lines.forEach((p, i) => {
    const el = document.createElement('p');
    el.id = 'line-' + epIndex + '-' + i;
    el.className = p.c;
    el.textContent = p.t;
    storyDiv.appendChild(el);
  });
  section.appendChild(storyDiv);

  const tbc = document.createElement('div');
  tbc.className = 'tobecontinued';
  tbc.textContent = ep.final ? 'সমাপ্ত' : 'চলবে...';
  section.appendChild(tbc);

  if (ep.final) {
    const note = document.createElement('div');
    note.className = 'next-note';
    note.textContent = 'গল্পের সমাপ্তি — ধন্যবাদ শেষ পর্যন্ত পড়ার জন্য।';
    section.appendChild(note);
  } else if (epIndex === episodes.length - 1) {
    const note = document.createElement('div');
    note.className = 'next-note';
    note.textContent = 'পরের পর্বে জানা যাবে — বহুদিন আগে যে ভিখারী এই রত্নকে চোখ বন্ধ করে লাথি মেরেছিল, তার কাছে রত্ন কীভাবে আবার ফিরে আসে।';
    section.appendChild(note);
  }

  container.appendChild(section);
});

// ---- Speech synthesis engine ----
let currentEpisode = -1;
let currentLine = -1;
let isPaused = false;
let isPlaying = false;
let bengaliVoice = null;

function pickVoice(){
  const voices = speechSynthesis.getVoices();
  bengaliVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('bn')) || null;
  if(!bengaliVoice){
    document.getElementById('voiceHint').style.display = 'block';
  }
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
} else {
  document.getElementById('voiceHint').style.display = 'block';
  document.getElementById('voiceHint').textContent = 'এই ব্রাউজারে ভয়েস পড়ার সুবিধা নেই।';
}

function clearHighlight(){
  document.querySelectorAll('.active-line').forEach(e => e.classList.remove('active-line'));
}

function speakLine(epIndex, lineIndex){
  const ep = episodes[epIndex];
  if(!ep || lineIndex >= ep.lines.length){
    stopStory();
    return;
  }
  currentEpisode = epIndex;
  currentLine = lineIndex;
  clearHighlight();
  const lineEl = document.getElementById('line-' + epIndex + '-' + lineIndex);
  lineEl.classList.add('active-line');
  lineEl.scrollIntoView({behavior:'smooth', block:'center'});
  document.getElementById('epLabel').textContent = ep.tag + ' · ' + ep.title;
  document.getElementById('nowLine').textContent = ep.lines[lineIndex].t;

  const utter = new SpeechSynthesisUtterance(ep.lines[lineIndex].t.replace(/[“”—]/g,''));
  if(bengaliVoice) utter.voice = bengaliVoice;
  utter.lang = 'bn-IN';
  utter.rate = 0.95;
  utter.pitch = 1;
  utter.onend = () => {
    if(isPlaying && !isPaused){
      speakLine(epIndex, lineIndex + 1);
    }
  };
  speechSynthesis.speak(utter);
}

function playEpisode(epIndex, startLine){
  if(!('speechSynthesis' in window)){
    alert('আপনার ব্রাউজার ভয়েস পড়ার সুবিধা সাপোর্ট করে না।');
    return;
  }
  if(epIndex < 0 || epIndex >= episodes.length) return;
  speechSynthesis.cancel();
  isPlaying = true;
  isPaused = false;
  document.getElementById('playerBar').style.display = 'flex';
  document.getElementById('playPauseBtn').textContent = '⏸';
  speakLine(epIndex, startLine || 0);
}

function togglePlayPause(){
  if(!isPlaying) return;
  if(isPaused){
    speechSynthesis.resume();
    isPaused = false;
    document.getElementById('playPauseBtn').textContent = '⏸';
  } else {
    speechSynthesis.pause();
    isPaused = true;
    document.getElementById('playPauseBtn').textContent = '▶';
  }
}

function stopStory(){
  speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  currentEpisode = -1;
  currentLine = -1;
  clearHighlight();
  document.getElementById('playerBar').style.display = 'none';
}

function nextEpisode(){
  if(currentEpisode + 1 < episodes.length){
    playEpisode(currentEpisode + 1);
  }
}

function prevEpisode(){
  if(currentEpisode - 1 >= 0){
    playEpisode(currentEpisode - 1);
  }
}
</script>
