<style>
  :root{
    --p1:#ff5fa8; --p2:#e91e8c; --p3:#b0155f; --p4:#7a0f47;
    --soft:#fff0f7; --soft2:#ffdcec; --line:#f6c3dc;
    --ink:#3b0a27; --muted:#8c5873; --gold:#c9a84c; --gold2:#e8c97a;
    --shadow:0 12px 30px rgba(176,21,95,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; color:var(--ink); min-height:100vh;
    font-family:'Poppins','Hind Siliguri','Noto Sans Bengali','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,95,168,.16), transparent 42%),
      radial-gradient(circle at 92% 30%, rgba(201,168,76,.12), transparent 40%),
      linear-gradient(180deg,#fff3f9,#ffe7f3 60%,#ffdcec);
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
  }
  .wrap{max-width:720px; margin:0 auto; padding:0 16px;}

  header{
    position:relative; overflow:hidden; text-align:center; color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 34px;
    background:linear-gradient(135deg,var(--p4),var(--p3) 48%,var(--p2));
    border-radius:0 0 34px 34px; box-shadow:0 12px 34px rgba(122,15,71,.35);
  }
  .deco{position:absolute; border-radius:50%; background:rgba(255,255,255,.08); pointer-events:none;}
  .deco.d1{width:220px; height:220px; left:-70px; top:-80px;}
  .deco.d2{width:260px; height:260px; right:-90px; bottom:-120px; background:rgba(232,201,122,.14);}
  .topnav{position:relative; z-index:2; display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px;}
  .topnav a{color:var(--gold2); text-decoration:none; font-size:.8rem; font-weight:700;}
  .logo{position:relative; z-index:2; width:104px; height:104px; border-radius:26px; display:block; margin:4px auto 10px; box-shadow:0 10px 26px rgba(0,0,0,.3); border:3px solid rgba(232,201,122,.8);}
  h1{position:relative; z-index:2; margin:0; font-size:1.9rem; font-weight:900; text-shadow:0 2px 10px rgba(0,0,0,.25);}
  .sub{position:relative; z-index:2; margin-top:4px; font-size:1rem; font-weight:700; color:var(--gold2);}
  .tag{position:relative; z-index:2; margin:10px auto 0; max-width:30em; font-size:.88rem; line-height:1.5; color:#ffe9f4;}
  .chips{position:relative; z-index:2; display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .chip{padding:7px 14px; border-radius:20px; font-size:.76rem; font-weight:800; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.32);}
  .chip.gold{background:linear-gradient(90deg,var(--gold),var(--gold2)); color:#3a2a00; border-color:transparent;}

  .section{padding:20px 0 0;}
  .card{background:#fff; border-radius:22px; padding:20px; margin-bottom:16px; border:1px solid var(--line); box-shadow:var(--shadow);}
  .card h2{margin:0 0 6px; font-size:1.1rem; color:var(--p3);}
  .card p.d{margin:0 0 12px; font-size:.88rem; line-height:1.5; color:var(--muted);}
  .lang-row{display:flex; gap:8px; flex-wrap:wrap;}
  .lang-btn{flex:1 1 90px; padding:11px 10px; border-radius:14px; border:1.5px solid var(--line); background:var(--soft); font-size:.95rem; font-weight:800; color:var(--p3); cursor:pointer; font-family:inherit;}
  .lang-btn.active{background:linear-gradient(135deg,var(--p2),var(--p3)); color:#fff; border-color:transparent; box-shadow:0 6px 16px rgba(233,30,140,.35);}

  .ed-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .ed{display:block; padding:14px 8px; border-radius:18px; border:none; cursor:pointer; font-family:inherit; text-align:center; line-height:1.25; color:#fff; text-decoration:none;
      background:linear-gradient(135deg,var(--p2),var(--p3)); box-shadow:0 10px 22px rgba(176,21,95,.35); transition:transform .12s;}
  .ed:active{transform:scale(.97);}
  .ed .fl{display:block; font-size:1.7rem; margin-bottom:2px;}
  .ed b{display:block; font-size:1.02rem; font-weight:900;}
  .ed small{display:block; margin-top:4px; font-size:.68rem; font-weight:700; opacity:.9;}
  .ed .st{display:block; margin-top:6px; font-size:.7rem; font-weight:900; color:#3a2a00; background:linear-gradient(90deg,var(--gold),var(--gold2)); border-radius:10px; padding:3px 6px;}

  .links{display:grid; gap:10px;}
  .lk{display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:16px; text-decoration:none; background:var(--soft); border:1.5px solid var(--line); color:var(--p3); font-weight:800; font-size:.95rem;}
  .lk .ic{flex:none; width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; background:#fff;}
  .lk small{display:block; font-weight:600; font-size:.74rem; color:var(--muted); margin-top:1px;}
  .lk.gold{background:linear-gradient(90deg,var(--gold),var(--gold2)); border-color:transparent; color:#3a2a00;}
  .lk.gold small{color:#5b4300;}

  details.notice summary{cursor:pointer; font-weight:900; color:var(--p3); font-size:1.02rem; list-style:none;}
  details.notice summary::-webkit-details-marker{display:none;}
  details.notice summary::after{content:' ▾'; color:var(--muted);}
  details.notice[open] summary::after{content:' ▴';}
  .nbody{margin-top:10px;}
  .nbody ol{margin:0 0 10px; padding-left:20px; display:grid; gap:7px; font-size:.84rem; line-height:1.45;}
  .nbody .g{margin:0 0 9px; font-size:.83rem; line-height:1.45;}
  .nbody .g b{display:block; color:var(--p3); font-size:.84rem;}
  .nbody .dh{margin:12px 0 6px; font-weight:900; font-size:.82rem; color:var(--p3); letter-spacing:.3px;}
  .nbody .dp{margin:0 0 7px; font-size:.78rem; line-height:1.45; color:var(--muted);}

  /* ===== Public Leaderboard (Smart Lady only) ===== */
  .lb-label{display:inline-block; font-size:.7rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--p3); background:var(--soft2); border-radius:999px; padding:3px 12px; margin-bottom:6px;}
  .gold-line{width:64px; height:4px; border-radius:4px; background:linear-gradient(90deg,var(--gold),var(--p2)); margin:6px 0 12px;}
  .lb-controls{display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 10px;}
  .lb-select{flex:1 1 150px; min-width:0; padding:11px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--soft); color:var(--ink); font-family:inherit; font-size:.9rem; outline:none;}
  .lb-refresh{flex:0 0 auto; padding:11px 16px; border-radius:12px; border:1.5px solid var(--p2); background:#fff; color:var(--p2); font-family:inherit; font-weight:800; font-size:.88rem; cursor:pointer;}
  .lb-refresh:active{background:var(--p2); color:#fff;}
  .lb-note{margin:0 0 10px; font-size:.76rem; line-height:1.6; color:var(--muted);}
  .lb-wrap{width:100%; overflow-x:auto; border-radius:12px;}
  .lb-table{width:100%; border-collapse:collapse;}
  .lb-table th{padding:11px 10px; background:var(--soft2); color:var(--p4); font-size:.72rem; letter-spacing:.4px; text-align:left; border-bottom:2px solid var(--gold);}
  .lb-table td{padding:12px 10px; font-size:.86rem; color:var(--ink); border-bottom:1px solid var(--line);}
  .lb-table tbody tr:hover{background:rgba(233,30,140,.05);}
  .lb-rank{font-weight:900; color:var(--p2); white-space:nowrap;}
  .lb-score{font-weight:900; color:#1f7a4d; white-space:nowrap;}
  .lb-att{font-weight:700; color:var(--p3);}
  .lb-msg{text-align:center !important; padding:26px 12px !important; color:var(--muted) !important; line-height:1.6;}
  .lb-table.no-school .col-school{display:none;}
  @media (max-width:560px){
    .lb-table thead{display:none;}
    .lb-table, .lb-table tbody, .lb-table tr, .lb-table td{display:block; width:100%;}
    .lb-table tr{border:1.5px solid var(--line); border-radius:14px; padding:8px 12px; margin-bottom:10px; background:var(--soft);}
    .lb-table td{border:none; padding:4px 0; display:flex; justify-content:space-between; gap:12px; text-align:right;}
    .lb-table td::before{content:attr(data-label); font-weight:700; font-size:.72rem; color:var(--muted); text-align:left; flex:none;}
    .lb-table td.lb-msg{display:block;}
    .lb-table td.lb-msg::before{content:none;}
    .lb-refresh{flex:1 1 100%;}
  }
  footer{text-align:center; font-size:.78rem; color:var(--muted); padding:6px 16px 0; line-height:1.7;}
  footer a{color:var(--p3); font-weight:700;}
  @media (max-width:380px){ .ed-row{grid-template-columns:1fr;} }
</style>
</head>

  lbLabel:'वैश्विक उपलब्धि बोर्ड', lbHead:'🏆 Smart Lady लीडरबोर्ड', lbDesc:'Smart Lady एडवांस्ड लेवल परीक्षा के शीर्ष प्रदर्शनकर्ता। यह सीखने, भागीदारी और उपलब्धि का सम्मान करता है।', lbAllCountries:'🌍 सभी देश', lbAllEditions:'सभी संस्करण', lbRefresh:'🔄 रिफ्रेश', lbRank:'रैंक', lbName:'नाम', lbSchool:'स्कूल', lbCountryCol:'देश', lbEditionCol:'संस्करण', lbScore:'सर्वश्रेष्ठ स्कोर', lbAttempts:'प्रयास', lbLoading:'स्कोर लोड हो रहे हैं…', lbEmpty:'स्कोर समय-समय पर अपडेट होते हैं। परीक्षा दें, बोर्ड पर पहला नाम आपका भी हो सकता है!', lbError:'अभी स्कोर लोड नहीं हो सके। कृपया थोड़ी देर बाद पुनः प्रयास करें।', lbCount:'{m} शिक्षार्थियों में से {n} दिखाए जा रहे हैं', lbNote:'🔒 सार्वजनिक रूप से केवल नाम, देश, संस्करण, सर्वश्रेष्ठ स्कोर और प्रयासों की संख्या दिखाई जाती है। स्टूडेंट आईडी और अन्य निजी जानकारी कभी नहीं दिखाई जाती।',
 noticeSum:'महत्वपूर्ण सूचनाएँ', fLine:'निःशुल्क · ऐप में कोई विज्ञापन नहीं · आपके उत्तर आपके डिवाइस पर ही रहते हैं'}
};

var LB = null;
var lang = 'en';
try{ lang = localStorage.getItem(LANGKEY) || 'en'; }catch(e){}
if(!T[lang]) lang = 'en';

function $(id){ return document.getElementById(id); }
function tr(k){ return T[lang][k] != null ? T[lang][k] : T.en[k]; }
function gt(o){ return (o && (o[lang] || o.en)) || ''; }
function el(parent, tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; parent.appendChild(e); return e; }
function progress(key){
  try{ var r = JSON.parse(localStorage.getItem(PROG[key])); if(r && r.started) return r; }catch(e){}
  return null;
}

function render(){
  document.documentElement.lang = lang;
  ['hSub','hTag','tLang','tExam','dExam','tCert','tLearn','dLearn','noticeSum','fLine'].forEach(function(id){ $(id).textContent = tr(id); });
  $('chipQ').textContent = tr('chipQ'); $('chipPass').textContent = tr('chipPass');
  $('homeLink').textContent = tr('home'); $('homeBot').textContent = tr('home');
  $('privTop').textContent = tr('priv'); $('privBot').textContent = tr('priv');

  var lr = $('langRow'); lr.innerHTML = '';
  LANGS.forEach(function(l){
    var b = el(lr, 'button', 'lang-btn' + (l[0] === lang ? ' active' : ''), l[1]); b.type = 'button';
    b.addEventListener('click', function(){ lang = l[0]; try{ localStorage.setItem(LANGKEY, lang); }catch(e){} render(); });
  });

  var er = $('edRow'); er.innerHTML = '';
  [['india','🇮🇳','edIndia','edIndiaSub'], ['intl','🌍','edIntl','edIntlSub']].forEach(function(e){
    var a = el(er, 'a', 'ed'); a.href = 'smartlady-exam.html?edition=' + e[0];
    el(a, 'span', 'fl', e[1]); el(a, 'b', '', tr(e[2])); el(a, 'small', '', tr(e[3]));
    var p = progress(e[0]);
    el(a, 'span', 'st', p ? tr('cont') + ' · ' + tr('saved').replace('{s}', p.score || 0) : tr('start'));
  });

  var cl = $('certLinks'); cl.innerHTML = '';
  [['certificate-smartlady.html','🏅','cert','certSub','lk gold'], ['certificate-smartlady-history.html','📜','hist','histSub','lk']].forEach(function(x){
    var a = el(cl, 'a', x[4]); a.href = x[0];
    el(a, 'span', 'ic', x[1]); var d = el(a, 'div'); el(d, 'span', '', tr(x[2])); el(d, 'small', '', tr(x[3]));
  });

  var ll = $('learnLinks'); ll.innerHTML = '';
  [['smartlady.html','📖','learnEn','learnEnSub'], ['smartlady-bn.html','📖','learnBn','learnBnSub']].forEach(function(x){
    var a = el(ll, 'a', 'lk'); a.href = x[0];
    el(a, 'span', 'ic', x[1]); var d = el(a, 'div'); el(d, 'span', '', tr(x[2])); el(d, 'small', '', tr(x[3]));
  });

  if(LB) LB.draw();

  var nb = $('noticeBody'); nb.innerHTML = '';
  var h = el(nb, 'div', 'dh', gt(G.instructions.title));
  var ol = el(nb, 'ol'); G.instructions.items.forEach(function(it){ el(ol, 'li', '', gt(it)); });
  ['emergency','legal','publicServices'].forEach(function(k){
    var p = el(nb, 'p', 'g'); el(p, 'b', '', gt(G[k].title)); p.appendChild(document.createTextNode(gt(G[k].text)));
  });
  el(nb, 'div', 'dh', gt(G.disclaimer.title));
  G.disclaimer.paragraphs.forEach(function(p){ el(nb, 'p', 'dp', gt(p)); });
}

/* ================= PUBLIC LEADERBOARD (Smart Lady only) =================
   Data comes from the place set in SL_DB below. Until the database file is connected the board
   reads "smartlady-leaderboard.json" (same folder) if it exists. Replace SL_DB.fetchAll with your
   own function when the database is ready - it must resolve to an array of result rows.
   A row may contain: name, country, school (optional), edition ("India"/"International"),
   score, total, pct, studentId, type/exam ("Smart Lady Exam"), issueDate.
   Several rows for the same person are combined into best score + attempts.                      */
var SL_DB = {
  apiUrl: 'https://script.google.com/macros/s/AKfycbwd5lSMy8W1oEliPPrCT-0dRI7Xg4CA7_cjSnQpMc-FHe2ehFHiWfA7kuKKQdcBBYZq/exec',
  fetchAll: function(){
    return fetch(this.apiUrl, { method: 'GET', cache: 'no-store' }).then(function(r){
      if(!r.ok) throw new Error('Leaderboard API HTTP ' + r.status);
      return r.json();
    });
  },
  limit: 50              // how many learners are shown
};
LB = (function(){
  var raw = [], state = 'idle';   // idle | loading | ready | error
  var fCountry = '', fEdition = (function(){
  try{ var p = (new URLSearchParams(window.location.search).get('edition') || '').toLowerCase();
    if(p === 'international' || p === 'intl') return 'International';
    if(p === 'india') return 'India'; }catch(e){}
  return '';
})();

  function pickEdition(r){
    var e = (r.edition || r.subExam || '').toString().toLowerCase();
    if(e.indexOf('intl') === 0 || e.indexOf('international') === 0) return 'International';
    if(e.indexOf('india') === 0) return 'India';
    var c = ((r.content || '') + ' ' + (r.examName || '')).toLowerCase();
    if(c.indexOf('(international)') > -1) return 'International';
    if(c.indexOf('(india)') > -1) return 'India';
    var id = (r.certId || r.certificateId || '').toString();
    if(id.indexOf('MSG-SL-ADV-INT-') === 0) return 'International';
    if(id.indexOf('MSG-SL-ADV-IN-') === 0) return 'India';
    return 'India';   // the first version of the exam had no edition field and was India-only
  }
  function isSmartLady(r){
    var t = ((r.exam || '') + ' ' + (r.type || '') + ' ' + (r.examType || '') + ' ' + (r.language || '') + ' ' + (r.content || '')).toLowerCase();
    return /smart[\s_-]*lady/.test(t);
  }
  function build(){
    var map = {};
    raw.forEach(function(r){
      if(!r || !isSmartLady(r)) return;
      var isAggregated = r.bestScore != null || r.BestScore != null;
      var total = isAggregated ? 100 : (Number(r.total) || 100);
      var score = isAggregated ? Number(r.bestScore != null ? r.bestScore : r.BestScore) : Number(r.score);
      var pct = (r.pct != null && r.pct !== '') ? Number(r.pct) : (isFinite(score) ? score / total * 100 : NaN);
      if(!isFinite(score) || !isFinite(pct)) return;
      var ed = pickEdition(r);
      var name = (r.name || r.Name || '').toString().trim(); if(!name) return;
      var country = (r.country || r.Country || '').toString().trim();
      var who = (r.studentId || r.userId || r.uid || (name.toLowerCase() + '|' + country.toLowerCase())).toString();
      var k = who + '#' + ed;
      var m = map[k];
      if(!m){ m = map[k] = {name:name, country:country, school:(r.school || '').toString().trim(), state:(r.state || '').toString().trim(), city:(r.city || r.cityVillage || r.village || '').toString().trim(), edition:ed, score:score, total:total, pct:pct, attempts:0}; }
      if(isAggregated){
        m.attempts = Math.max(m.attempts, Number(r.attempts || r.Attempts) || 1);
        if(pct > m.pct){ m.score = score; m.total = total; m.pct = pct; }
      }else{
        m.attempts += 1;
        if(pct > m.pct || (pct === m.pct && score > m.score)){ m.score = score; m.total = total; m.pct = pct; }
      }
      if(!m.country && country) m.country = country;
      if(!m.school && r.school) m.school = r.school.toString().trim();
      if(!m.state && r.state) m.state = r.state.toString().trim();
      if(!m.city && (r.city || r.cityVillage || r.village)) m.city = (r.city || r.cityVillage || r.village).toString().trim();
    });
    var out = Object.keys(map).map(function(k){ return map[k]; });
    out.sort(function(a, b){ return (b.pct - a.pct) || (b.score - a.score) || (a.attempts - b.attempts) || a.name.localeCompare(b.name); });
    return out;
  }

  function load(force){
    state = 'loading'; draw();
    var p;
    try{
      if(typeof SL_DB.fetchAll === 'function') p = Promise.resolve(SL_DB.fetchAll());
      else p = fetch(SL_DB.jsonUrl + (force ? '?t=' + Date.now() : ''), {cache:'no-store'}).then(function(r){
        if(r.status === 404) return [];
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    }catch(e){ p = Promise.reject(e); }
    p.then(function(d){
      if(d && !Array.isArray(d)) d = d.results || d.rows || d.data || [];
      raw = Array.isArray(d) ? d : [];
      state = 'ready'; draw();
    }).catch(function(){ raw = []; state = 'error'; draw(); });
  }

  function td(tr, cls, label, text){
    var c = document.createElement('td'); if(cls) c.className = cls; c.setAttribute('data-label', label); c.textContent = text; tr.appendChild(c); return c;
  }
  function fillSelect(sel, first, items, cur){
    sel.innerHTML = '';
    var o = document.createElement('option'); o.value = ''; o.textContent = first; sel.appendChild(o);
    items.forEach(function(it){ var op = document.createElement('option'); op.value = it[0]; op.textContent = it[1]; sel.appendChild(op); });
    sel.value = cur;
    if(sel.value !== cur){ sel.value = ''; }
  }

  function draw(){
    $('lbLabel').textContent = tr('lbLabel'); $('lbHead').textContent = tr('lbHead');
    $('lbDesc').textContent = tr('lbDesc'); $('lbRefresh').textContent = tr('lbRefresh'); $('lbNote').textContent = tr('lbNote');

    var all = state === 'ready' ? build() : [];
    var countries = {}; all.forEach(function(r){ if(r.country) countries[r.country] = 1; });
    var clist = Object.keys(countries).sort().map(function(c){ return [c, c]; });
    if(fCountry && !countries[fCountry]) fCountry = '';
    fillSelect($('lbCountry'), tr('lbAllCountries'), clist, fCountry);
    fillSelect($('lbEdition'), tr('lbAllEditions'), [['India', tr('edIndia')], ['International', tr('edIntl')]], fEdition);

    var hasSchool = all.some(function(r){ return r.school; });
    var table = $('lbTable'); table.className = 'lb-table' + (hasSchool ? '' : ' no-school');
    var hr = $('lbHeadRow'); hr.innerHTML = '';
    [['lbRank',''],['lbName',''],['lbSchool','col-school'],['lbCountryCol',''],['lbEditionCol',''],['lbScore',''],['lbAttempts','']].forEach(function(h){
      var th = document.createElement('th'); if(h[1]) th.className = h[1]; th.textContent = tr(h[0]); hr.appendChild(th);
    });

    var body = $('lbBody'); body.innerHTML = '';
    function msg(t){ var r = document.createElement('tr'); var c = document.createElement('td'); c.colSpan = 7; c.className = 'lb-msg'; c.textContent = t; r.appendChild(c); body.appendChild(r); $('lbCount').textContent = ''; }
    if(state === 'idle' || state === 'loading'){ msg(tr('lbLoading')); return; }
    if(state === 'error'){ msg(tr('lbError')); return; }

    var list = all.filter(function(r){ return (!fCountry || r.country === fCountry) && (!fEdition || r.edition === fEdition); });
    if(!list.length){ msg(tr('lbEmpty')); return; }
    var shown = list.slice(0, SL_DB.limit);
    var medals = ['🥇', '🥈', '🥉'];
    shown.forEach(function(r, i){
      var tr_ = document.createElement('tr');
      td(tr_, 'lb-rank', tr('lbRank'), i < 3 ? medals[i] + ' ' + (i + 1) : String(i + 1));
      td(tr_, '', tr('lbName'), r.name);
      td(tr_, 'col-school', tr('lbSchool'), [r.school, r.city, r.state].filter(Boolean).join(' · ') || '—');
      td(tr_, '', tr('lbCountryCol'), r.country || '—');
      td(tr_, '', tr('lbEditionCol'), r.edition === 'International' ? tr('edIntl') : tr('edIndia'));
      td(tr_, 'lb-score', tr('lbScore'), r.score + '/' + r.total);
      td(tr_, 'lb-att', tr('lbAttempts'), String(r.attempts));
      body.appendChild(tr_);
    });
    $('lbCount').textContent = tr('lbCount').replace('{n}', shown.length).replace('{m}', list.length);
  }

  $('lbCountry').addEventListener('change', function(){ fCountry = this.value; draw(); });
  $('lbEdition').addEventListener('change', function(){ fEdition = this.value; draw(); });
  $('lbRefresh').addEventListener('click', function(){ load(true); });
  return {draw:draw, load:load};
})();
LB.load(false);

render();
})();
</script>
