var D={"en": {"ti": "Privacy Policy – MySkillGlobal Smart Lady", "up": "Last updated: 01 November 2026", "bk": "← Home", "s": [["1. Who we are", "MySkillGlobal Smart Lady (“the App”) is provided by Surajit Roy (MySkillGlobal), India. This policy explains what the App uses and why. By using the App you agree to it."], ["2. What the App uses", "<ul><li><b>Your location</b> (precise): only after you press SOS, to build one SMS.</li><li><b>Two phone numbers and names</b> that you choose: stored on your phone only.</li><li><b>Your own entries</b> (income, expenses, savings, goals, lists, reminders) and settings (language, currency): stored on your phone only.</li><li><b>Optional lock-screen information</b> (a name, a number and a short health note): only if you switch it on. It stays on your phone, and while it is on anyone can read it on the lock screen.</li><li><b>Backup file</b> (optional): if you save one, your numbers, names and notes are written as plain text to the place you choose. Keep it safe.</li><li><b>WhatsApp button</b>: opens WhatsApp with a ready message. You press Send. The App itself sends nothing.</li><li><b>App lock</b> (optional): uses the phone's own fingerprint or PIN. The App never sees your fingerprint or PIN.</li></ul><p>The App has no account, no ads and no analytics. It does not use your microphone, contacts, call log, photos or files.</p>"], ["3. We do not receive your data", "The App has no server of ours. We do not receive, store or see your location, your numbers or your entries. Nothing is uploaded. Google Play may give us anonymous install and crash statistics."], ["4. How SOS works", "<p>When you press 🆘 the App finds your location using your phone's location service and writes one short message, for example: “SOS! I need help. My location: (map link)”. It sends this to the 2 numbers you saved, using your phone's own SMS:</p><ul><li>in the direct version the App sends the SMS by itself;</li><li>in the Play Store version your SMS app opens with the numbers and message ready, and you press Send.</li></ul><p>The SMS travels through mobile operators. Your operator may charge you. The message can fail if there is no signal. The people who receive it will see your phone number, and when they open the map link Google Maps handles the request under Google's own policy.</p>"], ["5. Permissions", "<ul><li><b>Location:</b> to put your position in the SOS message.</li><li><b>Notifications and a foreground service:</b> to keep the 🆘 button in your notification bar and on the lock screen. Nothing is tracked until you press it.</li><li><b>Send SMS</b> (direct version only): to send the message by itself.</li></ul>"], ["6. Your people", "Please tell the 2 people you add that they may receive an emergency SMS from you."], ["7. Keeping and deleting data", "Everything stays on your phone. You can remove your numbers inside the App at any time. Clearing the App's data or uninstalling it deletes everything, and we cannot recover it. An SMS that has already been sent cannot be taken back."], ["8. Security", "Your data stays on your device, so protect your phone with a screen lock. Anyone who can use your unlocked phone can see what you entered."], ["9. Children", "The App is intended for users aged 18+. We do not knowingly collect data from younger children."], ["10. Contact", "Questions about this policy: <a href=\"mailto:myskillglobal@gmail.com\">myskillglobal@gmail.com</a>. Website: <a href=\"https://myskillglobal.com/smartlady\">myskillglobal.com/smartlady</a>."], ["11. Changes", "We may update this policy. The date above shows the latest version, and important changes will be shown in the App."]]}, "bn": {"ti": "গোপনীয়তা নীতি – MySkillGlobal Smart Lady", "up": "সর্বশেষ হালনাগাদ: ০১ নভেম্বর ২০২৬", "bk": "← হোম", "s": [["১. আমরা কারা", "MySkillGlobal Smart Lady (“অ্যাপ”) প্রদান করছে সুরজিৎ রায় (মাই স্কিল গ্লোবাল), ভারত। অ্যাপ কী ব্যবহার করে এবং কেন, তা এই নীতিতে বলা হয়েছে। অ্যাপ ব্যবহার করলে আপনি এতে সম্মতি দিচ্ছ
