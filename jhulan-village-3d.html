<title>Jhulan Village 3D – Build Your Own Miniature Village</title>
<meta name="description" content="A free 3D village builder for kids. Place trees, huts, ponds, hills and villagers, recolour everything, and switch between day, sunset and night.">
<style>
:root{--bg:#101b27;--panel:#182838;--panel2:#203548;--ink:#edf5f7;--muted:#a9bdc8;--accent:#f5b942;--line:#355064;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,"Noto Sans Bengali",sans-serif;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 14px;background:#132231;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:17px}.actions{display:flex;gap:6px;flex-wrap:wrap}
button{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:8px 11px;border-radius:9px;cursor:pointer;font:inherit;font-weight:600}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#17222a;border-color:var(--accent)}
main{flex:1;min-height:0;display:grid;grid-template-columns:190px 1fr}
aside{background:var(--panel);padding:12px;overflow:auto;border-right:1px solid var(--line)}
h3{font-size:13px;color:#c6d7df;margin:4px 0 10px}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{padding:8px 4px;text-align:center;min-height:66px}.item .emoji{display:block;font-size:26px;margin-bottom:3px}.item.active{outline:2px solid var(--accent);background:#35485a}
.hint{font-size:12px;line-height:1.55;color:var(--muted);margin-top:10px}.control{display:flex;gap:6px;margin-bottom:8px}.control button{flex:1}
#viewport{position:relative;min-width:0;min-height:0}#stage{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.status{position:absolute;left:10px;top:10px;background:#132231d9;padding:7px 10px;border-radius:9px;font-size:12px;pointer-events:none}
.camera{position:absolute;right:10px;top:10px;display:flex;gap:6px}.camera button{background:#132231d9;font-size:18px;padding:6px 12px}
#tb{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#132231ee;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:7px;align-items:center;max-width:calc(100% - 16px)}
#tb[hidden]{display:none}#tb .row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;align-items:center}#tb button{padding:6px 10px}
.sw{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid #ffffff55}.sw:hover{border-color:#fff;transform:scale(1.12)}
#cc{width:34px;height:30px;padding:0;border:none;background:none;cursor:pointer}
@media(max-width:850px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}aside{order:2;border-right:0;border-top:1px solid var(--line);max-height:30vh}#viewport{order:1}.palette{grid-template-columns:repeat(4,1fr)}.hide-m{display:none}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
body{font-family:"Poppins",system-ui,sans-serif}
header{background:linear-gradient(120deg,#0f2a3d,#1c4a46);border-bottom:1px solid #ffffff1f;box-shadow:0 4px 20px #0006;z-index:3}
.brand{font-size:19px;letter-spacing:.3px}
aside{background:linear-gradient(#142636,#0f1e2b)}
button{border-radius:12px;transition:.15s}
button.primary{background:linear-gradient(135deg,#ffc15e,#f59e2b)}
.item{background:#ffffff0d;border-color:#ffffff1f}.item:hover{transform:translateY(-2px);background:#ffffff1a}
.item.active{background:linear-gradient(135deg,#f5b94238,#f5b94212);outline:2px solid #ffb347;box-shadow:0 0 18px #f5b94255}
.status,.camera,#tb{z-index:2}
.status,.camera button,#tb{backdrop-filter:blur(10px);background:#0f1e2bb3;border:1px solid #ffffff22}
.camera button{border-radius:12px}.sw{box-shadow:0 2px 6px #0006}
#viewport::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.3))}
</style>

 for(let i=0;i<tf.length;i++){const t=tf[i];let h=0;for(const q of fs){const dx=t.x-q.o.position.x,dz=t.z-q.o.position.z,lx=(dx*q.c-dz*q.s)/q.k,lz=(dx*q.s+dz*q.c)/q.k;if(q.f[2]?(lx*lx)/(q.f[0]*q.f[0])+(lz*lz)/(q.f[1]*q.f[1])<1:Math.abs(lx)<q.f[0]&&Math.abs(lz)<q.f[1]){h=1;break}}grassIm.setMatrixAt(i,h?zm:t.m)}grassIm.instanceMatrix.needsUpdate=true}
function status(){$('#status').textContent=(mode=='place'?'Place':'Select')+' mode · '+objs.length+' objects · drag to orbit';}
function pick(g){if(sel?.userData.ol)scene.remove(sel.userData.ol);sel=g;if(g){const h=new THREE.Box3Helper(new THREE.Box3().setFromObject(g),0xffd15c);scene.add(h);g.userData.ol=h;$('#nm').textContent=g.userData.label}$('#tb').hidden=!g}
function snapshot(){gDirty=1;hist.push(ser());if(hist.length>60)hist.shift();fut=[];try{localStorage.setItem('jhulan3d',ser())}catch(e){}}
function add(id,p,rec=true){const g=make(id,Math.floor(Math.random()*1e6));g.position.set(snap(p.x),0,snap(p.z));if(id!='house'&&id!='road')g.rotation.y=Math.random()*6.28;scene.add(g);objs.push(g);gDirty=1;pick(g);if(rec)snapshot();status()}
function restore(d){gDirty=1;objs.forEach(o=>scene.remove(o));objs=[];pick(null);JSON.parse(d).forEach(o=>{const g=make(o.type,o.seed||1);g.userData.col=o.col||null;paint(g);g.position.set(o.x,0,o.z);g.rotation.y=o.rot;g.scale.setScalar(o.scale);scene.add(g);objs.push(g)});status()}
function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resize).observe(viewport);resize();
function cam(){const s=Math.sin(phi);camera.position.set(target.x+radius*s*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*s*Math.cos(theta));camera.lookAt(target)}cam();
function setRay(e){const r=canvas.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(pt,camera)}
const gp=e=>{setRay(e);return ray.ray.intersectPlane(plane,hit)?hit.clone():null};
function objAt(e){setRay(e);const m=[];objs.forEach(o=>o.traverse(c=>{if(c.isMesh)m.push(c)}));const h=ray.intersectObjects(m,false);if(!h.length)return null;let o=h[0].object;while(o.parent&&o.parent!==scene)o=o.parent;return o}
const ptrs=new Map();let down=null,moved=false,pinch=0,dragObj=false,orbit=false;
const pd=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1};
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{try{canvas.setPointerCapture(e.pointerId)}catch(x){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size==2){pinch=pd();moved=true;dragObj=false;return}
 down={x:e.clientX,y:e.clientY};moved=false;orbit=e.button==2||e.shiftKey;dragObj=false;if(mode=='select'&&e.button==0&&!orbit&&sel&&objAt(e)===sel)dragObj=true});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(ptrs.size==2){const d=pd();radius=clamp(radius*pinch/d,12,65);pinch=d;cam();return}
 if(!moved&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<6)return;moved=true;
 if(dragObj&&sel){const q=gp(e);if(q){sel.position.x=clamp(snap(q.x),-11.5,11.5);sel.position.z=clamp(snap(q.z),-11.5,11.5);gDirty=1}return}
 theta-=dx*.008;tTheta=theta;phi=clamp(phi-dy*.006,.18,1.48);cam()});
function end(e,cancel){const was=ptrs.size;ptrs.delete(e.pointerId);if(was!=1)return;if(cancel){dragObj=false;return}
 if(!moved&&e.button==0){const ob=objAt(e);if(ob)pick(ob);else if(mode=='place'){const q=gp(e);if(q&&Math.abs(q.x)<=11.5&&Math.abs(q.z)<=11.5)add(type,q)}else pick(null)}else if(dragObj&&moved)snapshot();dragObj=false}
canvas.addEventListener('pointerup',e=>end(e,false));canvas.addEventListener('pointercancel',e=>end(e,true));
canvas.addEventListener('wheel',e=>{e.preventDefault();radius=clamp(radius+e.deltaY*.035,12,65);cam()},{passive:false});
function loop(){requestAnimationFrame(loop);if(gDirty)grass();if(Math.abs(tTheta-theta)>.001){theta+=(tTheta-theta)*.2;cam()}clouds.forEach(c=>{c.position.x+=.006;if(c.position.x>55)c.position.x=-55});if(sel?.userData.ol)sel.userData.ol.box.setFromObject(sel);renderer.render(scene,camera)}loop();
P.forEach(t=>{const b=document.createElement('button');b.className='item'+(t.id==type?' active':'');b.innerHTML='<span class="emoji">'+t.emoji+'</span>'+t.name;b.onclick=()=>{type=t.id;document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));b.classList.add('active');setMode('place')};$('#palette').appendChild(b)});
function setMode(m){mode=m;$('#place').classList.toggle('primary',m=='place');$('#select').classList.toggle('primary',m=='select');status()}
$('#place').onclick=()=>setMode('place');$('#select').onclick=()=>setMode('select');
function setCol(c,rec){if(!sel)return;sel.userData.col=c;paint(sel);if(rec)snapshot()}
COLS.forEach(c=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.onclick=()=>setCol(c,1);$('#sws').appendChild(b)});
{const i=document.createElement('input');i.type='color';i.id='cc';i.value='#5aa34b';i.oninput=()=>setCol(i.value,0);i.onchange=()=>snapshot();$('#sws').appendChild(i);const r=document.createElement('button');r.textContent='↺ Original colour';r.onclick=()=>setCol(null,1);$('#sws').appendChild(r)}
$('#cl').onclick=()=>tTheta+=Math.PI/4;$('#cr').onclick=()=>tTheta-=Math.PI/4;$('#cu').onclick=()=>{phi=phi>.5?.3:.95;cam()};$('#home').onclick=()=>{tTheta=Math.PI/4;phi=.82;radius=40;cam()};
const sc=k=>{if(sel){sel.scale.setScalar(clamp(sel.scale.x*k,.4,2.8));snapshot()}};$('#sm').onclick=()=>sc(1/1.2);$('#sp').onclick=()=>sc(1.2);
$('#rl').onclick=()=>{if(sel){sel.rotation.y-=Math.PI/4;snapshot()}};$('#rr').onclick=()=>{if(sel){sel.rotation.y+=Math.PI/4;snapshot()}};
$('#del').onclick=()=>{if(sel){const s=sel;pick(null);scene.remove(s);objs=objs.filter(o=>o!==s);snapshot();status()}};
$('#dup').onclick=()=>{if(sel){const d=make(sel.userData.type,sel.userData.seed+1);d.userData.col=sel.userData.col;paint(d);d.position.copy(sel.position).add(new THREE.Vector3(1,0,1));d.rotation.copy(sel.rotation);d.scale.copy(sel.scale);scene.add(d);objs.push(d);pick(d);snapshot();status()}};
$('#undo').onclick=()=>{if(hist.length>1){fut.push(hist.pop());restore(hist[hist.length-1])}};
$('#redo').onclick=()=>{if(fut.length){const d=fut.pop();hist.push(d);restore(d)}};
$('#save').onclick=()=>{try{localStorage.setItem('jhulan3d',ser());$('#status').textContent='✅ Saved'}catch(e){$('#status').textContent='Could not save here'}};
$('#load').onclick=()=>{try{const d=localStorage.getItem('jhulan3d');if(d){restore(d);snapshot()}}catch(e){}};
let ct=0;$('#clear').onclick=()=>{if(!ct){$('#status').textContent='Press again to clear everything';ct=setTimeout(()=>{ct=0;status()},3000);return}clearTimeout(ct);ct=0;objs.forEach(o=>scene.remove(o));objs=[];pick(null);snapshot();status()};
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')tTheta+=Math.PI/8;if(e.key=='ArrowRight')tTheta-=Math.PI/8;if(e.key=='Delete')$('#del').click()});
let loaded=0;try{const d=localStorage.getItem('jhulan3d');if(d!==null){restore(d);loaded=1}}catch(e){}
if(!loaded)[['house',-1,-1],['tree',-4.5,-2],['tree',3.5,-3.5],['tree',-3,3.5],['pond',4.5,2.5],['road',-1,2.5],['person',0,1],['flower',-3,1.5],['hill',-6.5,-6.5],['rock',2,-1]].forEach(a=>add(a[0],{x:a[1],z:a[2]},false));
const TM=[{n:'☀️ Day',sky:['#4f9fe0','#a9d8f2','#f6ecd2'],fog:0xd5e9ee,sun:0xfff0d0,si:3,hi:1.25,sp:[-14,24,12],cl:0xffffff},{n:'🌇 Sunset',sky:['#3b4a8c','#e07a5f','#ffd29a'],fog:0xe8b99a,sun:0xff9a55,si:2.4,hi:.8,sp:[-22,8,10],cl:0xffd1b0},{n:'🌙 Night',sky:['#050b1f','#1a2a5a','#3b4b7a'],fog:0x1b2748,sun:0x8fa6ff,si:.7,hi:.45,sp:[-10,20,8],cl:0x55607f}];
let tm=0;function setTime(i){tm=i;const T=TM[i],c=document.createElement('canvas');c.width=2;c.height=256;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,T.sky[0]);g.addColorStop(.55,T.sky[1]);g.addColorStop(1,T.sky[2]);x.fillStyle=g;x.fillRect(0,0,2,256);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;scene.background=t;scene.fog.color.setHex(T.fog);sun.color.setHex(T.sun);sun.intensity=T.si;sun.position.set(T.sp[0],T.sp[1],T.sp[2]);hemi.intensity=T.hi;clouds.forEach(c=>c.children.forEach(s=>s.material.color.setHex(T.cl)));$('#tm').textContent=T.n;try{localStorage.setItem('jhulan3d_time',i)}catch(e){}}
$('#tm').onclick=()=>setTime((tm+1)%3);
try{setTime(+localStorage.getItem('jhulan3d_time')||0)}catch(e){setTime(0)}
pick(null);snapshot();status();
