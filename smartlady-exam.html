<style>
  :root{
    --p1:#ff5fa8; --p2:#e91e8c; --p3:#b0155f; --p4:#7a0f47;
    --soft:#fff0f7; --soft2:#ffdcec; --line:#f6c3dc;
    --ink:#3b0a27; --muted:#8c5873;
    --gold:#c9a84c; --gold2:#e8c97a;
    --ok:#1f9d55; --okbg:#dcf7e6; --bad:#d92d2d; --badbg:#ffe3e3;
    --shadow:0 12px 30px rgba(176,21,95,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; color:var(--ink);
    font-family:'Poppins','Hind Siliguri','Noto Sans Bengali','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,95,168,.16), transparent 42%),
      radial-gradient(circle at 92% 30%, rgba(201,168,76,.12), transparent 40%),
      linear-gradient(180deg,#fff3f9,#ffe7f3 60%,#ffdcec);
    min-height:100vh; padding-bottom:28px;
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
  }
  input{-webkit-user-select:text; user-select:text;}
  .wrap{max-width:720px; margin:0 auto; padding:0 16px;}

  /* ===== Header ===== */
  header{
    position:relative; overflow:hidden; text-align:center; color:#fff;
    padding:14px 16px 34px;
    background:linear-gradient(135deg,var(--p4),var(--p3) 48%,var(--p2));
    border-radius:0 0 34px 34px;
    box-shadow:0 12px 34px rgba(122,15,71,.35);
  }
  .hdr-deco{position:absolute; border-radius:50%; background:rgba(255,255,255,.08); pointer-events:none;}
  .hdr-deco.d1{width:220px; height:220px; left:-70px; top:-80px;}
  .hdr-deco.d2{width:260px; height:260px; right:-90px; bottom:-120px; background:rgba(232,201,122,.14);}
  .cert-nav{position:relative; z-index:2; display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .cert-nav a{
    display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:22px; text-decoration:none;
    font-size:.74rem; font-weight:800; color:#fff; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28);
  }
  .backlink{position:relative; z-index:2; display:inline-block; margin-bottom:8px; font-size:.8rem; color:var(--gold2); text-decoration:none; font-weight:700;}
  .logo{
    position:relative; z-index:2; width:104px; height:104px; border-radius:26px; display:block; margin:4px auto 10px;
    background:#fff; border:3px solid rgba(255,255,255,.9);
    box-shadow:0 10px 26px rgba(0,0,0,.28), 0 0 0 6px rgba(255,255,255,.14);
  }
  header h1{position:relative; z-index:2; margin:0; font-size:1.9rem; letter-spacing:.3px; font-weight:900; text-shadow:0 2px 10px rgba(0,0,0,.25);}
  .hero-sub{position:relative; z-index:2; margin-top:4px; font-size:1rem; font-weight:700; color:var(--gold2); letter-spacing:.4px;}
  .chips{position:relative; z-index:2; display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .chip{padding:7px 14px; border-radius:20px; font-size:.76rem; font-weight:800; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.32);}
  .chip.gold{background:linear-gradient(90deg,var(--gold),var(--gold2)); color:#3a2a00; border-color:transparent;}

  /* ===== Layout / cards ===== */
  .section{padding:20px 0 0;}
  .card{
    background:#fff; border-radius:22px; padding:20px; margin-bottom:16px;
    border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .card h3{margin:0 0 12px; font-size:1.02rem; color:var(--p3);}
  .lang-row{display:flex; gap:8px; flex-wrap:wrap;}
  .lang-btn{
    flex:1 1 90px; padding:11px 10px; border-radius:14px; border:1.5px solid var(--line); background:var(--soft);
    font-size:.95rem; font-weight:800; color:var(--p3); cursor:pointer; font-family:inherit;
  }
  .lang-btn.active{background:linear-gradient(135deg,var(--p2),var(--p3)); color:#fff; border-color:transparent; box-shadow:0 6px 16px rgba(233,30,140,.35);}

  .rules{list-style:none; margin:0; padding:0; display:grid; gap:9px;}
  .rules li{display:flex; gap:10px; align-items:flex-start; font-size:.9rem; line-height:1.45; color:var(--ink);}
  .rules li::before{content:'✿'; color:var(--p2); font-size:1.05rem; line-height:1.3; flex:none;}

  .parts-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
  .pt{
    aspect-ratio:1/1; border-radius:14px; display:flex; align-items:center; justify-content:center; flex-direction:column;
    font-weight:900; font-size:1rem; background:var(--soft); color:#c58aa9; border:1.5px dashed var(--line);
  }
  .pt small{font-size:.6rem; font-weight:700; opacity:.9;}
  .pt.done{background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; border:none; box-shadow:0 5px 12px rgba(233,30,140,.3);}
  .pt.now{background:#fff; color:var(--p3); border:2.5px solid var(--p2); box-shadow:0 0 0 4px rgba(233,30,140,.15);}

  .btn{
    display:block; width:100%; max-width:360px; margin:16px auto 0; padding:14px 22px; border:none; border-radius:26px;
    font-size:1rem; font-weight:900; cursor:pointer; font-family:inherit; text-align:center; text-decoration:none;
    color:#fff; background:linear-gradient(90deg,var(--p2),var(--p3)); box-shadow:0 10px 22px rgba(176,21,95,.35);
    transition:transform .12s;
  }
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.45; box-shadow:none; cursor:default;}
  .btn.gold{background:linear-gradient(90deg,var(--gold),var(--gold2)); color:#3a2a00; box-shadow:0 10px 22px rgba(201,168,76,.4);}
  .btn.ghost{background:#fff; color:var(--p3); border:1.8px solid var(--p2); box-shadow:none;}
  .linkbtn{display:block; margin:12px auto 0; background:none; border:none; color:var(--muted); font-size:.8rem; text-decoration:underline; cursor:pointer; font-family:inherit;}
  .saved-note{margin-top:14px; text-align:center; font-size:.82rem; font-weight:700; color:var(--p3); background:var(--soft); border-radius:12px; padding:9px 12px;}

  /* ===== Quiz ===== */
  .quiz-top{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .part-pill{font-size:.76rem; font-weight:800; color:#fff; background:linear-gradient(90deg,var(--p2),var(--p3)); padding:6px 12px; border-radius:16px; max-width:100%;}
  .mini-lang{display:flex; gap:5px;}
  .mini-lang button{border:1.5px solid var(--line); background:var(--soft); color:var(--p3); font-size:.72rem; font-weight:800; padding:5px 9px; border-radius:12px; cursor:pointer; font-family:inherit;}
  .mini-lang button.active{background:var(--p3); color:#fff; border-color:var(--p3);}
  .progress-outer{background:var(--soft2); border-radius:10px; height:10px; overflow:hidden; margin-bottom:10px;}
  .progress-inner{height:100%; width:0; border-radius:10px; background:linear-gradient(90deg,var(--p1),var(--p2),var(--gold)); transition:width .35s;}
  .quiz-meta{display:flex; justify-content:space-between; font-size:.78rem; font-weight:700; color:var(--muted); margin-bottom:8px;}
  .q-hint{font-size:.78rem; color:var(--muted); margin-bottom:6px;}
  .q-text{font-size:1.14rem; font-weight:800; line-height:1.5; color:var(--ink); margin:4px 0 16px;}
  .opts{display:grid; gap:10px;}
  .opt{
    display:flex; align-items:center; gap:12px; text-align:left; width:100%; padding:12px 13px; border-radius:15px;
    border:1.8px solid var(--line); background:#fff; color:var(--ink); font-size:.95rem; font-weight:700; line-height:1.4;
    cursor:pointer; font-family:inherit; transition:transform .1s, background .15s, border-color .15s;
  }
  .opt:active{transform:scale(.985);}
  .opt .lt{
    flex:none; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:.82rem; font-weight:900; color:var(--p3); background:var(--soft2);
  }
  .opt.correct{background:var(--okbg); border-color:var(--ok);}
  .opt.correct .lt{background:var(--ok); color:#fff;}
  .opt.wrong{background:var(--badbg); border-color:var(--bad);}
  .opt.wrong .lt{background:var(--bad); color:#fff;}
  .opt.disabled{pointer-events:none;}
  .opt.dim{opacity:.62;}
  .feedback{margin-top:12px; text-align:center; font-weight:900; font-size:.95rem; min-height:1.3em;}
  .feedback.ok{color:var(--ok);} .feedback.bad{color:var(--bad);}

  /* ===== Results ===== */
  .center{text-align:center;}
  .big-emoji{font-size:3.4rem; line-height:1;}
  .score-circle{
    width:158px; height:158px; border-radius:50%; margin:14px auto; color:#fff;
    background:linear-gradient(160deg,var(--p3),var(--p4)); border:5px solid var(--gold);
    display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:var(--shadow);
    animation:pop .5s ease-out;
  }
  .score-circle.soft{background:linear-gradient(160deg,#c78aa9,#9b5a7e); border-color:#f0cfe0;}
  .score-circle .num{font-size:2.6rem; font-weight:900; line-height:1;}
  .score-circle .of{font-size:.82rem; opacity:.92; margin-top:5px; font-weight:700;}
  @keyframes pop{0%{transform:scale(.6); opacity:0;}70%{transform:scale(1.07);}100%{transform:scale(1); opacity:1;}}
  .r-title{font-size:1.28rem; font-weight:900; color:var(--p3); margin-top:6px;}
  .r-sub{font-size:.88rem; color:var(--muted); margin:8px auto 0; max-width:440px; line-height:1.5;}
  .field{
    display:block; width:100%; max-width:340px; margin:12px auto 0; padding:13px 14px; border-radius:14px;
    border:1.8px solid var(--line); background:var(--soft); font-size:.97rem; text-align:center; font-family:inherit; color:var(--ink);
  }
  .field:focus{outline:none; border-color:var(--p2); background:#fff; box-shadow:0 0 0 4px rgba(233,30,140,.12);}
  .field.err{border-color:var(--bad); background:var(--badbg);}
  .next-part{margin-top:14px; padding:12px 14px; border-radius:14px; background:var(--soft); font-size:.88rem; font-weight:700; color:var(--p3);}

  .err-box{color:#7a0f47; font-weight:700; line-height:1.6; font-size:.92rem;}
  footer{text-align:center; font-size:.75rem; color:var(--muted); margin-top:26px; padding:0 16px;}

  /* compact header during the exam so the question stays on screen */
  body.in-exam header{padding:10px 16px 16px; border-radius:0 0 24px 24px;}
  body.in-exam .backlink, body.in-exam .hero-sub, body.in-exam .chips{display:none;}
  body.in-exam .cert-nav{margin-bottom:6px;}
  body.in-exam .logo{width:50px; height:50px; border-radius:14px; margin:2px auto 4px; border-width:2px; box-shadow:0 4px 12px rgba(0,0,0,.25);}
  body.in-exam header h1{font-size:1.15rem;}
  @media(max-width:380px){ .q-text{font-size:1.04rem;} header h1{font-size:1.65rem;} }

  /* ===== Edition (India / International) ===== */
  .ed-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .ed-btn{
    padding:13px 8px; border-radius:16px; border:1.5px solid var(--line); background:var(--soft); color:var(--p3);
    cursor:pointer; font-family:inherit; text-align:center; line-height:1.25;
  }
  .ed-btn .fl{display:block; font-size:1.6rem; margin-bottom:2px;}
  .ed-btn b{display:block; font-size:1rem; font-weight:900;}
  .ed-btn small{display:block; margin-top:4px; font-size:.68rem; font-weight:700; opacity:.85;}
  .ed-btn.active{background:linear-gradient(135deg,var(--p2),var(--p3)); color:#fff; border-color:transparent; box-shadow:0 6px 16px rgba(233,30,140,.35);}

  /* ===== Parts list (headings instead of numbers) ===== */
  .parts-grid.list{display:block;}
  .pt-row{display:flex; align-items:center; gap:10px; padding:9px 11px; margin-bottom:7px; border-radius:13px; background:var(--soft); border:1.5px dashed var(--line); color:#8a4a6c; font-size:.86rem; font-weight:700; line-height:1.3;}
  .pt-row .mk{flex:none; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; color:#c58aa9; font-size:.72rem; font-weight:900;}
  .pt-row .nm{flex:1;}
  .pt-row .sc{flex:none; font-size:.76rem; font-weight:900;}
  .pt-row.done{background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; border:none;}
  .pt-row.done .mk{background:#fff; color:var(--p2);}
  .pt-row.now{background:#fff; color:var(--p3); border:2.5px solid var(--p2);}
  .pt-row.now .mk{background:var(--p2); color:#fff;}

  /* ===== Notices ===== */
  .notice h3{margin-bottom:8px;}
  .notice ol{margin:0 0 10px; padding-left:20px; display:grid; gap:7px; font-size:.84rem; line-height:1.45;}
  .notice .g{margin:0 0 9px; font-size:.83rem; line-height:1.45;}
  .notice .g b{display:block; color:var(--p3); font-size:.84rem;}
  .notice .dh{margin:12px 0 6px; font-weight:900; font-size:.82rem; color:var(--p3); letter-spacing:.3px;}
  .notice .dp{margin:0 0 7px; font-size:.78rem; line-height:1.45; color:var(--muted);}
  .notice.small{margin-top:14px; text-align:left; padding:14px;}
</style>
</head>

/* ================= HELPERS ================= */
function $(id){ return document.getElementById(id); }
function fmt(s, o){ return String(s).replace(/\{(\w+)\}/g, function(_, k){ return (o && o[k] != null) ? o[k] : ''; }); }
function ls(fn){ try{ return fn(); }catch(e){ return null; } }

/* ================= QUESTIONS CHECK ================= */
var SETS = window.SL_SETS || {};
var edKey = ls(function(){ return localStorage.getItem(EDKEY); }) || 'india';
if(!EDS[edKey]) edKey = 'india';
var qpEd = ls(function(){ return new URLSearchParams(window.location.search).get('edition'); });
if(qpEd === 'international') qpEd = 'intl';
if(qpEd && EDS[qpEd]) edKey = qpEd;
var QUESTIONS = [], hasQ = false, TOTAL = 0, PARTS = 0, PASS_PCT = 25;

function useEdition(k){
  edKey = k;
  ls(function(){ localStorage.setItem(EDKEY, k); });
  var q = SETS[k];
  hasQ = Array.isArray(q) && q.length > 0;
  QUESTIONS = hasQ ? q : [];
  TOTAL = QUESTIONS.length;
  PARTS = hasQ ? Math.ceil(TOTAL / PER_PART) : 0;
  PASS_PCT = TOTAL ? Math.max(1, Math.round(PASS_MARKS / TOTAL * 100)) : 25;
  PART_TITLES = EDS[k].titles;
}
useEdition(edKey);

/* ================= STATE ================= */
var S = null, lang = 'en', cur = 'start';

function freshState(){
  return {v:1, total:TOTAL, lang:lang, part:0, idx:0, score:0, partScores:[], answered:null, phase:'quiz', started:false};
}
function loadState(){
  var r = ls(function(){ return JSON.parse(localStorage.getItem(KEYS[edKey])); });
  if(r && r.v === 1 && r.total === TOTAL && r.started) return r;
  return null;
}
function save(){ ls(function(){ localStorage.setItem(KEYS[edKey], JSON.stringify(S)); }); }
function clearSaved(){ ls(function(){ localStorage.removeItem(KEYS[edKey]); }); }

function tr(key, o){
  var v = (T[lang] && T[lang][key] != null) ? T[lang][key] : T.en[key];
  return Array.isArray(v) ? v : fmt(v, o);
}
function partName(p){ return PART_TITLES[p] ? PART_TITLES[p][LI[lang]] : ('Part ' + (p+1)); }
function pick(arr){ return (arr && arr[LI[lang]]) ? arr[LI[lang]] : (arr ? arr[0] : ''); }

function show(id){
  cur = id;
  document.body.classList.toggle('in-exam', id === 'quiz');
  ['start','quiz','part','pass','fail','error'].forEach(function(s){
    $('scr-' + s).style.display = (s === id) ? 'block' : 'none';
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ================= STATIC TEXT / LANGUAGE ================= */
function langButtons(container, cls){
  container.innerHTML = '';
  LANGS.forEach(function(l){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = (cls || '') + (l[0] === lang ? ' active' : '');
    b.textContent = l[1];
    b.addEventListener('click', function(){ setLang(l[0]); });
    container.appendChild(b);
  });
}

function applyStatic(){
  document.documentElement.lang = lang;
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function(el){
    el.textContent = tr(el.getAttribute('data-i18n'));
  });
  $('chipQ').textContent = tr('chipQ', {t:TOTAL, p:PARTS});
  $('chipPass').textContent = '🎯 ' + tr('chipPass', {m:PASS_MARKS});
  $('chipEd').textContent = EDS[edKey].flag + ' ' + tr(edKey === 'india' ? 'edLabelIndia' : 'edLabelIntl');
  $('nameInput').placeholder = tr('namePh');
  $('countryInput').placeholder = tr('countryPh');
  $('stateInput').placeholder = tr('statePh');
  $('cityInput').placeholder = tr('cityPh');
  $('schoolInput').placeholder = tr('schoolPh');
}

function setLang(l){
  lang = l;
  ls(function(){ localStorage.setItem(LANGKEY, l); });
  if(S){ S.lang = l; if(S.started) save(); }
  applyStatic();
  render();
}

/* ================= PARTS GRID ================= */
function doneCount(){
  if(!S || !S.started) return 0;
  if(S.phase === 'finished') return PARTS;
  if(S.phase === 'partDone') return S.part + 1;
  return S.part;
}
function renderParts(el){
  el.className = 'parts-grid list'; el.innerHTML = '';
  var d = doneCount();
  for(var i = 0; i < PARTS; i++){
    var state = i < d ? 'done' : ((S && S.started && i === d && S.phase !== 'finished') ? 'now' : '');
    var r = document.createElement('div');
    r.className = 'pt-row ' + state;
    r.innerHTML = '<span class="mk"></span><span class="nm"></span><span class="sc"></span>';
    r.querySelector('.mk').textContent = i < d ? '\u2713' : (state === 'now' ? '\u25B6' : '\u2022');
    r.querySelector('.nm').textContent = partName(i);
    r.querySelector('.sc').textContent = i < d ? ((S.partScores[i] || 0) + '/' + partLen(i)) : '';
    el.appendChild(r);
  }
}
function partLen(p){ return Math.min(PER_PART, TOTAL - p * PER_PART); }

/* ================= NOTICES ================= */
function gtxt(o){ return (o && (o[lang] || o.en)) || ''; }
function addEl(parent, tag, cls, text){
  var e = document.createElement(tag); if(cls) e.className = cls; e.textContent = text; parent.appendChild(e); return e;
}
function renderNotice(el, full){
  el.innerHTML = '';
  var G = window.SL_GUIDE; if(!G) return;
  if(full){
    addEl(el, 'h3', '', gtxt(G.instructions.title));
    var ol = document.createElement('ol'); el.appendChild(ol);
    G.instructions.items.forEach(function(it){ addEl(ol, 'li', '', gtxt(it)); });
    if(edKey === 'intl'){
      ['emergency', 'legal', 'publicServices'].forEach(function(k){
        var p = document.createElement('p'); p.className = 'g';
        addEl(p, 'b', '', gtxt(G[k].title));
        p.appendChild(document.createTextNode(gtxt(G[k].text)));
        el.appendChild(p);
      });
    }
  }
  addEl(el, 'div', 'dh', gtxt(G.disclaimer.title));
  G.disclaimer.paragraphs.forEach(function(p){ addEl(el, 'p', 'dp', gtxt(p)); });
}

/* ================= EDITION (India / International) ================= */
function renderEditions(){
  var row = $('edRow'); row.innerHTML = '';
  ['india', 'intl'].forEach(function(k){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ed-btn' + (k === edKey ? ' active' : '');
    b.innerHTML = '<span class="fl"></span><b></b><small></small>';
    b.querySelector('.fl').textContent = EDS[k].flag;
    b.querySelector('b').textContent = tr(k === 'india' ? 'edIndia' : 'edIntl');
    b.querySelector('small').textContent = tr(k === 'india' ? 'edIndiaSub' : 'edIntlSub');
    b.addEventListener('click', function(){ chooseEdition(k); });
    row.appendChild(b);
  });
}
function chooseEdition(k){
  if(k === edKey) return;
  useEdition(k);
  S = loadState();
  applyStatic();
  renderStart();
}

/* ================= START SCREEN ================= */
function renderStart(){
  renderEditions();
  renderNotice($('noticeCard'), true);
  langButtons($('langRowStart'), 'lang-btn');
  $('rulesList').innerHTML = '';
  tr('rules').forEach(function(r){
    var li = document.createElement('li');
    li.textContent = fmt(r, {p:PARTS, t:TOTAL, m:PASS_MARKS});
    $('rulesList').appendChild(li);
  });
  renderParts($('partsStart'));
  var started = S && S.started;
  $('startBtn').textContent = started ? tr('resume') : tr('start');
  $('savedNote').style.display = started ? 'block' : 'none';
  $('restartLink').style.display = started ? 'block' : 'none';
  $('restartLink').textContent = tr('restart');
  if(started){
    $('savedNote').textContent = tr('saved', {name:partName(Math.min(S.part, PARTS - 1)), s:S.score});
  }
}

function begin(){
  if(S && S.started){ resumeFlow(); return; }
  S = freshState(); S.started = true; save();
  renderQuiz(); show('quiz');
}
function resumeFlow(){
  if(S.phase === 'partDone'){ renderPartDone(); show('part'); }
  else if(S.phase === 'finished'){ renderResult(); }
  else { renderQuiz(); show('quiz'); }
}
function restartAll(){
  if(!confirm(tr('restartConfirm'))) return;
  clearSaved(); S = null; show('start'); renderStart();
}

/* ================= QUIZ ================= */
function renderQuiz(){
  var gi = S.part * PER_PART + S.idx;
  var q = QUESTIONS[gi];
  var pl = partLen(S.part);
  $('partPill').textContent = EDS[edKey].flag + ' ' + partName(S.part);
  langButtons($('miniLang'));
  $('progressBar').style.width = (gi / TOTAL * 100) + '%';
  $('qCount').textContent = tr('qLabel', {q:S.idx + 1, n:pl});
  $('qScore').textContent = tr('score', {s:S.score});
  $('qText').textContent = pick(q.q);

  var box = $('opts'); box.innerHTML = '';
  var letters = 'ABCDEFGH';
  q.o.forEach(function(o, i){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'opt';
    b.innerHTML = '<span class="lt">' + letters.charAt(i) + '</span><span class="tx"></span>';
    b.querySelector('.tx').textContent = pick(o);
    b.addEventListener('click', function(){ answer(i); });
    box.appendChild(b);
  });

  var last = S.idx >= pl - 1;
  $('nextBtn').textContent = last ? (S.part < PARTS - 1 ? tr('finishPart') : tr('finishExam')) : tr('next');
  $('nextBtn').disabled = true;
  $('feedback').textContent = ''; $('feedback').className = 'feedback';
  if(S.answered !== null) paintAnswer(q);
}

function paintAnswer(q){
  var opts = document.querySelectorAll('#opts .opt');
  Array.prototype.forEach.call(opts, function(el, i){
    el.classList.add('disabled');
    if(i === q.a) el.classList.add('correct');
    else if(i === S.answered) el.classList.add('wrong');
    else el.classList.add('dim');
  });
  var ok = S.answered === q.a;
  $('feedback').textContent = ok ? tr('correct') : tr('wrong');
  $('feedback').className = 'feedback ' + (ok ? 'ok' : 'bad');
  $('nextBtn').disabled = false;
}

function answer(i){
  if(S.answered !== null) return;
  var q = QUESTIONS[S.part * PER_PART + S.idx];
  S.answered = i;
  if(i === q.a){
    S.score++;
    S.partScores[S.part] = (S.partScores[S.part] || 0) + 1;
  } else {
    S.partScores[S.part] = S.partScores[S.part] || 0;
  }
  save();
  $('qScore').textContent = tr('score', {s:S.score});
  paintAnswer(q);
}

function nextQ(){
  if(S.answered === null) return;
  var pl = partLen(S.part);
  S.answered = null;
  if(S.idx < pl - 1){
    S.idx++; save(); renderQuiz(); window.scrollTo({top:0, behavior:'smooth'});
  } else if(S.part < PARTS - 1){
    S.phase = 'partDone'; save(); renderPartDone(); show('part');
  } else {
    S.phase = 'finished'; save();
    $('progressBar').style.width = '100%';
    renderResult();
  }
}

/* ================= PART DONE ================= */
function renderPartDone(){
  var p = S.part, ps = S.partScores[p] || 0, answered = (p + 1) * PER_PART;
  if(answered > TOTAL) answered = TOTAL;
  $('partDoneTitle').textContent = tr('partDone', {name:partName(p)});
  $('partDoneNum').textContent = ps;
  $('partDoneOf').textContent = tr('partOf', {n:partLen(p)});
  $('partDoneTotal').textContent = tr('totalSoFar', {s:S.score, a:answered});
  renderParts($('partsDone'));
  $('nextPartInfo').textContent = tr('nextPart', {name:partName(p + 1)});
  $('nextPartBtn').textContent = tr('startPart');
}
function startNextPart(){
  S.part++; S.idx = 0; S.answered = null; S.phase = 'quiz'; save();
  renderQuiz(); show('quiz');
}

/* ================= RESULT ================= */
function renderResult(){
  var passed = S.score >= PASS_MARKS;
  if(passed){
    $('passNum').textContent = S.score;
    $('passOf').textContent = '/ ' + TOTAL;
    $('passEmoji').textContent = S.score >= TOTAL * 0.9 ? '🏆' : (S.score >= TOTAL * 0.75 ? '🎉' : '🌟');
    $('passSub').textContent = tr('passSub', {s:S.score, t:TOTAL});
    $('certBtn').textContent = tr('getCert'); $('certBtn').disabled = false;
    var prev = ls(function(){ return JSON.parse(localStorage.getItem('msg_advance_test_result')); }) || {};
    if(!$('nameInput').value) $('nameInput').value = prev.name || '';
    if(!$('countryInput').value) $('countryInput').value = prev.country || '';
    if(!$('stateInput').value) $('stateInput').value = prev.state || '';
    if(!$('cityInput').value) $('cityInput').value = prev.city || '';
    if(!$('schoolInput').value) $('schoolInput').value = prev.school || '';
    renderNotice($('noticePass'), false);
    show('pass');
  } else {
    $('failNum').textContent = S.score;
    $('failOf').textContent = '/ ' + TOTAL;
    $('failSub').textContent = tr('failSub', {s:S.score, t:TOTAL, m:PASS_MARKS});
    $('retakeBtn').textContent = tr('retake');
    show('fail');
  }
}
function retake(){
  clearSaved(); S = null; show('start'); renderStart();
}

  if(!id){
    id = 'MSG-STU-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).substring(2, 6).toUpperCase();
    ls(function(){ localStorage.setItem('myskill_student_id', id); });
  }
  ls(function(){ localStorage.setItem('msg_student_id', id); });
  return id;
}

async function goCertificate(){

  if(!S || S.score < PASS_MARKS) return;

  var btn = $('certBtn'); btn.disabled = true; btn.textContent = tr('working');

    certificateId:certificateNo, issueDate:issueDate,

  };

  ls(function(){
    localStorage.setItem('msg_advance_test_result', JSON.stringify({
      name:name, country:country, state:state, city:city, school:school, language:'Smart Lady', langCode:'smart_lady_adv', content:EDS[edKey].course,
      type:'Smart Lady Exam', edition:EDS[edKey].short, examLang:lang, score:score, total:total, pct:percentage, passed:true,
      certId:certificateNo, studentId:studentId, issueDate:issueDate,
      date:new Date(issueDate).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'})
    }));
  });

  ls(function(){
    var HK = 'myskill_cert_history';
    var h = JSON.parse(localStorage.getItem(HK) || '[]');
    h.unshift({
      system:'Smart Lady', name:name, country:country, language:'Smart Lady', content:EDS[edKey].course,
      type:'Advanced Level – ' + EDS[edKey].short, score:score, total:total, percentage:percentage,
      certId:certificateNo, studentId:studentId, savedAt:issueDate, params:certParams
    });
    localStorage.setItem(HK, JSON.stringify(h.slice(0, 100)));
  });

  /* Google Sheets: (1) the general exam sheet, (2) the public leaderboard sheet.
     Never block the certificate for more than 3 s. */
  function post(url, payload){
    return fetch(url, {
      method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    }).catch(function(e){ console.error('Sheet error:', e); });
  }
  try{
    await Promise.race([
      Promise.all([
        post(SHEET_URL, {
          action:'submit', userId:studentId, name:name, country:country, state:state, city:city, school:school,
          exam:'Smart Lady Exam', subExam:EDS[edKey].short,
          score:score, total:total, certificateNo:certificateNo
        }),
        post(LB_URL, {
          action:'submit', userId:studentId, name:name, country:country, state:state, city:city, school:school,
          exam:'Smart Lady Exam', subExam:EDS[edKey].short,
          score:score, total:total, certificateNo:certificateNo
        })
      ]),
      new Promise(function(res){ setTimeout(res, 3000); })
    ]);
  }catch(e){ console.error('Google Sheet error:', e); }

  clearSaved();
  window.location.href = 'certificate-smartlady.html?' + new URLSearchParams(certParams).toString();
}

/* ================= RENDER ROUTER ================= */
function render(){
  if(cur === 'start') renderStart();
  else if(cur === 'quiz') renderQuiz();
  else if(cur === 'part') renderPartDone();
  else if(cur === 'pass' || cur === 'fail') renderResult();
}

/* ================= INIT ================= */
$('favicon').href = document.querySelector('.logo').src;
lang = ls(function(){ return localStorage.getItem(LANGKEY); }) || 'en';
if(!LI.hasOwnProperty(lang)) lang = 'en';

if(!hasQ){
  applyStatic();
  $('errMsg').textContent = tr('errMissing');
  show('error');
} else {
  S = loadState();
  if(S && LI.hasOwnProperty(S.lang)) lang = S.lang;
  applyStatic();
  $('startBtn').addEventListener('click', begin);
  $('restartLink').addEventListener('click', restartAll);
  $('nextBtn').addEventListener('click', nextQ);
  $('nextPartBtn').addEventListener('click', startNextPart);
  $('certBtn').addEventListener('click', goCertificate);
  $('retakeBtn').addEventListener('click', retake);
  $('nameInput').addEventListener('input', function(){ this.classList.remove('err'); });
  $('countryInput').addEventListener('input', function(){ this.classList.remove('err'); });
  renderStart(); show('start');
  window.scrollTo(0, 0);
}

/* ================= BASIC PROTECTION (same as the other exam pages) ================= */
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('keydown', function(e){
  if(e.key === 'F12' ||
    (e.ctrlKey && e.shiftKey && /^[ijc]$/i.test(e.key)) ||
    (e.ctrlKey && /^[us]$/i.test(e.key))){ e.preventDefault(); }
});
document.addEventListener('selectstart', function(e){
  if(e.target && e.target.tagName === 'INPUT') return;
  e.preventDefault();
});
document.addEventListener('dragstart', function(e){ e.preventDefault(); });
})();
</script>
