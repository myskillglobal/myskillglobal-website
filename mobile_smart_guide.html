<style>
/* ═══════ RESET & BASE ═══════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:linear-gradient(135deg,#0f172a,#111827,#312e81);
  min-height:100vh;
  display:flex;justify-content:center;
  padding:12px 12px 30px;
  color:#fff;overflow-x:hidden;position:relative;
}
body::before{content:'';position:fixed;width:320px;height:320px;background:#7c3aed;top:-120px;left:-120px;border-radius:50%;filter:blur(120px);opacity:.35;z-index:-1;}
body::after{content:'';position:fixed;width:280px;height:280px;background:#06b6d4;bottom:-100px;right:-100px;border-radius:50%;filter:blur(120px);opacity:.35;z-index:-1;}
#app{width:100%;max-width:430px;}

/* ═══════ SCREENS ═══════ */
.screen{display:none;}
.screen.active{display:block;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

/* ═══════ HEADER ═══════ */
.header{
  display:flex;align-items:center;gap:14px;margin-bottom:16px;
  padding:16px;border-radius:24px;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  box-shadow:0 8px 30px rgba(0,0,0,0.35),inset 0 1px 1px rgba(255,255,255,0.1);
}
.header-icon{
  width:52px;height:52px;border-radius:18px;flex-shrink:0;
  background:linear-gradient(135deg,#8b5cf6,#6366f1);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:0 5px 18px rgba(99,102,241,.45);
}
h1{font-size:22px;font-weight:700;color:#fff;line-height:1.3;}

/* ═══════ SCORE BAR ═══════ */
.score-bar{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:14px 16px;margin-bottom:18px;border-radius:18px;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(10px);font-size:14px;color:#d1d5db;
}
.score-bar strong{color:#fff;}

/* ═══════ SECTION DIVIDER ═══════ */
.section-label{
  font-size:12px;font-weight:700;letter-spacing:1.5px;
  color:#64748b;text-transform:uppercase;
  padding:0 4px;margin:18px 0 10px;
}

/* ═══════ QUIZ CHAPTER GRID ═══════ */
.chapter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:6px;}
.chapter-btn{
  position:relative;background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);border-radius:22px;
  padding:16px;text-align:left;cursor:pointer;overflow:hidden;
  transition:all .35s ease;backdrop-filter:blur(12px);min-height:148px;
  box-shadow:0 8px 20px rgba(0,0,0,.25),inset 0 1px 1px rgba(255,255,255,.08);
  width:100%;
}
.chapter-btn:active{transform:scale(.97);}
.chapter-btn::before{content:'';position:absolute;width:120%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.12),transparent);top:0;left:-130%;transition:.7s;}
.chapter-btn:hover::before{left:120%;}
.ch-icon{
  width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  border-radius:15px;background:linear-gradient(135deg,#8b5cf6,#6366f1);
  margin-bottom:11px;box-shadow:0 6px 18px rgba(99,102,241,.4);font-size:24px;
}
.ch-title{font-size:14px;font-weight:700;line-height:1.45;color:#fff;}
.ch-sub{font-size:12px;color:#cbd5e1;margin-top:5px;line-height:1.4;}
.chapter-btn.done{background:rgba(16,185,129,.18);border-color:rgba(16,185,129,.35);}
.chapter-btn.done .ch-icon{background:linear-gradient(135deg,#10b981,#059669);}
.chapter-btn.isnew{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.35);}
.new-tag{
  display:inline-block;margin-left:5px;padding:2px 7px;border-radius:999px;
  font-size:10px;font-weight:700;
  background:linear-gradient(135deg,#f43f5e,#ec4899);color:#fff;
  animation:pulse 1.5s infinite;
}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.08);}100%{transform:scale(1);}}

/* ═══════ AWARENESS CARDS (full-width) ═══════ */
.aware-card{
  display:flex;align-items:center;gap:16px;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
  border-radius:20px;padding:18px 16px;margin-bottom:12px;
  cursor:pointer;transition:all .25s;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
  backdrop-filter:blur(12px);
}
.aware-card:active{transform:scale(.98);}
.aware-card.warn-c{border-left:4px solid #ef4444;}
.aware-card.tips-c{border-left:4px solid #10b981;}
.aware-card.reduce-c{border-left:4px solid #3b82f6;}
.aware-card.cost-c{border-left:4px solid #f59e0b;}
.aware-card.reels-c{border-left:4px solid #ec4899;}
.aware-card .ac-ico{font-size:34px;flex-shrink:0;}
.aware-card .ac-txt h3{font-size:16px;font-weight:700;color:#fff;margin-bottom:3px;}
.aware-card .ac-txt p{font-size:13px;color:#94a3b8;line-height:1.4;}
.aware-card .ac-arr{margin-left:auto;font-size:22px;color:#475569;flex-shrink:0;}

/* ═══════ QUIZ CARD ═══════ */
.quiz-card{
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
  border-radius:28px;padding:22px;backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.08);
}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#cbd5e1;margin-bottom:18px;}
.quiz-q{font-size:18px;line-height:1.75;font-weight:700;color:#fff;margin-bottom:18px;}
.opt-btn{
  width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
  border-radius:18px;padding:14px 16px;text-align:left;font-size:15px;line-height:1.6;
  color:#fff;cursor:pointer;margin-bottom:12px;transition:all .28s ease;backdrop-filter:blur(8px);
}
.opt-btn:hover:not(:disabled){transform:translateY(-2px);background:rgba(255,255,255,.14);}
.opt-btn.correct{background:rgba(16,185,129,.22);border-color:#10b981;color:#ecfdf5;}
.opt-btn.wrong{background:rgba(239,68,68,.2);border-color:#ef4444;color:#fff1f2;}
.explanation{
  margin-top:18px;background:rgba(255,255,255,.08);border-left:4px solid #8b5cf6;
  border-radius:18px;padding:14px 16px;font-size:15px;line-height:1.75;color:#e2e8f0;
}
.explanation strong{color:#fff;}
.nav-row{display:flex;gap:10px;margin-top:18px;}
.btn{flex:1;border:none;border-radius:16px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;transition:.3s;}
.btn.primary{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;box-shadow:0 8px 20px rgba(99,102,241,.4);}
.btn.primary:hover{filter:brightness(1.08);}
.btn:not(.primary){background:rgba(255,255,255,0.12);color:#fff;}
.progress{height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.progress-fill{
  height:100%;background:linear-gradient(90deg,#06b6d4,#8b5cf6,#ec4899);
  border-radius:999px;transition:width .4s ease;
  animation:glow 2s infinite alternate;
}
@keyframes glow{from{filter:brightness(1);}to{filter:brightness(1.25);}}

/* ═══════ RESULT ═══════ */
.result-box{
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
  border-radius:28px;padding:22px;backdrop-filter:blur(12px);text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.result-box h2{font-size:28px;margin:12px 0;color:#fff;}
.result-box p{font-size:15px;line-height:1.7;color:#d1d5db;margin-bottom:20px;}
.badge{display:inline-block;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:700;}
.badge.gold{background:linear-gradient(135deg,#fde047,#f59e0b);color:#111827;}
.badge.silver{background:linear-gradient(135deg,#e2e8f0,#94a3b8);color:#111827;}
.badge.bronze{background:linear-gradient(135deg,#fdba74,#ea580c);color:#111827;}

/* ═══════ AWARENESS INNER PAGES ═══════ */
.aware-page-header{
  background:rgba(17,24,39,0.95);border-bottom:1px solid rgba(255,255,255,0.1);
  padding:14px 16px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:100;backdrop-filter:blur(16px);
  margin:-12px -12px 18px;
}
.back-btn-sm{
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);
  color:#fff;font-size:20px;width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.back-btn-sm:active{background:rgba(255,255,255,0.2);}
.aware-page-header h2{font-size:17px;font-weight:700;color:#fff;}

/* sign items */
.sign-item{
  display:flex;gap:14px;align-items:flex-start;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;padding:15px 14px;margin-bottom:13px;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
}
.sign-item .sico{font-size:28px;flex-shrink:0;margin-top:2px;}
.sign-item h4{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;}
.sign-item p{font-size:15px;color:#94a3b8;line-height:1.65;}
.intro-card{
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;padding:16px;margin-bottom:16px;
}
.intro-card p{font-size:15px;color:#94a3b8;line-height:1.75;}
.quote-box{
  background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(6,182,212,.1));
  border:1px solid rgba(16,185,129,.3);
  border-radius:18px;padding:18px 16px;text-align:center;margin:8px 0 16px;
}
.quote-box.reels-quote{
  background:linear-gradient(135deg,rgba(236,72,153,.15),rgba(99,102,241,.1));
  border:1px solid rgba(236,72,153,.3);
}
.quote-box.reels-quote p{color:#f9a8d4;}
.quote-box .qico{font-size:28px;margin-bottom:8px;}
.quote-box p{font-size:15px;color:#6ee7b7;font-style:italic;line-height:1.7;font-weight:600;}
.page-tag{text-align:center;font-size:12px;color:#475569;padding:6px 0;}

/* next button inside awareness pages */
.aware-next-btn{
  width:100%;border:none;border-radius:18px;padding:16px;
  background:linear-gradient(135deg,#8b5cf6,#6366f1);
  color:#fff;font-size:16px;font-weight:700;cursor:pointer;
  margin-top:6px;margin-bottom:18px;
  box-shadow:0 8px 24px rgba(99,102,241,.4);
  transition:.25s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.aware-next-btn:active{filter:brightness(1.1);}
.aware-next-btn.last-btn{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 8px 24px rgba(16,185,129,.4);}
.aware-next-btn.reels-quiz-btn{background:linear-gradient(135deg,#ec4899,#8b5cf6);box-shadow:0 8px 24px rgba(236,72,153,.4);}

/* ═══════ COST PAGE ═══════ */
.fact-box{background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.25);border-radius:18px;padding:16px;margin-bottom:14px;}
.fact-box .ft{font-size:14px;font-weight:700;color:#7dd3fc;margin-bottom:6px;}
.fact-box p{font-size:14px;color:#bae6fd;line-height:1.65;}
.cost-intro-card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:16px;margin-bottom:16px;}
.cost-intro-card p{font-size:15px;color:#94a3b8;line-height:1.75;}
.cost-card2{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:16px;margin-bottom:12px;}
.cost-card2 h4{font-size:14px;font-weight:700;color:#f59e0b;margin-bottom:10px;}
.calc-row2{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.07);font-size:14px;}
.calc-row2:last-child{border-bottom:none;}
.calc-row2 .cl{color:#94a3b8;}
.calc-row2 .cv{font-weight:700;color:#fff;}
.cost-table2{width:100%;border-collapse:collapse;font-size:14px;}
.cost-table2 th{background:rgba(245,158,11,.2);color:#fbbf24;padding:10px 12px;text-align:left;}
.cost-table2 th:last-child{text-align:right;}
.cost-table2 td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.07);color:#94a3b8;}
.cost-table2 td:last-child{text-align:right;font-weight:700;color:#fff;}
.cost-table2 tr.hl td{background:rgba(16,185,129,.15);color:#6ee7b7;font-weight:700;font-size:15px;}
.total-box2{
  background:linear-gradient(135deg,rgba(245,158,11,.2),rgba(217,119,6,.15));
  border:2px solid rgba(245,158,11,.5);border-radius:20px;
  padding:20px;text-align:center;margin-bottom:14px;
}
.total-box2 .tl{font-size:13px;color:#fcd34d;margin-bottom:6px;}
.total-box2 .ta{font-size:34px;font-weight:700;color:#fbbf24;letter-spacing:-1px;}
.total-box2 .ts{font-size:12px;color:#92400e;margin-top:4px;}
.warn-box2{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);border-radius:18px;padding:16px;margin-bottom:14px;}
.warn-box2 .wt{font-size:14px;font-weight:700;color:#fca5a5;margin-bottom:6px;}
.warn-box2 p{font-size:14px;color:#fecaca;line-height:1.65;}

/* ═══════ EDITABLE CALCULATOR ═══════ */
.calc-edit-card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:18px 16px;margin-bottom:16px;}
.calc-edit-card h3{font-size:15px;font-weight:700;color:#fff;margin-bottom:14px;}
.inp-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.07);gap:10px;}
.inp-row:last-child{border-bottom:none;}
.inp-row label{font-size:14px;color:#94a3b8;flex:1;line-height:1.4;}
.inp-row .inp-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.inp-wrap .cur{font-size:13px;color:#64748b;}
.calc-inp{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:10px;color:#fff;font-size:15px;font-weight:700;padding:7px 9px;width:88px;text-align:right;outline:none;}
.calc-inp:focus{border-color:#8b5cf6;background:rgba(139,92,246,.15);}
.do-calc-btn{width:100%;border:none;border-radius:16px;padding:14px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#111827;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:18px;box-shadow:0 6px 20px rgba(245,158,11,.35);transition:.25s;}
.do-calc-btn:active{filter:brightness(1.1);}
.calc-results{display:none;}
.calc-results.show{display:block;animation:fadeUp .35s ease;}

/* ═══════ REELS AWARENESS PAGE ═══════ */
.reels-banner{
  background:linear-gradient(135deg,rgba(236,72,153,.2),rgba(99,102,241,.15));
  border:1px solid rgba(236,72,153,.35);
  border-radius:20px;padding:18px 16px;margin-bottom:16px;text-align:center;
}
.reels-banner .rb-ico{font-size:44px;margin-bottom:8px;}
.reels-banner h3{font-size:18px;font-weight:700;color:#f9a8d4;margin-bottom:6px;}
.reels-banner p{font-size:13px;color:#fce7f3;line-height:1.6;}
.reels-tip{
  display:flex;gap:14px;align-items:flex-start;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;padding:15px 14px;margin-bottom:13px;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
  border-left:3px solid rgba(236,72,153,.5);
}
.reels-tip .rtco{font-size:26px;flex-shrink:0;margin-top:2px;}
.reels-tip h4{font-size:15px;font-weight:700;color:#fff;margin-bottom:4px;}
.reels-tip p{font-size:14px;color:#94a3b8;line-height:1.6;}
.reels-stat{
  background:rgba(236,72,153,.12);border:1px solid rgba(236,72,153,.25);
  border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;
}
.reels-stat .rs-num{font-size:26px;font-weight:700;color:#f9a8d4;min-width:60px;text-align:center;}
.reels-stat .rs-txt{font-size:13px;color:#fce7f3;line-height:1.5;}

/* ═══════ SOUND TOGGLE ═══════ */
.sound-toggle{
  position:fixed;bottom:20px;right:16px;
  width:46px;height:46px;border:none;border-radius:50%;
  background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;z-index:999;
  box-shadow:0 4px 16px rgba(0,0,0,.3);transition:.3s;backdrop-filter:blur(10px);
}

@media(max-width:480px){
  body{padding:10px 10px 30px;}
  .chapter-grid{grid-template-columns:1fr;}
  h1{font-size:20px;}
  .quiz-q{font-size:17px;}
  .opt-btn{font-size:14px;padding:13px;}
  .quiz-card,.result-box{padding:18px;}
  .chapter-btn{min-height:auto;}
}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-icon">&#128241;</div>
    <h1>Mobile Smart Guide</h1>
  </div>
  <div id="main"></div>
</div>
<button class="sound-toggle" id="soundToggle" title="Toggle Sound">&#128266;</button>

<script>
/* ═══════════════════════════════
   SOUND ENGINE
═══════════════════════════════ */
var soundOn=true;
var AudioCtx=window.AudioContext||window.webkitAudioContext;
var ctx=null;
function getCtx(){if(!ctx)ctx=new AudioCtx();if(ctx.state==='suspended')ctx.resume();return ctx;}
function playCorrect(){if(!soundOn)return;try{var c=getCtx(),notes=[523,659,784,1047];notes.forEach(function(f,i){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=f;var t=c.currentTime+i*.1;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}catch(e){}}
function playWrong(){if(!soundOn)return;try{var c=getCtx(),notes=[330,277];notes.forEach(function(f,i){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sawtooth';o.frequency.value=f;var t=c.currentTime+i*.18;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}catch(e){}}
function playClick(){if(!soundOn)return;try{var c=getCtx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=880;var t=c.currentTime;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.start(t);o.stop(t+.1);}catch(e){}}
function playBack(){if(!soundOn)return;try{var c=getCtx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=440;var t=c.currentTime;o.frequency.setValueAtTime(440,t);o.frequency.exponentialRampToValueAtTime(280,t+.1);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.start(t);o.stop(t+.15);}catch(e){}}
function playFinish(){if(!soundOn)return;try{var c=getCtx(),mel=[523,659,784,659,1047,880,784];mel.forEach(function(f,i){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=f;var t=c.currentTime+i*.13;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.start(t);o.stop(t+.28);});}catch(e){}}

/* ═══════════════════════════════
   QUIZ DATA  (9 chapters now)
═══════════════════════════════ */
var chapters=[
  {id:0,icon:"&#128722;",title:"Buying New",sub:"What to check",isNew:false,qs:[

/* ═══════════════════════════════
   RENDER ROUTER
═══════════════════════════════ */
function render(){
  var el=document.getElementById('main');
  if(state.screen==='home')el.innerHTML=homeHTML();
  else if(state.screen==='quiz')el.innerHTML=quizHTML();
  else if(state.screen==='result')el.innerHTML=resultHTML();
  else if(state.screen==='aware')el.innerHTML=awareHTML();
  window.scrollTo(0,0);
  attachEvents();
}

/* ═══════════════════════════════
   HOME
═══════════════════════════════ */
function homeHTML(){
  var done=state.chapterDone.filter(Boolean).length;
  var awareDoneCount=Object.values(state.awareDone).filter(Boolean).length;
  var html='<div class="score-bar"><span>Quiz: <strong>'+done+'/9</strong> done</span><span>Score: <strong>'+state.score+'/'+state.total+'</strong></span></div>';

  html+='<div class="section-label">&#128683; Addiction Awareness ('+awareDoneCount+'/5)</div>';
  for(var j=0;j<awarePages.length;j++){
    var ap=awarePages[j];
    var isDone=state.awareDone[ap.id];
    var extraStyle=isDone?'opacity:.75;':'';
    var doneTag=isDone?' <span style="font-size:12px;color:#10b981;">&#10003; Read</span>':'';
    html+='<div class="aware-card '+ap.cardClass+'" data-aware="'+ap.id+'" style="'+extraStyle+'">';
    html+='<div class="ac-ico">'+ap.cardIcon+'</div>';
    html+='<div class="ac-txt"><h3>'+ap.cardTitle+doneTag+'</h3><p>'+ap.cardDesc+'</p></div>';
    html+='<div class="ac-arr">&#8250;</div>';
    html+='</div>';
  }

  html+='<div class="section-label" style="margin-top:22px;">&#127358; Mobile Quiz Chapters</div>';
  html+='<div class="chapter-grid">';
  for(var i=0;i<chapters.length;i++){
    var c=chapters[i];
    var cls='chapter-btn';
    if(state.chapterDone[c.id])cls+=' done';
    else if(c.isNew)cls+=' isnew';
    var sub=state.chapterDone[c.id]?'&#10003; Completed':c.sub;
    var newTag=(c.isNew&&!state.chapterDone[c.id])?'<span class="new-tag">NEW</span>':'';
    html+='<button class="'+cls+'" data-ch="'+c.id+'">';
    html+='<div class="ch-icon">'+c.icon+'</div>';
    html+='<div class="ch-title">'+c.title+newTag+'</div>';
    html+='<div class="ch-sub">'+sub+'</div>';
    html+='</button>';
  }
  html+='</div>';
  if(state.chapterDone.every(Boolean)){
    html+='<div style="margin-top:14px;"><button class="btn primary" style="width:100%;" id="seeResult">&#127942; See Final Quiz Result</button></div>';
  }
  return html;
}

/* ═══════════════════════════════
   QUIZ
═══════════════════════════════ */
function quizHTML(){
  var ch=chapters[state.cur.ch];
  var q=ch.qs[state.cur.qi];
  var pct=Math.round((state.cur.qi/ch.qs.length)*100);
  var html='<div class="progress"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
  html+='<div class="quiz-card">';
  html+='<div class="quiz-meta"><span>'+ch.icon+' '+ch.title+'</span><span>Q'+(state.cur.qi+1)+' of '+ch.qs.length+'</span></div>';
  html+='<div class="quiz-q">'+q.q+'</div>';
  for(var i=0;i<q.opts.length;i++){
    var cls='opt-btn';
    if(state.cur.answered!==null){if(i===q.ans)cls+=' correct';else if(i===state.cur.answered)cls+=' wrong';}
    var dis=state.cur.answered!==null?' disabled':'';
    html+='<button class="'+cls+'" data-opt="'+i+'"'+dis+'>'+q.opts[i]+'</button>';
  }
  if(state.cur.answered!==null){
    var icon=state.cur.correct?'&#9989;':'&#10060;';
    var lbl=state.cur.correct?'Correct!':'Not quite.';
    html+='<div class="explanation"><strong>'+icon+' '+lbl+'</strong> '+q.exp+'</div>';
    var btnLbl=(state.cur.qi+1<ch.qs.length)?'Next Question &#8594;':'&#10003; Finish Chapter';
    html+='<div class="nav-row"><button class="btn" id="backHome">&#8592; Chapters</button><button class="btn primary" id="nextQ">'+btnLbl+'</button></div>';
  }
  html+='</div>';
  return html;
}

/* ═══════════════════════════════
   RESULT
═══════════════════════════════ */
function resultHTML(){
  var pct=Math.round((state.score/state.total)*100);
  var bc=pct>=80?'gold':pct>=60?'silver':'bronze';
  var lbl=pct>=80?'&#127942; Mobile Expert':pct>=60?'&#128077; Smart User':'&#128218; Keep Learning';
  var msg=pct>=80?'Excellent! You know how to buy, protect, and safely use your phone.'
    :pct>=60?'Good job! A few areas to review - go back and retry any chapter.'
    :'No worries - mobile safety is important. Try the chapters again!';
  var html='<div class="result-box">';
  html+='<div style="font-size:60px;margin-bottom:8px;">&#127941;</div>';
  html+='<div class="badge '+bc+'">'+lbl+'</div>';
  html+='<h2>'+state.score+' / '+state.total+'</h2>';
  html+='<p>'+msg+'</p>';
  html+='<button class="btn primary" id="restartBtn" style="width:100%;">&#128257; Play Again</button>';
  html+='<div style="margin-top:12px;"><button class="btn" id="backHomeBtn" style="width:100%;">&#8592; Back to Chapters</button></div>';
  html+='</div>';
  return html;
}

/* ═══════════════════════════════

function awareHTML(){

  html+='<div class="aware-page-header"><div class="back-btn-sm" id="awareBack">&#8592;</div><h2>'+ap.headerTitle+'</h2></div>';
  html+='<div class="intro-card"><p>'+ap.intro+'</p></div>';
  for(var i=0;i<ap.items.length;i++){
    var it=ap.items[i];
    html+='<div class="sign-item"><div class="sico">'+it.ico+'</div><div><h4>'+it.title+'</h4><p>'+it.desc+'</p></div></div>';
  }

    html+='<button class="aware-next-btn last-btn" id="awareDoneBtn">&#10003; All Done — Back to Home</button>';

}

function costHTML(ap){

  html+='<div class="fact-box"><div class="ft">&#128204; Important Fact</div><p>There is no reliable scientific evidence that not replacing your phone every 4 years causes radiation problems. People typically buy new phones due to performance, battery life, security updates, or hardware failure.</p></div>';
  html+='<div class="calc-edit-card"><h3>&#9997;&#65039; Edit Your Values</h3>';
  html+='<div class="inp-row"><label>&#128100; Start using phone at age</label><div class="inp-wrap"><input class="calc-inp" id="cStart" type="number" value="18" min="5" max="50"><span style="font-size:13px;color:#64748b;"> yrs</span></div></div>';
  html+='<div class="inp-row"><label>&#128100; Stop using phone at age</label><div class="inp-wrap"><input class="calc-inp" id="cEnd" type="number" value="65" min="20" max="100"><span style="font-size:13px;color:#64748b;"> yrs</span></div></div>';

  html+='<div class="inp-row"><label>&#128241; Replace every (years)</label><div class="inp-wrap"><input class="calc-inp" id="cRepl" type="number" value="4" min="1" max="10"><span style="font-size:13px;color:#64748b;"> yrs</span></div></div>';
  html+='<div class="inp-row"><label>&#128246; Monthly recharge</label><div class="inp-wrap"><span class="cur">&#8377;</span><input class="calc-inp" id="cRech" type="number" value="350" min="0" max="5000"></div></div>';
  html+='<div class="inp-row"><label>&#128295; Annual servicing</label><div class="inp-wrap"><span class="cur">&#8377;</span><input class="calc-inp" id="cServ" type="number" value="4000" min="0" max="20000"></div></div>';
  html+='<div class="inp-row"><label>&#128247; Annual drops/damage</label><div class="inp-wrap"><span class="cur">&#8377;</span><input class="calc-inp" id="cDmg" type="number" value="2000" min="0" max="20000"></div></div>';
  html+='</div>';
  html+='<button class="do-calc-btn" id="doCalc">&#128200; Calculate My Lifetime Cost</button>';
  html+='<div class="calc-results" id="calcResults"></div>';
  html+='<div class="page-tag">'+ap.pageNum+'</div>';
  var nextAp=getAwarePage(ap.nextId);
  html+='<button class="aware-next-btn" id="awareNext" data-next="'+ap.nextId+'" style="margin-top:8px;">'+nextAp.cardIcon+' Next: '+nextAp.cardTitle+' &#8594;</button>';

function doCalc(){
  var s=parseInt(document.getElementById('cStart').value)||18;
  var e=parseInt(document.getElementById('cEnd').value)||65;
  var pp=parseInt(document.getElementById('cPhone').value)||12000;
  var rp=parseInt(document.getElementById('cRepl').value)||4;
  var rc=parseInt(document.getElementById('cRech').value)||350;
  var sv=parseInt(document.getElementById('cServ').value)||4000;
  var dm=parseInt(document.getElementById('cDmg').value)||2000;
  if(e<=s){alert('End age must be greater than start age.');return;}
  var yrs=e-s;
  var phones=Math.ceil(yrs/rp);
  var phoneCost=phones*pp;
  var rechCost=rc*12*yrs;
  var servCost=sv*yrs;
  var dmgCost=dm*yrs;
  var sub=phoneCost+rechCost+servCost;
  var grand=sub+dmgCost;
  var future=Math.round(grand*1.7);
  function f(n){return '&#8377;'+n.toLocaleString('en-IN');}
  var html='';
  html+='<div class="cost-card2"><h4>&#128241; Phones ('+phones+' phones &times; '+f(pp)+')</h4>';
  html+='<div class="calc-row2"><span class="cl">Total years</span><span class="cv">'+yrs+' years (Age '+s+'–'+e+')</span></div>';
  html+='<div class="calc-row2"><span class="cl">Phones needed</span><span class="cv">≈ '+phones+'</span></div>';
  html+='<div class="calc-row2"><span class="cl">Phone cost</span><span class="cv" style="color:#f87171;">'+f(phoneCost)+'</span></div></div>';
  html+='<div class="cost-card2"><h4>&#128246; Recharges + Servicing + Damage</h4>';
  html+='<div class="calc-row2"><span class="cl">Recharge ('+f(rc)+'/mo)</span><span class="cv" style="color:#f87171;">'+f(rechCost)+'</span></div>';
  html+='<div class="calc-row2"><span class="cl">Servicing ('+f(sv)+'/yr)</span><span class="cv" style="color:#f87171;">'+f(servCost)+'</span></div>';
  html+='<div class="calc-row2"><span class="cl">Damage ('+f(dm)+'/yr)</span><span class="cv" style="color:#f87171;">'+f(dmgCost)+'</span></div></div>';
  html+='<div style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:18px;overflow:hidden;margin-bottom:14px;">';
  html+='<table class="cost-table2"><tr><th>Expense</th><th>Total</th></tr>';
  html+='<tr><td>New Phones</td><td>'+f(phoneCost)+'</td></tr>';
  html+='<tr><td>Recharges</td><td>'+f(rechCost)+'</td></tr>';
  html+='<tr><td>Servicing</td><td>'+f(servCost)+'</td></tr>';
  html+='<tr class="hl"><td>Subtotal</td><td>'+f(sub)+'</td></tr>';
  html+='<tr><td>Drops & Damage</td><td>'+f(dmgCost)+'</td></tr>';
  html+='<tr class="hl"><td>Grand Total</td><td>'+f(grand)+'</td></tr>';
  html+='</table></div>';
  html+='<div class="total-box2"><div class="tl">Estimated Lifetime Mobile Spend</div>';
  html+='<div class="ta">'+f(grand)+'</div>';
  html+='<div class="ts">Age '+s+'–'+e+' &nbsp;·&nbsp; '+yrs+' years &nbsp;·&nbsp; Based on your values</div></div>';
  html+='<div class="warn-box2"><div class="wt">&#9888;&#65039; Future Inflation Projection</div>';
  html+='<p>With rising prices, your real lifetime spend could reach approximately <strong>'+f(future)+'</strong> or more.</p></div>';
  html+='<div class="quote-box"><div class="qico">&#128161;</div><p>"Small, regular expenses add up to enormous sums over time. Use technology wisely."</p></div>';
  var res=document.getElementById('calcResults');
  res.innerHTML=html;
  res.classList.add('show');
  res.scrollIntoView({behavior:'smooth',block:'start'});
  playFinish();
  state.awareDone['cost']=true;
}

function getAwarePage(id){for(var i=0;i<awarePages.length;i++)if(awarePages[i].id===id)return awarePages[i];return null;}

/* ═══════════════════════════════
   EVENTS
═══════════════════════════════ */
function attachEvents(){
  var st=document.getElementById('soundToggle');
  if(st)st.onclick=function(){soundOn=!soundOn;st.innerHTML=soundOn?'&#128266;':'&#128263;';if(soundOn)playClick();};

  var cbs=document.querySelectorAll('.chapter-btn');
  for(var i=0;i<cbs.length;i++){
    cbs[i].addEventListener('click',function(){
      playClick();
      state.cur={ch:parseInt(this.dataset.ch),qi:0,answered:null,correct:null};
      state.screen='quiz';render();
    });
  }

  var abs=document.querySelectorAll('.aware-card');
  for(var j=0;j<abs.length;j++){
    abs[j].addEventListener('click',function(){
      playClick();
      state.awarePageId=this.dataset.aware;
      state.awareDone[state.awarePageId]=true;
      state.screen='aware';render();
    });
  }

  var obs=document.querySelectorAll('.opt-btn');
  for(var k=0;k<obs.length;k++){
    obs[k].addEventListener('click',function(){
      if(state.cur.answered!==null)return;
      var i=parseInt(this.dataset.opt);
      var q=chapters[state.cur.ch].qs[state.cur.qi];
      state.cur.answered=i;state.cur.correct=(i===q.ans);
      state.total++;
      if(state.cur.correct){state.score++;playCorrect();}else{playWrong();}
      render();
    });
  }

  var nq=document.getElementById('nextQ');
  if(nq)nq.addEventListener('click',function(){
    playClick();
    var ch=chapters[state.cur.ch];
    if(state.cur.qi+1<ch.qs.length){
      state.cur.qi++;state.cur.answered=null;state.cur.correct=null;render();
    }else{
      state.chapterDone[state.cur.ch]=true;
      state.screen='home';playFinish();render();
    }
  });

  var bh=document.getElementById('backHome');
  if(bh)bh.addEventListener('click',function(){playClick();state.screen='home';render();});

  var sr=document.getElementById('seeResult');
  if(sr)sr.addEventListener('click',function(){playClick();state.screen='result';render();playFinish();});

  var rb=document.getElementById('restartBtn');
  if(rb)rb.addEventListener('click',function(){
    playClick();
    state={screen:'home',chapterDone:[false,false,false,false,false,false,false,false,false],awareDone:{signs:false,tips:false,reduce:false,cost:false,reels:false},score:0,total:0,cur:{ch:0,qi:0,answered:null,correct:null},awarePageId:'signs'};
    render();
  });
  var bhb=document.getElementById('backHomeBtn');
  if(bhb)bhb.addEventListener('click',function(){playClick();state.screen='home';render();});

  var ab=document.getElementById('awareBack');
  if(ab)ab.addEventListener('click',function(){playBack();state.screen='home';render();});

  var an=document.getElementById('awareNext');
  if(an)an.addEventListener('click',function(){
    playClick();
    var nextId=this.dataset.next;
    state.awarePageId=nextId;
    state.awareDone[nextId]=true;
    render();
  });

  var ad=document.getElementById('awareDoneBtn');
  if(ad)ad.addEventListener('click',function(){playClick();state.awareDone['reels']=true;state.screen='home';render();});

  var dc=document.getElementById('doCalc');
  if(dc)dc.addEventListener('click',function(){playClick();doCalc();});

  /* Reels quiz button → chapter 8 */
  var rqb=document.getElementById('reelsQuizBtn');
  if(rqb)rqb.addEventListener('click',function(){
    playClick();
    state.awareDone['reels']=true;
    state.cur={ch:8,qi:0,answered:null,correct:null};
    state.screen='quiz';render();
  });
}

/* ═══════════════════════════════
   ANDROID BACK BUTTON
═══════════════════════════════ */
document.addEventListener('backbutton',function(e){
  e.preventDefault();
  if(state.screen==='home'){
    if(window.AndroidInterface&&window.AndroidInterface.exitApp)window.AndroidInterface.exitApp();
    else if(navigator.app&&navigator.app.exitApp)navigator.app.exitApp();
    else history.go(-1);
  }else{
    playBack();state.screen='home';render();
  }
},false);

window.addEventListener('load',function(){history.pushState({p:'home'},'','');});
window.addEventListener('popstate',function(){
  if(state.screen!=='home'){playBack();state.screen='home';render();history.pushState({p:'home'},'','');}
});

render();
</script>

</html>
