<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Piece of Brick</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e4;--bg2:#ebe4d2;--tx:#2a2a33;--mu:#6b6b78;--gd:#8a5f0e;--ln:#d8cfb8;--btn:#fff;--fs:20px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--bg2:#15203a;--tx:#e8e4d8;--mu:#9aa3b8;--gd:#d4a94a;--ln:#26355a;--btn:#111}}
:root[data-theme="dark"]{--bg:#0d1526;--bg2:#15203a;--tx:#e8e4d8;--mu:#9aa3b8;--gd:#d4a94a;--ln:#26355a;--btn:#111}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Lora',Georgia,'Times New Roman',serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:24px 20px 90px}
#cover{max-width:680px;margin:0 auto;padding:18px 20px 0}
#cover img{width:100%;display:block;border-radius:12px;box-shadow:0 6px 20px #0004}
#cover p{margin:10px 2px 0;color:var(--mu);font-size:.85rem;text-align:center;font-style:italic}
.btn{background:var(--gd);color:var(--btn);border:0;border-radius:8px;padding:10px 18px;font-weight:600}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln)}
#bar{height:3px;background:var(--gd);width:0}
#tb{display:flex;align-items:center;gap:6px;padding:8px 12px;max-width:680px;margin:0 auto}
#tb .t{flex:1;font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--gd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:var(--bg2);border:1px solid var(--ln);border-radius:8px;min-width:38px;height:38px}
.lab{color:var(--mu);margin:20px 0 4px;font-size:.95rem}
h2{font-size:1.7rem;line-height:1.35;margin:0 0 20px;color:var(--gd)}
h3{font-size:1.1rem;margin:36px 0 8px;padding-top:14px;border-top:1px solid var(--ln);color:var(--gd);font-weight:600}
#body p{font-size:var(--fs);line-height:1.85;margin:.55em 0;padding-left:12px;border-left:3px solid transparent;max-width:34em}
#body p.q{padding-left:22px}
#body p.bm{border-left-color:var(--gd);background:linear-gradient(90deg,var(--bg2),transparent)}
#body p.rd{background:linear-gradient(90deg,var(--bg2),transparent);border-left-color:var(--mu)}
#body p.end{color:var(--mu);font-style:italic}
#nav{display:flex;justify-content:space-between;gap:10px;margin-top:40px}
#fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:24px;padding:11px 16px;background:var(--gd);color:var(--btn);border:0;font-weight:600;box-shadow:0 4px 14px #0006}
#dr{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);background:var(--bg2);border-right:1px solid var(--ln);z-index:9;transform:translateX(-102%);transition:transform .25s;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#dr.on{transform:none}
#dr h4{margin:18px 0 6px;color:var(--gd)}
#dr button.it{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:10px 4px}
#dr .cur{color:var(--gd);font-weight:600}
#dr .x{float:right;color:var(--mu)}
#shade{position:fixed;inset:0;background:#0006;z-index:8}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){#dr{transition:none}}
</style>
</head>

## Part 1 | A Day of Deliveries
Seven in the morning.
The city had not yet fully woken up.
But Sujan's day had already begun.
A courier bag on his shoulder, a mobile phone in his hand, and package after package stacked behind him on the motorbike.
Today, too, he had to visit many homes.
Somewhere, a mobile phone.
Somewhere, a smartwatch.
Somewhere, earbuds.
Somewhere, headphones.
And somewhere else, some other expensive electronic gadget.
Every day, Sujan delivers these things to people's doors.
But strangely—
the man who spends the whole day carrying goods worth thousands of rupees often doesn't have even ten rupees in his own pocket.
Sujan was not very old.
But weariness was written on his face. A light stubble on his jaw, a thin moustache above his lip.
He had studied for almost twenty years.
In the end, he had earned his M.A.
He had hoped to find a good job.
But where were the jobs?
He had sat for one exam after another.
He had gone to interviews.
He had applied.
He had waited.
In the end, the needs of his family forced him to take a job as a delivery boy for a courier company.
To him, the work was not small.
Because it was this money that brought rice into the house.
### Running from Dawn
First delivery.
A mobile phone.
At the door, Sujan held out the package.
The customer opened it and looked at the phone.
After a few seconds he said,
— “No, I don't like this. I won't take it.”
Sujan said calmly,
— “Sir, then I'll return it.”
He took the package back.
Then he updated the return in the app.
Next house.
A smartwatch.
The customer opened the box and said,
— “I don't like the color.”
Another return.
At the third house, earbuds.
— “I didn't like the sound quality.”
Another return.
At the fourth house, another gadget.
— “It's not what I saw in the picture.”
Another return.
Sujan's job was to deliver the packages.
Whether the customers liked them was not in his hands.
But with every return, his own earnings shrank.
Because in many cases, the money due to him depended on successful deliveries.
### The Afternoon Slipped Away
The clock showed two in the afternoon.
Sujan's stomach was burning.
When he left home in the morning, he'd had a cup of tea and two biscuits.
After that, nothing.
He stopped his motorbike in front of a small shop and fumbled through his pocket.
A few coins.
Then he looked at his phone.
How many deliveries had gone through today?
Very few.
More had been returned.
Sujan let out a long sigh.
If he bought food, the money for petrol on the way home would run short.
So he said to the shopkeeper,
— “A bottle of water, please.”
He drank the water and stood there for a while, the bottle in his hand.
Then he climbed back onto his bike.
That day, lunch was not in his fate.
### The Last Delivery of the Evening
The sun was sinking in the western sky.
Sujan now held one special package.
An expensive smartwatch.
The value of the order was high.
He carried the package carefully to the address.
There were quite a few people in front of the house.
Standing at the door, Sujan said,
— “Sir, your parcel.”
The customer took the package.
He opened the box.
Then—
a few seconds of silence.
There was no smartwatch inside.
There was—
a piece of brick.
The customer's eyes went wide.
— “What is this!”
Sujan was stunned.
— “Sir?”
— “Where is my watch?”
— “I don't know, sir. I didn't open the package.”
— “Who else would have opened it, if not you?”
Sujan tried to explain.
— “Sir, I took the package from the company. It was scanned on my end. Then I came straight to your address.”
But by then the excitement had spread.
People nearby gathered around.
Someone was filming on a mobile phone.
Someone was shouting—
— “He stole it!”
— “He swapped the package!”
Sujan said in fear,
— “I didn't do anything! Please, just listen to me once!”
But no one listened.
Someone shoved him.
Another hurled abuse.
Then several of them started beating him.
Sujan covered his head with his hands.
The events of the whole day flashed before his eyes.
He had been running since morning.
He had delivered people's packages.
Many had sent them back because they didn't like them.
Even today, the pay he had earned had not reached his hands properly.
He hadn't even eaten lunch.
He had gotten through the day on water alone.
And now—
the stigma of a thief!
### “Stop!”
At that very moment, a girl in the crowd cried out loudly—
— “Stop!”
Everyone turned to look.
The girl pushed through the crowd and stood in front.
Her name was Swapna.
Looking at Sujan, she said,
— “Are you all right?”
Sujan could not answer.
Swapna said to the people around them,
— “How would a delivery worker know what's inside a package? Investigate first.”
Someone said,
— “Do you know him?”
Swapna said,
— “No. But even if I don't know him, I have no right to beat anyone, and neither do you.”
She took out her phone and called the police.
Then she took the injured Sujan to the hospital.
### At the Hospital
After first aid, the doctor said nothing serious had happened. But there were quite a few injuries on his body.
Swapna was waiting.
After a while she asked,
— “How far did you study?”
Sujan smiled faintly and said,
— “I've completed my M.A.”
Swapna was surprised.
— “Then why this work?”
Sujan told her about his long unemployment.
— “I have a family to run. I don't look at whether a job is big or small.”
Swapna was silent for a while.
Then she said,
— “If you like, I can try to arrange a job for you.”
Sujan looked at her in disbelief.
Swapna explained that her father was an influential political leader. He had several offices.
— “One of my father's offices needs a staff member. You have the educational qualifications. I'll talk to him.”
At first Sujan was not willing.
— “Will your father give me a job?”
Swapna said,
— “I'll try.”
### But There Was One Obstacle
Swapna did not know that once her father learned who Sujan was, things would not stay so simple.
Because although her father was politically influential, in his personal life he still clung to the old notions of caste.
The question of which caste Sujan belonged to could become important to him.
Swapna still didn't know that the man she wanted to lift from a hospital bed and give a chance at a new life would soon lead her into conflict with her own family.
And Sujan?
He knew only this—
for the first time all day, someone had seen him not as a thief, but as a human being.
As she left the hospital, Swapna told him,
— “Come with me tomorrow. I'll talk to my father at his office.”
Sujan looked up at the sky.
After many days, a small light of hope flickered in his heart.
But he did not know—
an even greater test lay waiting ahead on this path of hope.
To be continued...

## Part 2 | A New Job, a New Dream
The very day after leaving the hospital, Swapna took Sujan to her father's office.
Mr. Sanjit was sitting in his office, going through some files.
Swapna said,
— “Dad, this is Sujan. The boy who was beaten up on the road yesterday.”
Mr. Sanjit looked at Sujan.
— “How far have you studied?”
— “I've completed my M.A.”
— “Have you worked anywhere before?”
Sujan told him about his previous job.
Mr. Sanjit thought for a while and said,
— “Our office needs a clerk. Accounts, files, correspondence, some computer work—can you handle all this?”
Sujan said,
— “I'll try, sir.”
Mr. Sanjit smiled faintly and said,
— “Not trying. Work honestly. I'll take care of the rest.”
That very day, a new chapter began in Sujan's life.
### The Clerk's Desk
For the first few weeks, Sujan worked wholeheartedly.
Arranging files.
Drafting letters.
Entering account records into the computer.
Reviewing various applications.
Digging out old records from the office.
Whatever work he was given, Sujan did it with full attention.
Seeing his dedication, Mr. Sanjit was pleased.
One day he said,
— “You work very diligently.”
Sujan replied,
— “Sir, given a chance, a person can prove his worth.”
Mr. Sanjit kept those words in mind.
### But the Office Had Another Face
As he worked, Sujan slowly began to notice things he did not like.
Some files were held up for no reason.
If someone paid money, the work moved quickly.
If someone couldn't pay, their application lay there untouched.
Some documents carried information that had no match in reality.
At first Sujan thought perhaps he was seeing things wrong.
But several incidents kept happening again and again.
One day a poor old man came to the office and said,
— “Sir, please get my work done. I've been going around for so long.”
Looking at the file, Sujan saw that the papers were in order.
But the file had been deliberately held up.
Sujan asked,
— “Why isn't this file moving?”
An employee said in a low voice,
— “Nothing happens this easily.”
Sujan understood what he meant.
Even so, he did not stay silent.
Following the rules, he moved the file forward.
From that day on, in some people's eyes, he became a source of discomfort.
### Ranjit
Mr. Sanjit's brother was Ranjit.
He had considerable influence in local politics.
But many people had various complaints about how much of the office's work was done.
Slowly Sujan came to understand that some of the office's irregularities were connected to people close to Ranjit.
Ranjit, too, realized—
this boy is seeing too much.
One day he called Sujan and said,
— “You're new. Do your own work. Don't try to find out too much.”
Sujan said calmly,
— “I only want to work by the rules.”
Ranjit said in a cold voice,
— “Not all rules are written in books.”
Sujan did not say more.
But from that day, Ranjit disliked him.
### The Smear Campaign Begins
Ranjit could not act directly.
Because Mr. Sanjit liked Sujan.
So he chose another way.
Rumors were spread in the office—
“Sujan is supposedly very cunning.”
“He's being given too much power.”
“He's supposedly leaking the office's secrets outside.”
But even that did not work.
So Ranjit chose the path of even more personal attacks.
One day he said to Mr. Sanjit,
— “Brother, you trust this boy a great deal.”
Mr. Sanjit said,
— “He is doing good work.”
Ranjit smiled and said,
— “Do you know everything about his family?”
Mr. Sanjit looked at him.
Slowly, Ranjit laid Sujan's caste identity before him.
Then he said,
— “Their social standing is not the same as our family's.”
At first Mr. Sanjit stayed silent.
All this time he had watched Sujan's work.
He had seen his honesty.
He had seen his hard work.
But Ranjit kept saying the same thing over and over.
The old notions of caste slowly began to plant seeds of suspicion in his mind.
### Meanwhile, Swapna
Swapna could not accept any of this.
She could see that her father was changing.
One day she said to him,
— “Dad, you told me Sujan does good work.”
Mr. Sanjit said,
— “Yes, he does good work.”
— “Then where is the problem?”
Mr. Sanjit was silent.
Swapna understood.
— “The problem is his caste?”
Mr. Sanjit gave no answer.
Tears came to Swapna's eyes.
— “Why don't you judge a person by his work?”
But no answer came.
### A Decision of Love
Sujan, too, could tell that his presence was becoming a problem for Swapna's family.
He said to Swapna,
— “Don't go against your father.”
Swapna said,
— “I'm not going against my father. I'm standing against injustice.”
— “But your family?”
— “I, too, have the right to decide about my own life.”
Both of them knew a hard road lay ahead.
Even so, they could not let go of each other.
At last, one day, they made a decision—
they would marry.
No big ceremony.
No show.
With just a few close people beside them, they got married.
Tears of joy stood in Sujan's eyes.
Swapna said,
— “From today, you are not alone.”
Sujan smiled faintly and said,
— “Neither are you.”
But they did not know—
when news of this marriage reached Mr. Sanjit and Ranjit, an even greater storm would begin in their lives.

## Part 3 | The False News of Death
News of Swapna and Sujan's marriage did not take long to spread.
From the lanes of the town to political circles—the news reached everywhere.
And when it reached Ranjit's ears, the expression on his face changed.
He gripped the phone lying on the table tightly.
— “Where are they?”
His men reported,
— “Somewhere in the city. We're searching.”
Ranjit said in a cold voice,
— “Find them.”
He knew that if Sujan stayed alive, many things could come out into the open.
And he did not want Swapna to stay with Sujan by any means.
### The Attempt to Escape
Sujan could feel the danger growing.
He said to Swapna,
— “We have to leave this city.”
Swapna shook her head.
— “Where will we go?”
— “Somewhere no one knows us.”
They planned to leave the city and go elsewhere.
But before leaving, Sujan contacted his uncle.
Sujan's uncle, Mr. Arun, was a sub-inspector at the local police station.
Since childhood Sujan had known that although his uncle was a stern man, he was uncompromising against injustice.
They met at a secluded spot near the police station.
Mr. Arun looked at their faces and stayed silent for a while.
Then he said,
— “You still don't understand how big your danger is.”
Sujan said,
— “Uncle, we will leave the city.”
Mr. Arun shook his head.
— “Just leaving the city won't be enough.”
Swapna asked,
— “Why?”
Mr. Arun said in a low voice,
— “I know Ranjit. He is a very dangerous man. He is capable of anything to find you.”
Both of them fell silent.
### Mr. Arun's Plan
After a while Mr. Arun said,
— “You have to vanish in such a way that everyone believes you are no longer alive.”
Swapna gasped.
— “What are you saying?”
— “Don't be afraid. Nothing will happen to you.”
Mr. Arun explained the plan.
Outside the city there is a hilly area. There is a spot there that tourists often visit.
Mr. Arun said,
— “We'll create a situation that makes it look as if you jumped from the top of the hill.”
Sujan was speechless.
— “But our belongings?”
— “That will be the proof.”
He said,
— “Your sandals, a scarf, a bag—I'll deposit these things at the police station.”
Swapna said slowly,
— “And if everyone asks questions?”
Mr. Arun said,
— “I'll say these were recovered from the scene.”
Then he mentioned one more thing.
— “I have two trusted constables. They will testify that they saw you near the scene.”
Sujan was quiet for a while.
Then he said,
— “Will this be legally right, Uncle?”
Mr. Arun sighed.
— “The situation is very hard. I want to keep you safe. But this plan carries risk, and creating false information in any record or investigation is a serious matter in law. So whatever is done, it is safest to do it with the knowledge and approval of my senior authorities.”
He paused a little and said,
— “The most important thing for you now is—to stay alive.”
### Preparing a New Identity
Mr. Arun said,
— “If you wish, you can go abroad.”
Swapna looked at him in surprise.
— “Abroad?”
— “Yes. But that isn't possible overnight.”
He explained—
Passports will be needed.
Visas will be needed.
The necessary papers will have to be prepared.
Tickets and other arrangements will have to be made.
All together, it may take a few days.
Sujan said,
— “Until then?”
Mr. Arun said,
— “Until then, you will stay in a place where no one can find you.”
### The Secret Shelter
That very night, Mr. Arun took them to a safe, secluded place outside the city.
A small house.
Trees all around.
No main road nearby.
Mr. Arun said,
— “Stay here for a few days.”
Looking out the window, Swapna said,
— “Will everyone truly think we are dead?”
Mr. Arun said,
— “If the plan succeeds, yes.”
Sujan's heart trembled.
He had to hide the news that he was alive.
He had to keep his identity hidden.
But if they wanted to live, this was the only path before them now.
Before leaving, Mr. Arun said,
— “Don't open the door even if someone comes knocking. Don't go outside without contacting me.”
The door closed.
Swapna and Sujan looked at each other.
Swapna said softly,
— “Will we ever be able to return to a normal life?”
Sujan took her hand.
— “One day, we will.”
But outside, another plan was taking shape.
Ranjit's men were searching for them all over the city.
And within a day, a piece of news would spread through the town—
“Swapna and Sujan have died by suicide, jumping from the hill.”
No one would know—
that both of them were still alive.
Sitting in a dark room, they waited for a new life.

## Part 4 | Searching for the Dead
The second day at the secret shelter.
By now the world outside had come to believe—
Swapna and Sujan were no more.
The news had spread through the city.
Some of their belongings had been found at the edge of the hill.
Sandals.
A scarf.
A bag.
The police had said that, at first glance, the two were presumed to have fallen from the hill and gone missing.
Ordinary people, too, assumed—
that they had died by suicide.
But Ranjit did not believe it.
### A New Identity
Mr. Arun came to them again in secret that night.
In his hand, a small envelope.
— “Here are your new SIM cards.”
Sujan looked at him in surprise.
— “Uncle, what about our old numbers?”
— “Keep them switched off. From now on, don't contact anyone you know.”
Then he gave them a few more things.
Sujan shaved off his beard and moustache.
Seeing himself in the mirror, even he felt like a stranger.
Swapna, too, changed her hairstyle completely.
Both of them changed out of their old clothes.
Mr. Arun said,
— “Your old identities are now the greatest danger.”
Sujan said slowly,
— “Then we'll have to change our names too?”
— “Yes.”
From that day on, they began introducing themselves by their new names.
Since they were planning to go abroad, they also had to change their way of speaking and the way they carried themselves.
Swapna stood before the mirror and stared at herself for a while.
— “Am I really no longer Swapna?”
Sujan said,
— “You are Swapna. It's only that to the world, our identity has changed.”
### Ranjit's Suspicion
Meanwhile, Ranjit began gathering information through his men.
He did not believe the story of the hill.
His suspicion grew when he found out—
that the sub-inspector who had handled the incident, Mr. Arun, was in fact Sujan's own uncle.
Ranjit slapped the table and said,
— “Now I understand!”
One of his associates asked,
— “What do you understand?”
Ranjit said in a cold voice,
— “Don't believe the news of a death so easily. The officer who handled this is Sujan's uncle.”
— “So?”
— “They are alive.”
There was a strange resolve in Ranjit's eyes.
— “Find them.”
### Even the Shelter Is Not Safe
Two days passed.
Swapna and Sujan were still hiding in that house.
But on the morning of the third day, Swapna felt that the landlord was watching them a little too closely.
Sujan had noticed it too—the landlord kept glancing at them again and again.
At one point he said,
— “Where have you two actually come from?”
Sujan answered calmly,
— “We've come from outside.”
The landlord said nothing more.
But the look in his eyes changed.
Swapna whispered,
— “I think he has recognized us.”
Sujan's heart skipped a beat.
Just then, Mr. Arun's call came.
He listened to the situation and stayed silent for a while.
Then he said,
— “Don't stay in that house even a moment longer.”
### The Last Chance
Mr. Arun told them that arrangements were being made for them to go abroad by another route.
But until they got there, they would have to be very careful.
Over the phone he gave an address, and said—an old car was parked behind the house, with the key inside the car.
Sujan quickly grabbed a notepad and wrote down the address.
Then he said,
— “Uncle, understood.”
The call ended.
Swapna said,
— “Now?”
Sujan looked around.
— “We have to leave right now.”
They hurriedly packed their things.
But just before leaving, Sujan suddenly realized—
it was dangerous to leave behind the address written on the pad.
He tore out the page on which he had written it.
He put the paper in his pocket.
Then he put the notepad back where it had been.
Avoiding the landlord, the two slipped out through the back.
Within minutes, they had vanished.
### Ranjit Arrives
But fate seemed to be testing them.
Soon after, several cars pulled up in front of the house.
Ranjit and his men got out.
— “Where are they?”
The landlord said in fear,
— “I... I don't know.”
Ranjit began searching the house from top to bottom.
The cupboard.
Under the bed.
The bathroom.
The veranda.
There was no one anywhere.
Ranjit's face hardened with rage.
— “They were here just a few minutes ago?”
The landlord gave no answer.
Suddenly one of the men looked at the notepad lying on the table.
Running his hand over the page, he stopped.
— “Boss... something was written here.”
Ranjit stepped forward.
Nothing could be seen directly on the page.
But because the previous page had been written on with a pen pressed hard, the impression of the letters was left on the page beneath.
Carefully, the man studied the impression and tried to read the letters.
An address.
He wrote it down.
Then he handed it to Ranjit.
Ranjit looked at the paper and smiled faintly.
— “Got them.”
One of them asked,
— “So they're heading to that place?”
Ranjit replied,
— “Probably.”
Then, after staying silent for a while, he said—
— “Everyone knows they're dead.”
Everyone looked at him.
Ranjit said slowly,
— “Then I'll make that news of death come true.”
No one had trouble understanding what he meant.
Ranjit got into the car.
The car sped off down the dark road.
And meanwhile—
Swapna and Sujan did not even know that the impression of the address they had written had given away the path to their new refuge.
They thought—
perhaps they had escaped the danger.
But the danger was drawing even closer to them.

## Part 5 | Right Before His Eyes, Yet Unrecognized
By now Ranjit had that address in his hands.
He checked again and again the address he had recovered from the faint impression on the notepad page.
He believed Sujan and Swapna were still on their way out of the city.
But where they were going was not certain.
This time Ranjit sent his men out along separate routes.
He himself set out in another car.
This time he would go alone.
He had only one thought in his mind—
if Sujan and Swapna were truly alive, he had to find them.
### A New Disguise
Meanwhile, Sujan and Swapna were far away from the city.
Mr. Arun had warned them earlier—
“Don't drive nonstop. Stop now and then. Change your route. Don't stay long in one place.”
Sujan was following that advice.
With his shaved face, his new hairstyle, and his new clothes, he still bore no resemblance to the old Sujan.
But Swapna's problem was different.
Even with makeup, there was a chance she could be recognized from up close.
Especially by someone who had known her for many years.
Swapna said,
— “My father would recognize me the moment he saw me.”
Sujan thought for a while.
Then the two of them went into a shop together.
There they bought a burqa.
Swapna put it on.
Her face was completely covered.
Sujan said,
— “Now it will be hard to recognize you.”
Swapna smiled faintly and said,
— “Perhaps.”
Then the two set off again.
### On the Road to the Border
The border was nearly a hundred kilometers away.
Evening had fallen.
The light on the road was fading.
Mr. Arun had said that they should not travel all night without a break.
So they decided to spend the night at a hotel along the way.
Near a small town, they found a hotel.
They parked the car and went inside.
Mr. Arun had earlier arranged the valid papers they needed for the journey.
Showing the papers of their new identity, Sujan took a room.
In the register, both names were new as well.
There was no trace of the old names.
Swapna kept the burqa on.
The hotel staff saw them as just an ordinary couple.
### Ten at Night
It was nearly ten at night.
The two were having dinner in the restaurant downstairs.
Swapna's face was still covered by the burqa.
Sujan said in a low voice,
— “A little longer. Then we'll go to the room and rest.”
Swapna nodded.
Just then—
a car pulled up in front of the hotel.
The glow of its headlights fell on the glass door.
Sujan's hand froze.
Swapna looked toward the window.
The car door opened.
A man stepped out.
Ranjit.
But he was alone.
### Ranjit's Plan
Ranjit had deliberately sent his men in other directions.
He knew that bringing many people along could raise suspicion.
So he had set out alone.
Entering the hotel, he went straight to the reception.
— “Who has checked in today?”
The receptionist opened the register and showed him.
Ranjit slowly began reading the names.
One name.
Then another.
Suddenly two new names caught his eye.
The names were not familiar to him.
Neither Swapna's nor Sujan's name was there.
For a few seconds Ranjit stared at the register.
He was suspicious.
But he had no proof.
### Right Past Them
Ranjit walked toward the restaurant.
Sujan had seen him.
His heart began to pound.
Swapna silently gripped his hand.
Ranjit walked right past them.
Only a few feet away.
Sujan sat with his head down.
Swapna was completely covered by the burqa.
Not once did Ranjit look at them with suspicion.
He went and sat on the other side of the restaurant.
After a while he got up again and went back toward the reception.
Sujan quietly let out a long breath.
Swapna whispered,
— “He didn't recognize us.”
Sujan said,
— “He saw our new names too.”
A faint smile of relief appeared on both their faces.
### But the Danger Is Not Over
Ranjit came out and stood outside the hotel.
He said to himself,
— “No... even if they are here, they won't use their real names.”
His suspicion had still not gone away.
He looked back inside once more.
But seeing the woman in the burqa sitting in the restaurant, he felt—
she was a complete stranger.
And the young man sitting beside her?
His face bore no resemblance to Sujan.
In the end, Ranjit left the hotel.
His car faded into the dark road.
Sitting inside, Sujan and Swapna still did not realize—
they had escaped death by only a few minutes.
But the border was still nearly a hundred kilometers away.
And ahead lay—
the hardest road of all.

## Part 6 | The Final Confession
Even as he left the hotel that night, Ranjit was not fully certain.
But before leaving, he had noticed two cars standing in the hotel parking lot.
Out of habit, he had jotted down their numbers on his mobile.
He did not know then—
that this small piece of information would bring him close to Sujan and Swapna once again.
### Next Afternoon
Morning passed into afternoon.
Sujan and Swapna had come a long way.
Both were tired.
It was nearly two in the afternoon.
Seeing a dhaba by the roadside, Sujan stopped the car.
The two went inside and ate.
Swapna said,
— “How much farther?”
Sujan said,
— “The border isn't very far now.”
After eating, they walked toward the car.
Just then Swapna's eyes fell on the road.
A car was coming in the distance.
The closer it came, the harder her heart pounded.
— “Sujan... that car...”
Sujan looked.
Ranjit's car.
Sujan said quickly,
— “Let's go!”
They got into the car.
Ranjit had not yet seen them.
Sujan drove off quickly and got away.
### Ranjit at the Dhaba
A little later, Ranjit's car pulled up in front of the dhaba.
He went inside and asked the owner directly,
— “Did any cars stop here this afternoon?”
The dhaba owner said,
— “Many cars come.”
Ranjit took out his phone.
— “Look at these two car numbers. Was either of them here?”
The dhaba worker brought out the old parking notebook.
One number matched.
Ranjit's eyes gleamed.
That car.
The car that had been in front of the hotel the night before.
Now Ranjit was certain—
Sujan and Swapna had been in that car.
He hurried outside.
He got into his car and started the engine.
— “This time they won't get away.”
### The Mountain Road
Sujan was by then driving along a mountain road.
The road was narrow.
A mountain on one side.
A deep gorge on the other.
Swapna kept looking back again and again.
— “Are they following us?”
Sujan said,
— “I don't know. But I won't stop.”
After a while, the lights of a car appeared in the distance.
Sujan's heart trembled.
The car was closing in fast.
Swapna looked back and said,
— “That's Ranjit!”
Sujan kept driving.
The distance between the two cars kept shrinking.
At a bend on the mountain road, they came almost side by side.
Ranjit, too, saw Sujan's car.
He tried to keep his car under control.
But suddenly—
the bend ahead.
Stones at the roadside.
Uneven road beneath the wheels.
The car lost control.
In an instant the car went past the edge of the road.
Then—
a terrible sound.
The car plunged into the gorge.
Within seconds, smoke began to rise.
Then fire.
### Sujan and Swapna Turn Back
Sujan stopped the car.
Swapna said,
— “Should we just go?”
Sujan was silent for a while.
Then he said,
— “No.”
He turned the car around and went back toward the scene.
The two climbed down and saw—
Ranjit was trapped inside the car.
The front of the car was burning.
Keeping their own safety in mind, Sujan and Swapna acted as fast as they could and pulled Ranjit out of the burning car.
Ranjit was seriously injured.
His eyes no longer held the old anger.
Only weariness.
And remorse.
With effort, he looked at Sujan.
— “You... came back?”
Sujan said,
— “You were searching for us. We can't leave you behind.”
Ranjit closed his eyes.
Then in a faint voice he said,
— “I made a mistake...”
### The Beginning of the Truth
Sujan stared at him in astonishment.
Ranjit said,
— “What I said against you... much of it was false.”
Swapna stood silent.
With difficulty, Ranjit said,
— “I cast suspicion on your uncle. Even after you ran away, I kept searching for you.”
Then, in an even lower voice, he said,
— “Sujan... what I said against you about your caste, that was wrong too.”
Tears came to Swapna's eyes.
Ranjit said,
— “I wanted to separate you two.”
After pausing for a while, he said,
— “And what I said about the corruption in the office was true too.”
Sujan was stunned.
Ranjit told them how irregularities were committed in various tasks, and how Sujan had come to learn of some of them.
— “I was afraid... that you would expose everything.”
Then he said,
— “Much of the smear campaign I ran against you was to get you out of the way.”
### The Call to Mr. Sanjit
Ranjit still had his phone in his hand.
With trembling hands he called his elder brother Mr. Sanjit's number.
The moment the call was picked up, he said,
— “Brother... listen to me.”
Mr. Sanjit said in an anxious voice,
— “Where are you?”
Ranjit said,
— “There is a lot I need to tell you.”
Then, one by one, he began to tell everything.
The lies told against Sujan.
The matter of caste.
The corruption in the office.
The attempt to remove Sujan.
The hunt for Swapna and Sujan.
Everything.
Mr. Sanjit was silent on the other end.
One last time, Ranjit said,
— “Brother, Sujan is not a bad boy. I made a mistake.”
His voice grew steadily weaker.
— “Don't stop... Swapna anymore.”
Then the phone fell from his hand.
### The Final Moments
The ambulance was taking long to arrive.
Sujan decided to take Ranjit to the hospital in his own car.
Swapna sat beside his head.
Ranjit opened his eyes.
He looked once at Sujan.
Then at Swapna.
In a faint voice he said—
— “You two... stay well.”
Then his eyes slowly closed.
Ranjit died before reaching the hospital.
Sujan stopped the car and sat quietly for a while.
Tears rolled down Swapna's cheeks.
The man who had wanted to destroy their lives—
in his last moment, that very man had placed his truth in their hands.
And he left behind a hard lesson—
in judging people by caste, power, wealth, or political influence, a person can end up wasting his own life.
Now another road lay before them.
But this time, that road would be—
the road of truth.

## Final Part | The Return
After Ranjit's last breath, time seemed to stand still for a while on the mountain road.
Sujan and Swapna kept looking at each other.
The man who for days had filled their lives with terror, that same Ranjit, now lay lifeless.
Swapna said slowly,
— “We can't leave him like this.”
Sujan nodded.
— “You're right.”
Sujan started the car again.
### At the Hospital
Reaching the hospital in the nearby town, Sujan carried Ranjit inside.
After examining him, the doctor declared him dead.
News of the road accident went from the hospital to the local police station.
Sujan and Swapna reported the accident as eyewitnesses.
Then, with trembling hands, Sujan called his uncle's number.
— “Uncle, please come right now. Mr. Ranjit is no more.”
For a few moments there was no sound on the other end.
Then Mr. Arun said only,
— “I'm coming.”
### Before Uncle
Mr. Arun reached the hospital before dawn.
Standing in the corridor were an unfamiliar young man and a woman covered in a burqa.
Sujan had no beard or moustache, a different hairstyle, and different clothes.
Mr. Arun looked at them for a few moments.
He had never seen this burqa-clad woman before.
Sujan said slowly—
— “Uncle...”
Mr. Arun froze.
The moment he heard Sujan's voice, his eyes widened.
— “Sujan!”
In an instant he stepped forward and embraced him.
Then he looked at Swapna.
Swapna lifted the burqa and showed her face.
— “Uncle...”
Tears came to Mr. Arun's eyes.
For a while he could not speak.
Then he returned to his duty as a police officer.
He spoke with the local police station and had the incident recorded as an accidental death.
A postmortem was arranged.
Ranjit's car and the site of the accident were also examined according to procedure.
Then he himself called Mr. Sanjit and gave him the news.
### Before Mr. Sanjit
Mr. Sanjit reached the hospital in the morning.
Standing before his brother's lifeless body, he broke down.
— “Ranjit...”
After a while he looked up.
Sujan and Swapna stood before him.
Mr. Sanjit looked at Sujan for a while.
Every word he had heard on Ranjit's phone was still echoing in his mind.
Slowly he said,
— “Sujan, I wronged you. Instead of seeing you as a human being, I made your caste identity bigger than everything else.”
Sujan said nothing.
Mr. Sanjit said again,
— “I should have looked at the person you are, not your caste.”
Swapna stepped toward her father.
— “Dad...”
Mr. Sanjit looked at his daughter.
For a few moments, grief and guilt appeared together in his eyes.
He said slowly,
— “I misjudged you both.”
Tears in Swapna's eyes.
### Mr. Arun's Truth
Mr. Arun sat everyone down.
He explained how Sujan and Swapna's identities had to be kept secret in order to save their lives.
The incident on the hill had been a plan of a disguised disappearance, so that Ranjit's men could not find them.
But in the end, Ranjit had grown suspicious.
Then Sujan and Swapna told everything—how he had followed them, met with the accident, and confessed his mistakes before his death.
Most important was Ranjit's final confession.
He had admitted—
that many of the accusations made against Sujan were false.
That by using the matter of caste, he had poisoned Mr. Sanjit's mind.
He had also admitted the corruption in the office.
Mr. Sanjit sat with his head bowed.
After a long time he said,
— “My brother made a mistake. And I failed to catch that mistake in time.”
Sujan said calmly,
— “Father, Mr. Ranjit told the whole truth in his last moments. Perhaps that was his final atonement.”
### Following the Rules
After the postmortem and the necessary legal procedures were completed, Ranjit's body was handed over to the family.
In the meantime, Mr. Arun himself went to his senior authorities and reported the whole matter—the plan of the false death, the belongings left at the scene, and the decision to keep the two hidden.
He said,
— “I wanted to save two lives. But it is also true that I broke the rules.”
The inquiry took into account his intentions and the circumstances at that time.
But whether he would be fully absolved was left to the authorities to decide.
Mr. Arun said calmly,
— “Whatever is decided, I will accept it.”
Sujan and Swapna said that, if needed, they would tell the whole truth to the inquiry.
### A New Morning
Ranjit's last rites were completed.
The house was in mourning.
But even in that grief, a relationship was born anew.
Mr. Sanjit called Sujan close.
— “Will you still work at my office?”
Sujan looked at him in surprise.
— “Me?”
— “Yes. I did not understand the value of the work you did.”
He paused for a while and said,
— “You are not just an employee of my office. You are my daughter's life partner.”
Tears came to Swapna's eyes.
Mr. Arun smiled faintly and said,
— “Now no one has to keep running.”
Sujan smiled too.
### A Few Months Later
Everything slowly returned to normal.
Sujan began working at the office again.
But this time, not just as a clerk.
He was also given the responsibility of examining the office's old irregularities.
Swapna was by his side.
There were still many problems in their lives.
But there was no more fear.
No more secret identities.
No more need to keep running.
### The Mystery of the Brick
The investigation into that delivery incident had also been moving forward.
A few months later, the investigation report arrived.
CCTV footage from the warehouse and the confessions of a few people involved in swapping packages made it clear—there had been a ring that swapped delivery workers' packages.
The smartwatch package handed to Sujan had also been swapped earlier, without his knowledge, and filled with a piece of brick.
The suspicion of theft against Sujan was wiped away completely.
The boy whom people on the road had taken for a thief that day was, at the end of the investigation, proven innocent.
One evening, Sujan and Swapna were walking down a road in the old city.
Sujan had that report in his hand.
He looked at Swapna.
— “See? Even that piece of brick brought out the truth one day.”
Swapna smiled faintly and said,
— “The brick came to break your life. In the end, it became the beginning of your life's story.”
Then she said,
— “Remember? This is where I first saw you.”
Sujan said,
— “I thought then that my life was over.”
Swapna said,
— “And I thought, a human being has to be saved.”
Sujan smiled faintly and said,
— “You didn't only save me.”
— “Then what?”
— “You saved my faith too—that people still stand by other people.”
The two walked on side by side.
The man who had once been beaten on the road, while delivering a package, over a piece of brick, was now trying to change an entire office with his honesty.
Behind them lay that road.
That piece of brick.
That humiliation.
That fear.
And ahead of them, a new life opened up.
### The Last Word
A piece of brick had once made a man a thief.
His caste identity had tried to make him small.
The arrogance of power had tried to erase him.
But in the end, what won was—
honesty, love, and humanity.
A person's identity is not in his birth.
It is in his work, his character, and how he treats other people.
The End. 🌱
</script>

<script>
const $=id=>document.getElementById(id);
const LS={g(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const BOOK='A Piece of Brick';

function parse(t){
  const parts=[];let cur=null;
  for(let s of t.split('\n')){
    s=s.trim();if(!s)continue;
    if(s.startsWith('## ')){const a=s.slice(3).split('|').map(x=>x.trim());cur={l:a[0],n:a[1]||'',b:[]};parts.push(cur)}
    else if(!cur)continue;
    else if(s.startsWith('### '))cur.b.push({t:'h',x:s.slice(4)});
    else if(/^(To be continued|The End)/.test(s))cur.b.push({t:'end',x:s});
    else cur.b.push({t:s[0]==='—'?'q':'p',x:s});
  }
  return parts;
}
const parts=parse($('story').textContent);
let P=0,bms=LS.g('iter2en_bm',[]);

function show(p,i){
  stopSpeech();
  P=Math.max(0,Math.min(parts.length-1,p));const pt=parts[P];
  $('cover').hidden=P!==0;
  $('lab').textContent=pt.l;$('h2').textContent=pt.n;
  $('body').innerHTML=pt.b.map((b,k)=>b.t==='h'?`<h3 data-i="${k}">${esc(b.x)}</h3>`:
    `<p data-i="${k}" class="${b.t==='q'?'q':''} ${b.t==='end'?'end':''} ${bms.some(m=>m.p===P&&m.i===k)?'bm':''}">${esc(b.x)}</p>`).join('');
  $('prev').hidden=P===0;$('next').hidden=P===parts.length-1;
  document.title=pt.l+' · '+BOOK;
  drawer();
  if(i!=null){const e=document.querySelector(`#body [data-i="${i}"]`);if(e){e.scrollIntoView({block:'center'});return}}
  window.scrollTo(0,0);LS.s('iter2en_pos',{p:P,i:0});
}
function topIdx(){
  const es=[...document.querySelectorAll('#body p[data-i]')];
  const e=es.find(x=>x.getBoundingClientRect().top>90)||es[es.length-1];
  return e?+e.dataset.i:0;
}
function drawer(){
  $('toc').innerHTML=parts.map((t,k)=>`<button class="it ${k===P?'cur':''}" data-p="${k}">${esc(t.l)} — ${esc(t.n)}</button>`).join('');
  $('bml').innerHTML=bms.length?bms.map((m,k)=>`<div><button class="ib x" data-d="${k}" aria-label="Delete">✕</button><button class="it" data-p="${m.p}" data-i="${m.i}">${esc(parts[m.p].l)}: ${esc(m.s)}…</button></div>`).join(''):'<p style="color:var(--mu)">No bookmarks yet. Tap 🔖 while reading.</p>';
}
const openDr=o=>{$('dr').classList.toggle('on',o);$('shade').hidden=!o};
$('menu').onclick=()=>openDr(true);$('cl').onclick=()=>openDr(false);$('shade').onclick=()=>openDr(false);
$('dr').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.d!=null){bms.splice(+b.dataset.d,1);LS.s('iter2en_bm',bms);show(P,null);return}
  if(b.dataset.p!=null){openDr(false);show(+b.dataset.p,b.dataset.i!=null?+b.dataset.i:null)}
};
$('prev').onclick=()=>show(P-1);$('next').onclick=()=>show(P+1);
$('fab').onclick=()=>{
  const i=topIdx(),ex=bms.findIndex(m=>m.p===P&&m.i===i);
  if(ex>=0)bms.splice(ex,1);else bms.push({p:P,i,s:parts[P].b[i].x.slice(0,36)});
  LS.s('iter2en_bm',bms);show(P,i);
};

let fs=+LS.g('iter2en_fs',20);
const setF=()=>{document.documentElement.style.setProperty('--fs',fs+'px');LS.s('iter2en_fs',fs)};setF();
$('fm').onclick=()=>{fs=Math.max(15,fs-2);setF()};$('fp').onclick=()=>{fs=Math.min(30,fs+2);setF()};

const mq=window.matchMedia('(prefers-color-scheme: dark)');
const setT=(t,save)=>{document.documentElement.dataset.theme=t;if(save)LS.s('iter2en_th',t)};
setT(LS.g('iter2en_th',mq.matches?'dark':'light'),false);
$('th').onclick=()=>setT(document.documentElement.dataset.theme==='light'?'dark':'light',true);

/* ---------- English voice reading ---------- */
const syn=window.speechSynthesis;
let voices=[],session=0,reading=false;
const SPEEDS=[0.85,1,1.15,1.3];
let spi=+LS.g('iter2en_sp',1);if(!(spi>=0&&spi<SPEEDS.length))spi=1;
const setSp=()=>{$('sp').textContent=SPEEDS[spi]+'×';LS.s('iter2en_sp',spi)};setSp();
$('sp').onclick=()=>{spi=(spi+1)%SPEEDS.length;setSp()};

function loadVoices(){if(syn)voices=syn.getVoices()||[]}
function pickVoice(){
  const en=voices.filter(v=>/^en([-_]|$)/i.test(v.lang));
  const rank=v=>{
    const l=v.lang.replace('_','-').toLowerCase();
    let r=l==='en-in'?0:l==='en-gb'?1:l==='en-us'?2:3;
    if(/natural|neural|google|premium|enhanced/i.test(v.name))r-=0.5;
    return r;
  };
  return en.sort((a,b)=>rank(a)-rank(b))[0]||null;
}
if(syn){loadVoices();syn.onvoiceschanged=loadVoices}

function spokenText(x){
  return x.replace(/^—\s*/,'').replace(/[“”]/g,'').replace(/\s*—\s*/g,', ').replace(/\.\.\./g,'.').replace(/🌱/g,'').trim();
}
function setStopped(){reading=false;$('tts').textContent='🔊';document.querySelectorAll('#body p.rd').forEach(e=>e.classList.remove('rd'))}
function stopSpeech(){session++;if(syn)syn.cancel();setStopped()}

function speakFrom(idx){
  const my=++session;
  syn.cancel();
  const items=[...document.querySelectorAll('#body p[data-i]')].filter(e=>+e.dataset.i>=idx&&!e.classList.contains('end'));
  if(!items.length)return;
  const voice=pickVoice();
  reading=true;$('tts').textContent='⏹';
  let n=0;
  const next=()=>{
    if(my!==session)return;
    document.querySelectorAll('#body p.rd').forEach(e=>e.classList.remove('rd'));
    if(n>=items.length){setStopped();return}
    const el=items[n++];
    const txt=spokenText(el.textContent);
    if(!txt){next();return}
    const u=new SpeechSynthesisUtterance(txt);
    u.lang=voice?voice.lang:'en-IN';if(voice)u.voice=voice;
    u.rate=SPEEDS[spi];
    u.onstart=()=>{if(my!==session)return;el.classList.add('rd');
      const r=el.getBoundingClientRect();
      if(r.top<90||r.bottom>innerHeight-70)el.scrollIntoView({block:'center',behavior:'smooth'})};
    u.onend=next;
    u.onerror=e=>{if(e&&(e.error==='canceled'||e.error==='interrupted'))return;next()};
    syn.speak(u);
  };
  next();
}
$('tts').onclick=()=>{
  if(!syn){alert('Voice reading is not supported in this browser.');return}
  if(reading){stopSpeech();return}
  loadVoices();
  speakFrom(topIdx());
};
addEventListener('pagehide',()=>{if(syn)syn.cancel()});

let tk;addEventListener('scroll',()=>{
  const h=document.documentElement,f=h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight);$('bar').style.width=(f*100)+'%';
  clearTimeout(tk);tk=setTimeout(()=>LS.s('iter2en_pos',{p:P,i:topIdx()}),300);
},{passive:true});

const pos=LS.g('iter2en_pos',{p:0,i:0});
show(pos.p,pos.i||null);
</script>
</body>
</html>
