// ══ WEB AUDIO ENGINE ══
let actx = null, soundOn = true;

function ac() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

function tone(freq, dur, type = 'sine', vol = 0.13, delay = 0) {
  if (!soundOn) return;
  try {
    const ctx = ac();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g);
    g.connect(ctx.destination);
    o.type = type;
    o.frequency.setValueAtTime(freq, ctx.currentTime + delay);
    g.gain.setValueAtTime(0, ctx.currentTime + delay);
    g.gain.linearRampToValueAtTime(vol, ctx.currentTime + delay + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + dur);
    o.start(ctx.currentTime + delay);
    o.stop(ctx.currentTime + delay + dur);
  } catch(e) {}
}

['touchstart','click'].forEach(ev =>
  document.addEventListener(ev, () => { try { ac(); } catch(e) {} }, { once: true, passive: true })
);

function sTap(){
  tone(420, 0.05, 'triangle', 0.07);
}

function sCorrect(){
  tone(520, 0.08, 'sine', 0.10);
  tone(680, 0.10, 'sine', 0.10, 0.08);
}

function sWrong(){
  tone(180, 0.08, 'sawtooth', 0.12);
  tone(120, 0.12, 'square', 0.10, 0.05);
}

function sNext(){
  tone(360, 0.05, 'triangle', 0.08);
  tone(520, 0.07, 'triangle', 0.07, 0.05);
}

function sFinish(){
  tone(523, 0.09, 'sine', 0.10);
  tone(659, 0.09, 'sine', 0.10, 0.10);
  tone(784, 0.14, 'sine', 0.11, 0.20);
}

function sRestart(){
  tone(420, 0.07, 'triangle', 0.08);
  tone(300, 0.07, 'triangle', 0.08, 0.06);
}
/* ─────────────────────────────────────────────────
   STATE
───────────────────────────────────────────────── */
var lang = "en";
var shuffledQ = [], currentIdx = 0, score = 0, answered = false, currentOptions = [];

/* ─────────────────────────────────────────────────
   HELPERS
───────────────────────────────────────────────── */
function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function tx(key) { return TXT[lang][key]; }

function buildOptions(q) {
  var opts = [{ text: q["correct_" + lang], correct: true }];
  var w = q["wrong_" + lang];
  for (var i = 0; i < w.length; i++) opts.push({ text: w[i], correct: false });
  currentOptions = shuffleArray(opts);
}

function getOriginalIndex(q) {
  for (var i = 0; i < ALL_Q.length; i++) {
    if (ALL_Q[i] === q) return i;
  }
  return -1;
}

function visualHTML(q) {
  // প্রশ্নের ইমোজি দিয়ে ছবি খোঁজা হচ্ছে (ইমোজি কখনো পরিবর্তন হয় না)
  var imgPath = IMG_MAP[q.emoji]; 

  if (imgPath) {
    // যদি ছবি পাওয়া যায়
    return '<div class="q-visual-area">' +
           '<img src="' + imgPath + '" class="q-img" alt="safety">' +
           '</div>';
  } else {
    // ছবি না থাকলে ওই ইমোজিটিকেই বড় করে দেখাবে (যেমন ফার্স্ট এইড 🩹 বা সিএনজি ⛽)
    return '<div class="q-visual-area">' +
           '<div class="q-emoji-display">' + q.emoji + '</div>' +
           '</div>';
  }
}
function langButtons() {
  return '<div class="lang-tabs">'
    + '<button class="lang-tab' + (lang === "bn" ? " active" : "") + '" onclick="setLang(\'bn\')">বাংলা</button>'
    + '<button class="lang-tab' + (lang === "hi" ? " active" : "") + '" onclick="setLang(\'hi\')">हिंदी</button>'
    + '<button class="lang-tab' + (lang === "en" ? " active" : "") + '" onclick="setLang(\'en\')">English</button>'
    + '</div>';
}

/* ─────────────────────────────────────────────────
   RENDER
───────────────────────────────────────────────── */
function renderQuestion() {
  var q = shuffledQ[currentIdx];
  buildOptions(q);
  var pct = (currentIdx / shuffledQ.length) * 100;
  var opts = "";
  for (var i = 0; i < currentOptions.length; i++) {
    opts += '<button class="option-btn" onclick="selectOption(' + i + ')">' + currentOptions[i].text + '</button>';
  }
  document.getElementById("quiz-container").innerHTML =
    '<div class="quiz-header">' + langButtons() + '<div class="score-badge">' + tx("score") + ': ' + score + '</div></div>'
    + '<div class="progress-area">'
    + '<div class="progress-info"><span>' + tx("question") + ' ' + (currentIdx + 1) + '</span><span>' + (currentIdx + 1) + ' ' + tx("of") + ' ' + shuffledQ.length + '</span></div>'
    + '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div></div>'
    + '<div class="card-area"><div class="question-card">'
    + visualHTML(q, currentIdx + 1)
    + '<div class="card-body">'
    + '<div class="question-text">' + q["q_" + lang] + '</div>'
    + '<div class="options-grid">' + opts + '</div>'
    + '<div id="feedback-wrap"></div>'
    + '</div></div></div>'
    + '<div class="nav-row"><button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display:none;">' + tx("next") + '</button></div>';
  answered = false;
}

function selectOption(idx) {
  if (answered) return;
  answered = true;
  var q = shuffledQ[currentIdx];
  var btns = document.querySelectorAll(".option-btn");
  var chosen = currentOptions[idx];
  for (var i = 0; i < btns.length; i++) {
    btns[i].disabled = true;
    if (currentOptions[i].correct) btns[i].classList.add("reveal-correct");
  }
if (chosen.correct) {
  sCorrect();
  score++;
  btns[idx].classList.remove("reveal-correct");
  btns[idx].classList.add("correct");
} else {
  sWrong();
  btns[idx].classList.add("wrong");
}
  document.getElementById("feedback-wrap").innerHTML =
    '<div class="feedback-box">'
    + '<div class="feedback-exp"><strong>' + (chosen.correct ? tx("correct") : tx("wrong")) + '</strong><br>' + q["exp_" + lang] + '</div>'
    + '<div class="feedback-soul">' + q["soul_" + lang] + '</div>'
    + '</div>';
  var nb = document.getElementById("nextBtn");
  if (nb) nb.style.display = "inline-block";
  var badge = document.querySelector(".score-badge");
  if (badge) badge.textContent = tx("score") + ": " + score;
}

function nextQuestion() {
  if (!answered) return;
  sNext();
  currentIdx++;
  if (currentIdx >= shuffledQ.length) showResult();
  else renderQuestion();
}
var PASS_PCT = 45;
var CERT_TXT = {
  en:{pass:"You passed! Enter your details to get the certificate.", fail:"You need at least 45% to unlock the certificate. Try again!", name:"Your full name", school:"School / Institution name", district:"District", country:"Country", gen:"Generate Certificate 🏅", back:"← Back to Miscellaneous Exam"},
  bn:{pass:"অভিনন্দন! সার্টিফিকেটের জন্য তোমার তথ্য দাও।", fail:"সার্টিফিকেট পেতে কমপক্ষে ৪৫% দরকার। আবার চেষ্টা করো!", name:"তোমার পূর্ণ নাম", school:"স্কুল / প্রতিষ্ঠানের নাম", district:"জেলা", country:"দেশ", gen:"সার্টিফিকেট তৈরি করো 🏅", back:"← Miscellaneous Exam-এ ফিরে যাও"},
  hi:{pass:"बधाई! सर्टिफिकेट के लिए अपनी जानकारी भरें।", fail:"सर्टिफिकेट के लिए कम से कम 45% चाहिए। फिर कोशिश करें!", name:"आपका पूरा नाम", school:"स्कूल / संस्थान का नाम", district:"ज़िला", country:"देश", gen:"सर्टिफिकेट बनाएँ 🏅", back:"← Miscellaneous Exam पर वापस"}
};
function showResult() {
  sFinish();
  var saved = {};
  ["rsName","rsSchool","rsDistrict","rsCountry"].forEach(function(id){ var e=document.getElementById(id); if(e) saved[id]=e.value; });
  var pct = (score / shuffledQ.length) * 100;
  var passed = Math.round(pct) >= PASS_PCT;
  var ct = CERT_TXT[lang];
  var msg = pct >= 85 ? tx("msg1") : pct >= 60 ? tx("msg2") : tx("msg3");
  var ss = pct >= 85 ? "⭐⭐⭐" : pct >= 60 ? "⭐⭐" : "⭐";
  var sh = "";
  for (var i = 0; i < ss.length;) {
    var cp = ss.codePointAt(i);
    sh += '<span class="star">' + String.fromCodePoint(cp) + '</span>';
    i += cp > 0xFFFF ? 2 : 1;
  }
  var form = passed
    ? '<div class="cert-box"><div class="cert-note">' + ct.pass + '</div>'
      + '<input class="cert-in" id="rsName" maxlength="40" placeholder="' + ct.name + '" value="' + (saved.rsName||"") + '">'
      + '<input class="cert-in" id="rsSchool" maxlength="80" placeholder="' + ct.school + '" value="' + (saved.rsSchool||"") + '">'
      + '<input class="cert-in" id="rsDistrict" maxlength="50" placeholder="' + ct.district + '" value="' + (saved.rsDistrict||"") + '">'
      + '<input class="cert-in" id="rsCountry" maxlength="50" placeholder="' + ct.country + '" value="' + (saved.rsCountry||"") + '">'
      + '<button class="restart-btn" id="genBtn" onclick="goToCertificate()">' + ct.gen + '</button></div>'
    : '<div class="cert-box"><div class="cert-note">' + ct.fail + '</div></div>';
  document.getElementById("quiz-container").innerHTML =
    '<div class="quiz-header">' + langButtons() + '<div class="score-badge">' + tx("score") + ': ' + score + '</div></div>'
    + '<div class="result-screen">'
    + '<div class="result-trophy">🏆</div>'
    + '<div class="result-title">' + tx("done") + '</div>'
    + '<div class="stars-row">' + sh + '</div>'
    + '<div class="result-score-big">' + score + '<span> / ' + shuffledQ.length + '</span></div>'
    + '<div class="result-msg">' + msg + '</div>'
    + form
    + '<button class="restart-btn" style="margin-top:12px" onclick="startQuiz()">' + tx("restart") + '</button>'
    + '<a class="cert-back" href="miscellaneous_exam.html">' + ct.back + '</a>'
    + '</div>';
}

/* ===== Certificate: saved under the Miscellaneous Exam category ===== */
var GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbw6RCPloCBvzyM_quGnBgekRwAVZUVCjcATSetNwoNuhknnJah_5DJaGPtwEkqh7aY/exec";
async function goToCertificate() {
  function val(id){ return (document.getElementById(id).value || "").trim(); }
  var name=val("rsName"), school=val("rsSchool"), district=val("rsDistrict"), country=val("rsCountry");
  var order=["rsName","rsSchool","rsDistrict","rsCountry"], vals=[name,school,district,country];
  for (var k=0;k<4;k++){ if(!vals[k]){ document.getElementById(order[k]).focus(); return; } }
  var total = shuffledQ.length;
  var percentage = Math.round((score/total)*100);
  if (percentage < PASS_PCT) return;
  var btn=document.getElementById("genBtn"); if(btn) btn.disabled=true;

  var studentId = localStorage.getItem('myskill_student_id');
  if (!studentId) {
    studentId = 'MSG-STU-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).substring(2,6).toUpperCase();
    try { localStorage.setItem('myskill_student_id', studentId); } catch(e){}
  }
  try { localStorage.setItem('msg_student_id', studentId); } catch(e){}

  var certificateNo = 'MSG-MISC-ROAD-' + Date.now().toString(36).toUpperCase().slice(-6);
  var langLabel = 'Road Safety';
  var examName = 'Miscellaneous Exam (' + langLabel + ')';
  var issueDate = new Date().toISOString();

  var certParams = {
    name:name, school:school, district:district, country:country,
    language:langLabel, content:examName, type:'Miscellaneous Exam',
    score:String(score), total:String(total), percentage:String(percentage),
    certificateId:certificateNo, issueDate:issueDate
  };

  try {
    localStorage.setItem('msg_advance_test_result', JSON.stringify({
      name:name, school:school, district:district, country:country,
      language:langLabel, langCode:'road_safety', content:examName, type:'Miscellaneous Exam',
      score:score, total:total, pct:percentage, passed:true, certId:certificateNo,
      studentId:studentId, issueDate:issueDate,
      date:new Date(issueDate).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})
    }));
  } catch(e){}

  try {
    var KEY='myskill_cert_history';
    var raw=localStorage.getItem(KEY);
    var hist=raw?JSON.parse(raw):[];
    hist.unshift({
      system:'My Skill : Safety', name:name, school:school, district:district, country:country,
      language:langLabel, content:examName, type:'Miscellaneous Exam',
      score:score, total:total, percentage:percentage, certId:certificateNo,
      studentId:studentId, savedAt:issueDate, params:certParams
    });
    localStorage.setItem(KEY, JSON.stringify(hist.slice(0,100)));
  } catch(e){}

  try {
    await fetch(GOOGLE_SHEET_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        studentId:studentId, certificateNo:certificateNo, certId:certificateNo,
        name:name, school:school, district:district, country:country,
        examName:examName, score:score, totalMarks:total
      })
    });
  } catch(e){ console.error('Google Sheet error:', e); }

  window.location.href = 'certificate.html?' + new URLSearchParams(certParams).toString();
}

function setLang(l) {
  sTap();
  lang = l;
  if (document.querySelector(".result-screen")) showResult();
  else renderQuestion();
}

function startQuiz() {
  sRestart();
  shuffledQ = shuffleArray(ALL_Q);
  currentIdx = 0; score = 0; answered = false; currentOptions = [];
  renderQuestion();
}

startQuiz();
