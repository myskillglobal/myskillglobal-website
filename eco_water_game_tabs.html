const tabs=[
  {

      {title:"Drain Overflow Problem",desc:"Many drains overflow all year round, creating stagnant water. Mosquitoes breed in this standing water, causing diseases like malaria and dengue. The root cause is that rainwater has nowhere to go in concrete cities.",facts:["Mosquito breeding","Waterlogging","Stagnant water"]},
      {title:"Safety Chamber Solution",desc:"A safety chamber (soak pit) built below a drain allows excess water to slowly seep deep into the soil. The drain stays dry, mosquito breeding is prevented, and the underground water table is naturally recharged.",facts:["Dry drains","No mosquitoes","Groundwater recharge"]},
      {title:"How a Soak Pit Works",desc:"The soak pit is filled with gravel and sand which filter the water before it enters the soil. Water passes through layers — stones remove debris, sand removes fine particles — and clean water reaches the ground safely.",facts:["Gravel filter","Sand layer","Clean water"]}
    ]
  },
  {
    imgs:["env/rainwater_1.png","env/rainwater_2.png","env/rainwater_3.png"],

    slides:[
      {title:"Rainwater Lost to Rivers",desc:"In cities, most surfaces are covered in concrete. Rainwater cannot soak into the ground — it runs into drains and flows directly into rivers and the sea, wasting a precious resource that could recharge groundwater.",facts:["Concrete cities","Wasted water","River overflow"]},
      {title:"Rooftop Water Collection",desc:"Rainwater from rooftops can be collected through pipes into storage tanks. This harvested water can be used for gardening, washing, and toilets — reducing dependency on municipal water supply by up to 40%.",facts:["Rooftop pipes","Storage tanks","40% saving"]},
      {title:"Absorption Pits & Ponds",desc:"Absorption pits and rainwater ponds allow water to slowly enter the soil, recharging groundwater. In rural and semi-urban areas, these are low-cost solutions that prevent flooding and provide water during dry seasons.",facts:["Absorb rainwater","Prevent floods","Dry season water"]}
    ]

      {title:"Plastic Clogs Drains & Ponds",desc:"Plastic in drains causes severe blockages leading to urban flooding. In ponds and rivers, plastic chokes aquatic life. Fish and birds mistake plastic for food, causing injury and death. Our water bodies are being destroyed silently.",facts:["Drain blockage","Harms fish","River pollution"]},
      {title:"Solutions to Plastic Pollution",desc:"Reduce single-use plastic. Segregate waste at home. Participate in clean-up drives. Plant trees near water bodies. Compost organic waste. Support cloth and jute bags. Every small action protects our soil and water from plastic harm.",facts:["Reduce plastic","Segregate waste","Plant trees"]}

function drawSoak1(ctx,W,H){
  ctx.fillStyle="#e3f2fd";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#90caf9";
  for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(30+i*65,38,28,13,0,0,Math.PI*2);ctx.fill();}
  ctx.strokeStyle="#1565c0";ctx.lineWidth=2.5;
  for(let r=0;r<8;r++){const rx=80+r*30,ry=60+Math.random()*40;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-2,ry+14);ctx.stroke();}
  ctx.fillStyle="#546e7a";ctx.fillRect(W*.1,H*.45,W*.8,H*.08);
  ctx.fillStyle="#455a64";ctx.fillRect(W*.18,H*.53,W*.64,H*.28);
  ctx.fillStyle="#b0bec5";
  for(let r=0;r<3;r++)for(let c=0;c<5;c++){ctx.beginPath();ctx.arc(W*.22+c*W*.12,H*.56+r*H*.07,W*.025,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle="#ef5350";ctx.fillRect(W*.3,H*.35,W*.4,H*.1);
  ctx.fillStyle="#fff";ctx.font=`bold ${W*.038}px Arial`;ctx.textAlign="center";ctx.fillText("OVERFLOW",W/2,H*.43);
  ctx.fillStyle="#1565c0";ctx.font=`bold ${W*.045}px Arial`;ctx.fillText("Drain Overflow Problem",W/2,H*.95);
}
function drawSoak2(ctx,W,H){
  ctx.fillStyle="#e8f5e9";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#8d6e63";ctx.fillRect(W*.15,H*.3,W*.7,H*.05);
  ctx.fillStyle="#6d4c41";ctx.fillRect(W*.22,H*.35,W*.56,H*.45);
  const ly=[{c:"#9e9e9e",l:"Gravel",y:.36},{c:"#bdbdbd",l:"Small stones",y:.46},{c:"#f9a825",l:"Sand",y:.56},{c:"#795548",l:"Fine sand",y:.66}];
  ly.forEach((l,i)=>{ctx.fillStyle=l.c;ctx.fillRect(W*.23,H*l.y,W*.54,H*.09);ctx.fillStyle="#212121";ctx.font=`${W*.034}px Arial`;ctx.textAlign="left";ctx.fillText(l.l,W*.26,H*(l.y+.065));});
  ctx.strokeStyle="#29b6f6";ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(W*.5,H*.1);ctx.lineTo(W*.5,H*.3);ctx.stroke();
  ctx.strokeStyle="#4caf50";ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(W*.5,H*.8);ctx.lineTo(W*.5,H*.92);ctx.stroke();
  ctx.fillStyle="#2e7d32";ctx.font=`bold ${W*.04}px Arial`;ctx.textAlign="center";ctx.fillText("Safety Chamber — Soak Pit",W/2,H*.97);
}
function drawSoak3(ctx,W,H){
  ctx.fillStyle="#fff9c4";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#a5d6a7";ctx.fillRect(0,H*.65,W,H*.35);
  ctx.fillStyle="#8d6e63";ctx.fillRect(W*.2,H*.3,W*.6,H*.05);
  ctx.fillStyle="#795548";ctx.fillRect(W*.28,H*.35,W*.44,H*.3);
  ctx.fillStyle="#9e9e9e";for(let r=0;r<3;r++)for(let c=0;c<4;c++){ctx.beginPath();ctx.arc(W*.31+c*W*.1,H*.38+r*H*.08,W*.03,0,Math.PI*2);ctx.fill();}
  ctx.strokeStyle="#1e88e5";ctx.lineWidth=2;
  for(let d=0;d<3;d++){ctx.beginPath();ctx.moveTo(W*.35+d*W*.1,H*.12);ctx.lineTo(W*.35+d*W*.1,H*.3);ctx.stroke();}
  ctx.strokeStyle="#43a047";ctx.lineWidth=2;
  for(let d=0;d<3;d++){ctx.beginPath();ctx.moveTo(W*.38+d*W*.09,H*.65);ctx.lineTo(W*.38+d*W*.09,H*.8);ctx.stroke();}
  ctx.fillStyle="#1a237e";ctx.font=`bold ${W*.045}px Arial`;ctx.textAlign="center";ctx.fillText("Filtered Water → Ground",W/2,H*.95);
}
function drawRain1(ctx,W,H){
  ctx.fillStyle="#e3f2fd";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#90caf9";for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(40+i*90,40,35,16,0,0,Math.PI*2);ctx.fill();}
  ctx.strokeStyle="#1565c0";ctx.lineWidth=1.8;
  for(let r=0;r<16;r++){const x=20+r*22,y=65;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y+13);ctx.stroke();}
  ctx.fillStyle="#bdbdbd";ctx.fillRect(W*.05,H*.5,W*.9,H*.03);
  ctx.strokeStyle="#ef9a9a";ctx.lineWidth=8;ctx.strokeRect(W*.1,H*.53,W*.8,H*.25);
  ctx.fillStyle="#ef9a9a";ctx.fillRect(W*.1,H*.53,W*.8,H*.25);
  ctx.fillStyle="#1565c0";ctx.font=`bold ${W*.042}px Arial`;ctx.textAlign="center";ctx.fillText("Rain runs into rivers — wasted!",W/2,H*.95);
}

  ctx.fillStyle="#e57373";for(let t=0;t<8;t++)ctx.fillRect(W*.1+t*W*.1,H*.36,W*.08,H*.08);
  ctx.fillStyle="#bdbdbd";ctx.fillRect(W*.08,H*.44,W*.84,H*.04);

  ctx.fillStyle="#1565c0";ctx.strokeStyle="#0d47a1";ctx.lineWidth=2;ctx.beginPath();ctx.rect(W*.24,H*.56,W*.25,H*.26);ctx.fill();ctx.stroke();
  ctx.fillStyle="#bbdefb";ctx.fillRect(W*.26,H*.68,W*.21,H*.12);
  ctx.fillStyle="#fff";ctx.font=`bold ${W*.036}px Arial`;ctx.textAlign="center";ctx.fillText("Tank",W*.36,H*.76);
  ctx.fillStyle="#1a237e";ctx.font=`bold ${W*.042}px Arial`;ctx.fillText("Rooftop Rainwater Harvesting",W/2,H*.96);

  ctx.fillStyle="#e0f7fa";ctx.fillRect(0,0,W,H);

  g.addColorStop(0,"#29b6f6");g.addColorStop(1,"#0277bd");
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(W/2,H*.48,W*.38,H*.19,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#4fc3f7";ctx.lineWidth=1.5;
  for(let w=0;w<3;w++){ctx.beginPath();ctx.ellipse(W/2,H*.43+w*H*.03,W*.18,7,0,0,Math.PI*2);ctx.stroke();}
  ctx.strokeStyle="#1e88e5";ctx.lineWidth=2.5;
  for(let r=0;r<4;r++){ctx.beginPath();ctx.moveTo(W*.3+r*W*.12,H*.1);ctx.lineTo(W*.3+r*W*.12,H*.29);ctx.stroke();}
  ctx.fillStyle="#1a237e";ctx.font=`bold ${W*.042}px Arial`;ctx.textAlign="center";ctx.fillText("Absorption Pond — Groundwater Recharge",W/2,H*.96);
}
function drawSoil1(ctx,W,H){
  ctx.fillStyle="#fff9c4";ctx.fillRect(0,0,W,H);

  ctx.fillStyle="#795548";ctx.fillRect(0,H*.67,W,H*.33);
  const pcs=[[W*.15,H*.35],[W*.35,H*.2],[W*.55,H*.4],[W*.72,H*.25],[W*.88,H*.38],[W*.1,H*.55],[W*.45,H*.6],[W*.8,H*.52]];
  pcs.forEach(([px,py])=>{ctx.fillStyle="#e0e0e0";ctx.fillRect(px-12,py-6,24,12);ctx.strokeStyle="#9e9e9e";ctx.lineWidth=1;ctx.strokeRect(px-12,py-6,24,12);});
  ctx.fillStyle="#d32f2f";ctx.font=`bold ${W*.038}px Arial`;ctx.textAlign="center";ctx.fillText("Plastic blocks soil pores!",W/2,H*.96);
}
function drawSoil2(ctx,W,H){
  ctx.fillStyle="#e3f2fd";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#a5d6a7";ctx.fillRect(0,H*.7,W,H*.3);
  ctx.strokeStyle="#1565c0";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(W*.1,H*.2);ctx.lineTo(W*.1,H*.7);ctx.lineTo(W*.9,H*.7);ctx.lineTo(W*.9,H*.2);ctx.stroke();
  ctx.fillStyle="#29b6f6";ctx.fillRect(W*.12,H*.5,W*.76,H*.19);
  const pcs=[[W*.2,H*.53],[W*.4,H*.56],[W*.6,H*.52],[W*.75,H*.55],[W*.3,H*.62],[W*.55,H*.64],[W*.7,H*.6]];
  pcs.forEach(([px,py])=>{ctx.fillStyle="#e0e0e0";ctx.fillRect(px-10,py-5,20,10);ctx.strokeStyle="#bdbdbd";ctx.lineWidth=1;ctx.strokeRect(px-10,py-5,20,10);});
  ctx.fillStyle="#b71c1c";ctx.font=`bold ${W*.038}px Arial`;ctx.textAlign="center";ctx.fillText("Plastic clogs drains — floods!",W/2,H*.96);
}
function drawSoil3(ctx,W,H){
  ctx.fillStyle="#e8f5e9";ctx.fillRect(0,0,W,H);
  const sol=[{ic:"&#9851;",lbl:"Reduce",x:W*.2,y:H*.3,c:"#4caf50"},{ic:"&#9832;",lbl:"Segregate",x:W*.5,y:H*.3,c:"#1565c0"},{ic:"&#127807;",lbl:"Plant trees",x:W*.8,y:H*.3,c:"#2e7d32"},{ic:"&#128462;",lbl:"Use cloth bags",x:W*.2,y:H*.65,c:"#795548"},{ic:"&#127774;",lbl:"Compost",x:W*.5,y:H*.65,c:"#f9a825"},{ic:"&#128221;",lbl:"Report burning",x:W*.8,y:H*.65,c:"#e53935"}];
  sol.forEach(s=>{ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,W*.1,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font=`bold ${W*.036}px Arial`;ctx.textAlign="center";ctx.fillText(s.lbl,s.x,s.y+W*.14);});
  ctx.fillStyle="#2e7d32";ctx.font=`bold ${W*.042}px Arial`;ctx.textAlign="center";ctx.fillText("Solutions to Plastic Pollution",W/2,H*.96);
}
function drawBurn1(ctx,W,H){
  ctx.fillStyle="#fff3e0";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#e0e0e0";ctx.fillRect(W*.35,H*.55,W*.3,H*.04);
  ctx.fillStyle="#757575";ctx.fillRect(W*.38,H*.59,W*.06,H*.18);ctx.fillRect(W*.56,H*.59,W*.06,H*.18);
  ctx.fillStyle="#9e9e9e";for(let i=0;i<4;i++)ctx.fillRect(W*.36+i*W*.07,H*.56,W*.06,H*.08);
  ctx.fillStyle="#ff7043";ctx.beginPath();ctx.ellipse(W*.5,H*.5,W*.08,H*.1,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ffcc02";ctx.beginPath();ctx.ellipse(W*.5,H*.46,W*.05,H*.08,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#424242";
  for(let s=0;s<10;s++){const sx=W*.3+s*W*.04,sy=H*.15+Math.sin(s)*H*.08;ctx.beginPath();ctx.arc(sx,sy,8+s*1.5,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle="#b71c1c";ctx.font=`bold ${W*.042}px Arial`;ctx.textAlign="center";ctx.fillText("NEVER burn plastic!",W/2,H*.96);
}
function drawBurn2(ctx,W,H){
  ctx.fillStyle="#fce4ec";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#ef9a9a";ctx.beginPath();ctx.ellipse(W*.5,H*.4,W*.28,H*.14,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#d32f2f";ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(W*.5,H*.4,W*.28,H*.14,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle="#ef5350";ctx.font=`${W*.045}px Arial`;ctx.textAlign="center";ctx.fillText("TOXIC",W/2,H*.43);
  ctx.strokeStyle="#c62828";ctx.lineWidth=2.5;
  for(let a=0;a<8;a++){const angle=a*Math.PI/4;ctx.beginPath();ctx.moveTo(W*.5+W*.3*Math.cos(angle),H*.4+H*.16*Math.sin(angle));ctx.lineTo(W*.5+W*.45*Math.cos(angle),H*.4+H*.22*Math.sin(angle));ctx.stroke();}
  ctx.fillStyle="#1a237e";ctx.font=`bold ${W*.038}px Arial`;ctx.textAlign="center";ctx.fillText("Toxins spread to soil & water",W/2,H*.8);
  ctx.fillStyle="#b71c1c";ctx.font=`${W*.034}px Arial`;ctx.fillText("Cancer | Lung disease | Children at risk",W/2,H*.88);
}
function drawBurn3(ctx,W,H){
  ctx.fillStyle="#e8f5e9";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#a5d6a7";ctx.fillRect(0,H*.65,W,H*.35);
  const acts=[{c:"#1565c0",l:"Refuse plastic",y:.22},{c:"#2e7d32",l:"Use cloth bags",y:.36},{c:"#f9a825",l:"Compost waste",y:.50},{c:"#e53935",l:"Report burning",y:.64},{c:"#009688",l:"Plant trees",y:.78}];
  acts.forEach(a=>{ctx.fillStyle=a.c;ctx.fillRect(W*.08,H*a.y,W*.84,H*.1);ctx.fillStyle="#fff";ctx.font=`bold ${W*.04}px Arial`;ctx.textAlign="center";ctx.fillText(a.l,W*.5,H*(a.y+.068));});
  ctx.fillStyle="#1a237e";ctx.font=`bold ${W*.042}px Arial`;ctx.textAlign="center";ctx.fillText("Actions You Can Take Today",W/2,H*.96);
}

const fallbacks=[[drawSoak1,drawSoak2,drawSoak3],[drawRain1,drawRain2,drawRain3],[drawSoil1,drawSoil2,drawSoil3],[drawBurn1,drawBurn2,drawBurn3]];

function makeCanvas(tabIdx){
  const cv=document.getElementById("c"+tabIdx);
  if(!cv)return;
  const box=cv.parentElement;
  const W=box.offsetWidth||360,H=Math.round(W*0.75);
  cv.width=W;cv.height=H;
  const ctx=cv.getContext("2d");
  const imgSrc=tabs[tabIdx].imgs[curImg[tabIdx]];
  const im=new Image();
  im.onload=()=>{ctx.drawImage(im,0,0,W,H);};
  im.onerror=()=>{fallbacks[tabIdx][curImg[tabIdx]](ctx,W,H);};
  im.src=imgSrc;
}

function updateInfo(tabIdx){
  const s=tabs[tabIdx].slides[curImg[tabIdx]];
  document.getElementById("t"+tabIdx).textContent=s.title;
  document.getElementById("d"+tabIdx).textContent=s.desc;
  const fr=document.getElementById("f"+tabIdx);
  fr.innerHTML=s.facts.map(f=>`<span class="fact">${f}</span>`).join("");
  const dr=document.getElementById("dots"+tabIdx);
  dr.innerHTML=tabs[tabIdx].imgs.map((_,i)=>`<div class="img-dot${i===curImg[tabIdx]?" on":""}" onclick="goImg(${tabIdx},${i})"></div>`).join("");
  makeCanvas(tabIdx);
  stopVoice();
}

function nextImg(ti){curImg[ti]=(curImg[ti]+1)%3;updateInfo(ti);}
function prevImg(ti){curImg[ti]=(curImg[ti]+2)%3;updateInfo(ti);}
function goImg(ti,i){curImg[ti]=i;updateInfo(ti);}

let spkEl=null,spkTi=-1;
function stopVoice(){if(window.speechSynthesis)window.speechSynthesis.cancel();if(spkEl){spkEl.classList.remove("spk");spkEl.textContent="&#128266; Listen";}spkTi=-1;}
function speak(ti){

  if(!window.speechSynthesis)return;

  if(spkTi===ti){
    stopVoice();
    return;
  }

  stopVoice();

  speechSynthesis.cancel();

  const s=tabs[ti].slides[curImg[ti]];

  const u=new SpeechSynthesisUtterance(
    s.title + ". " + s.desc
  );

  u.lang="en-US";

  u.rate=0.9;

  u.pitch=1;

  const voices=speechSynthesis.getVoices();

  const mobileVoice=voices.find(v=>
    v.lang.includes("en") &&
    (
      v.name.includes("Google") ||
      v.name.includes("Samantha")
    )
  );

  if(mobileVoice){
    u.voice=mobileVoice;
  }

  setTimeout(()=>{
    speechSynthesis.speak(u);
  },100);

  u.onend=()=>stopVoice();

  spkEl=document.getElementById("vb"+ti);

  spkTi=ti;

  spkEl.classList.add("spk");

  spkEl.innerHTML="🔇 Stop";
}
function openTab(i){
  document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("active",j===i));
  document.querySelectorAll(".tp").forEach((t,j)=>t.classList.toggle("active",j===i));
  stopVoice();
  if(i<4)setTimeout(()=>updateInfo(i),80);
  else renderGame();
}

function renderGame(){
  const ga=document.getElementById("gameArea");
  if(gIdx>=qs.length){
    const pct=Math.round(gScore/qs.length*100);
    let em="&#127774;",msg="Good effort! Review the lessons and try again.";
    if(pct>=80){em="&#127881;";msg="Excellent! You are an Eco Champion!";}
    else if(pct>=60){em="&#129299;";msg="Good work! A bit more learning and you'll ace it!";}
    ga.innerHTML=`<div class="result-wrap"><div class="result-emoji">${em}</div><div class="result-score">${gScore} / ${qs.length}</div><p class="result-msg">${msg}</p><button class="restart-btn" onclick="restartGame()">Play Again &#8635;</button></div>`;
    return;
  }
  const q=qs[gIdx];
  const prog=Math.round(gIdx/qs.length*100);
  ga.innerHTML=`<div class="prog-bar"><div class="prog-fill" style="width:${prog}%"></div></div><div class="score-bar"><span class="score-lbl">Question ${gIdx+1} of ${qs.length}</span><span class="score-val">&#11088; ${gScore}</span></div><div class="q-img"><canvas id="qcv"></canvas></div><div class="q-text">${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<div class="opt" id="opt${i}" onclick="pickAns(${i})">${o}</div>`).join("")}</div><div id="qfb" style="display:none"></div><button class="next-btn" id="qnxt" style="display:none" onclick="nextQ()">Next Question &#9654;</button>`;
  gAnswered=false;
  const qcv=document.getElementById("qcv");
  if(qcv){
    const box=qcv.parentElement;const W=box.offsetWidth||340,H=Math.round(W*.75);
    qcv.width=W;qcv.height=H;
    const ctx=qcv.getContext("2d");
    const imgSrc=tabs[q.tab].imgs[q.img];
    const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,W,H);
    im.onerror=()=>fallbacks[q.tab][q.img](ctx,W,H);
    im.src=imgSrc;
  }
}

function pickAns(i){
  if(gAnswered)return;
  gAnswered=true;
  const q=qs[gIdx];
  const correct=i===q.ans;
  if(correct)gScore++;
  for(let k=0;k<4;k++){
    const el=document.getElementById("opt"+k);
    if(!el)continue;
    el.classList.add("disabled");
    if(k===q.ans)el.classList.add("correct");
    else if(k===i&&!correct)el.classList.add("wrong");
  }
  const fb=document.getElementById("qfb");
  fb.className="fb "+(correct?"ok":"bad");
  fb.textContent=(correct?"Correct! ":"Wrong! ")+q.exp;
  fb.style.display="block";
  document.getElementById("qnxt").style.display="block";
}

function nextQ(){gIdx++;renderGame();}
function restartGame(){gIdx=0;gScore=0;renderGame();}

setTimeout(()=>{
  for(let i=0;i<4;i++)updateInfo(i);
  updateInfo(0);
},150);
window.addEventListener("resize",()=>{for(let i=0;i<4;i++)makeCanvas(i);});
/* MOBILE BACK BUTTON */
history.pushState({home:true},"",location.href);
window.addEventListener("popstate",function(){
  const activeTab=document.querySelector(".tab.active");
  const idx=[...document.querySelectorAll(".tab")].indexOf(activeTab);
  if(idx!==0){
    openTab(0);
    history.pushState({home:true},"",location.href);
  }
});
</script>
